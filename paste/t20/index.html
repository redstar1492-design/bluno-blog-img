<script>
const P=[{"kind":"img","name":"01.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/01.png"},{"kind":"text","html":"<p>유예 신청을 했고, 증권사에서 \"주식은 처분되지 않을 거예요\"라는 안내까지 받았대요.</p><p>그런데 다음 주 장이 열리자마자 3억원어치 주식이 강제로 팔렸어요.</p><p>11월 초 한국투자증권 고객에게 실제로 있었던 일이에요(아시아투데이 11월 11일 보도). 증권사는 \"직원 착오로 생긴 처리 실수\"라고 했고요.</p><p><br></p><p>정부가 반대매매를 막겠다고 담보비율 140% 규칙을 풀어 준 게 11월 9일이에요.</p><p>그런데 바로 그 주 코스피 반대매매는 1,330억원, 전주 402억원보다 3배 넘게 늘었어요.</p><p>막아 준다더니 왜 이렇게 된 걸까요? 뉴스 보면서 저도 고개를 갸웃했어요.</p><p>궁금한 순서대로 하나씩 풀어 볼게요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">반대매매가 뭔데 이렇게 무서워요?</span></b></p><p><br></p><p>증권사 돈을 빌려 주식을 사면(신용융자), 증권사는 그 주식을 담보로 잡아요.</p><p>주가가 떨어져 담보가 모자라면 \"돈을 더 넣어 주세요\" 하고 연락이 오고, 정해진 날까지 못 채우면 장이 열리기 전에 내 주식을 하한가로 팔아 버려요. 이게 반대매매예요.</p><p>내 뜻과 상관없이, 제일 싼 값에, 한꺼번에 팔린다는 게 무서운 점이에요.</p><p><br></p><p>기준이 되는 숫자가 담보비율이에요. 내 계좌의 주식 값을 빌린 돈으로 나눈 숫자예요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">빌린 돈</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">계좌의 주식 값</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">담보비율</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">200%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,400만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">140% (예전 공통 기준)</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,300만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">130% (미래에셋 등 새 기준)</td></tr></table><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">정부가 뭘 풀어 줬는데요?</span></b></p><p><br></p><p>증권사는 원래 담보비율 140%를 꼭 지켜야 했어요. 이 의무를 2026년 11월 9일부터 2027년 1월 31일까지 잠깐 풀어 줬어요(금감원 비조치의견서).</p><p>그래서 증권사가 기준을 130%로 낮추거나, 신청을 받아 팔기를 하루 이틀 미뤄 줄 수 있게 됐어요.</p><p>여기까지만 들으면 \"이제 안 팔리겠네\" 싶죠. 그런데 금융당국도 \"반대매매의 전면 중단은 아니다\"라고 선을 그었어요. 빚도 이자도 그대로예요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">그런데 왜 반대매매가 3배로 늘었어요?</span></b></p>","plain":"유예 신청을 했고, 증권사에서 \"주식은 처분되지 않을 거예요\"라는 안내까지 받았대요.\n그런데 다음 주 장이 열리자마자 3억원어치 주식이 강제로 팔렸어요.\n11월 초 한국투자증권 고객에게 실제로 있었던 일이에요(아시아투데이 11월 11일 보도). 증권사는 \"직원 착오로 생긴 처리 실수\"라고 했고요.\n\n정부가 반대매매를 막겠다고 담보비율 140% 규칙을 풀어 준 게 11월 9일이에요.\n그런데 바로 그 주 코스피 반대매매는 1,330억원, 전주 402억원보다 3배 넘게 늘었어요.\n막아 준다더니 왜 이렇게 된 걸까요? 뉴스 보면서 저도 고개를 갸웃했어요.\n궁금한 순서대로 하나씩 풀어 볼게요.\n\n· · ·\n\n반대매매가 뭔데 이렇게 무서워요?\n\n증권사 돈을 빌려 주식을 사면(신용융자), 증권사는 그 주식을 담보로 잡아요.\n주가가 떨어져 담보가 모자라면 \"돈을 더 넣어 주세요\" 하고 연락이 오고, 정해진 날까지 못 채우면 장이 열리기 전에 내 주식을 하한가로 팔아 버려요. 이게 반대매매예요.\n내 뜻과 상관없이, 제일 싼 값에, 한꺼번에 팔린다는 게 무서운 점이에요.\n\n기준이 되는 숫자가 담보비율이에요. 내 계좌의 주식 값을 빌린 돈으로 나눈 숫자예요.\n\n빌린 돈\t계좌의 주식 값\t담보비율\n1,000만원\t2,000만원\t200%\n1,000만원\t1,400만원\t140% (예전 공통 기준)\n1,000만원\t1,300만원\t130% (미래에셋 등 새 기준)\n\n· · ·\n\n정부가 뭘 풀어 줬는데요?\n\n증권사는 원래 담보비율 140%를 꼭 지켜야 했어요. 이 의무를 2026년 11월 9일부터 2027년 1월 31일까지 잠깐 풀어 줬어요(금감원 비조치의견서).\n그래서 증권사가 기준을 130%로 낮추거나, 신청을 받아 팔기를 하루 이틀 미뤄 줄 수 있게 됐어요.\n여기까지만 들으면 \"이제 안 팔리겠네\" 싶죠. 그런데 금융당국도 \"반대매매의 전면 중단은 아니다\"라고 선을 그었어요. 빚도 이자도 그대로예요.\n\n· · ·\n\n그런데 왜 반대매매가 3배로 늘었어요?"},{"kind":"img","name":"02.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/02.png"},{"kind":"text","html":"<p>이유는 세 가지예요.</p><p><br></p><p>첫째, 대책이 나온 뒤에 주가가 더 빠졌어요. 기준을 10%p 낮춰 줘도 주가가 그보다 더 떨어지면 소용이 없어요.</p><p><br></p><p>둘째, 1,330억원은 미수거래 반대매매 숫자예요. 미수거래는 돈을 빌리는 게 아니라 외상으로 주식을 사는 거예요. 결제일까지 돈을 못 내면 바로 팔려요. 미수거래는 140% 담보비율 규칙과 상관없이 결제일까지 돈을 못 내면 팔리는 구조라, 이번 대책으로 막을 수 있는 숫자가 아니었어요.</p>","plain":"이유는 세 가지예요.\n\n첫째, 대책이 나온 뒤에 주가가 더 빠졌어요. 기준을 10%p 낮춰 줘도 주가가 그보다 더 떨어지면 소용이 없어요.\n\n둘째, 1,330억원은 미수거래 반대매매 숫자예요. 미수거래는 돈을 빌리는 게 아니라 외상으로 주식을 사는 거예요. 결제일까지 돈을 못 내면 바로 팔려요. 미수거래는 140% 담보비율 규칙과 상관없이 결제일까지 돈을 못 내면 팔리는 구조라, 이번 대책으로 막을 수 있는 숫자가 아니었어요."},{"kind":"img","name":"03.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/03.png"},{"kind":"text","html":"<p>셋째, 증권사마다 방식이 달라서 바로 적용받기가 어려웠어요. 투자자가 직접 신청해야 하는 곳이 많았거든요.</p><p>업계에서도 \"증권사별로 방법도 다르고 반대매매를 막기엔 너무 약했다\"는 말이 나왔어요(머니투데이 11월 17일).</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">유예 신청했는데 왜 팔렸어요?</span></b></p><p><br></p><p>맨 위 3억원 사연이 바로 이 경우예요. 신청은 했는데 증권사 안에서 처리가 빠진 거예요.</p><p>11월 9일 첫날엔 한국투자증권·삼성증권·신한투자증권이 유예 신청을 전화로만 받았어요. 전화가 몰려서 연결이 안 된다는 불만이 쏟아졌고, 온라인 창구는 그 뒤에야 열렸어요.</p><p>금융감독원은 11월 둘째 주에 주요 증권사의 반대매매 접수와 전산 처리를 점검한다고 했어요.</p><p><br></p><p>신청했다고 끝이 아니에요. \"신청이 실제로 적용됐는지\" 증권사 앱이나 고객센터에서 꼭 다시 확인하세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">내 증권사는 자동이에요, 신청해야 해요?</span></b></p>","plain":"셋째, 증권사마다 방식이 달라서 바로 적용받기가 어려웠어요. 투자자가 직접 신청해야 하는 곳이 많았거든요.\n업계에서도 \"증권사별로 방법도 다르고 반대매매를 막기엔 너무 약했다\"는 말이 나왔어요(머니투데이 11월 17일).\n\n· · ·\n\n유예 신청했는데 왜 팔렸어요?\n\n맨 위 3억원 사연이 바로 이 경우예요. 신청은 했는데 증권사 안에서 처리가 빠진 거예요.\n11월 9일 첫날엔 한국투자증권·삼성증권·신한투자증권이 유예 신청을 전화로만 받았어요. 전화가 몰려서 연결이 안 된다는 불만이 쏟아졌고, 온라인 창구는 그 뒤에야 열렸어요.\n금융감독원은 11월 둘째 주에 주요 증권사의 반대매매 접수와 전산 처리를 점검한다고 했어요.\n\n신청했다고 끝이 아니에요. \"신청이 실제로 적용됐는지\" 증권사 앱이나 고객센터에서 꼭 다시 확인하세요.\n\n· · ·\n\n내 증권사는 자동이에요, 신청해야 해요?"},{"kind":"img","name":"04.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/04.png"},{"kind":"text","html":"<p>증권사마다 달라요. 11월 11일 보도 기준으로 정리하면 이래요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">방식</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">증권사</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">내용</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">자동으로 낮춤</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">미래에셋증권, KB증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">국내 주식 140% → 130%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">미리 동의해야 낮춤</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">NH투자증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">사전 동의한 고객만 130%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">종목별로 10%p 낮춤</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">대신증권, 삼성증권, 하나증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">삼성은 9일 하루 유예 뒤 바꿈, 하나는 1회 유예도 함께</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신청하면 미뤄 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">한국투자증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">130~140%는 매일 다시 신청, 120~130%는 한 번만</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신청하면 미뤄 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">키움증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">130~140% 구간 하루 유예, 연속은 안 됨</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신청하면 미뤄 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신한투자증권, 메리츠증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신한 130% 이상, 메리츠 120% 이상(하루)</td></tr></table><p><br></p><p>신청형이라면 한 번 신청했다고 석 달 내내 안전한 게 아니에요. 한국투자증권처럼 매일 다시 신청해야 하는 곳도 있어요.</p><p>조건은 그 뒤에 바뀌었을 수 있으니 내 증권사 공지를 꼭 한 번 보세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">그래서 내 계좌는 몇 % 빠지면 팔려요?</span></b></p>","plain":"증권사마다 달라요. 11월 11일 보도 기준으로 정리하면 이래요.\n\n방식\t증권사\t내용\n자동으로 낮춤\t미래에셋증권, KB증권\t국내 주식 140% → 130%\n미리 동의해야 낮춤\tNH투자증권\t사전 동의한 고객만 130%\n종목별로 10%p 낮춤\t대신증권, 삼성증권, 하나증권\t삼성은 9일 하루 유예 뒤 바꿈, 하나는 1회 유예도 함께\n신청하면 미뤄 줌\t한국투자증권\t130~140%는 매일 다시 신청, 120~130%는 한 번만\n신청하면 미뤄 줌\t키움증권\t130~140% 구간 하루 유예, 연속은 안 됨\n신청하면 미뤄 줌\t신한투자증권, 메리츠증권\t신한 130% 이상, 메리츠 120% 이상(하루)\n\n신청형이라면 한 번 신청했다고 석 달 내내 안전한 게 아니에요. 한국투자증권처럼 매일 다시 신청해야 하는 곳도 있어요.\n조건은 그 뒤에 바뀌었을 수 있으니 내 증권사 공지를 꼭 한 번 보세요.\n\n· · ·\n\n그래서 내 계좌는 몇 % 빠지면 팔려요?"},{"kind":"img","name":"05.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/05.png"},{"kind":"text","html":"<p>내 돈 1,000만원에 1,000만원을 빌려서 2,000만원어치를 샀다고 해 볼게요(이자·수수료는 빼고 계산했어요).</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">주가</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">주식 값</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">담보비율</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">남은 내 돈</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">그대로</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">200%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">−10%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,800만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">180%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">800만원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">−20%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,600만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">160%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">600만원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">−30%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,400만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">140%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">400만원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">−35%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,300만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">130%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">300만원</td></tr></table><p><br></p><p>예전 기준이면 주가가 30% 빠질 때부터, 130%로 낮춘 곳이면 35% 빠질 때부터 팔릴 수 있어요.</p><p>그런데 표 오른쪽 끝을 보세요. 주가는 30% 빠졌는데 내 돈은 60%가 사라져 있어요.</p><p>기준이 낮아져 버틸 시간은 조금 늘었지만, 줄어든 내 돈은 그대로예요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">3개월 뒤엔 괜찮아질까요?</span></b></p>","plain":"내 돈 1,000만원에 1,000만원을 빌려서 2,000만원어치를 샀다고 해 볼게요(이자·수수료는 빼고 계산했어요).\n\n주가\t주식 값\t담보비율\t남은 내 돈\n그대로\t2,000만원\t200%\t1,000만원\n−10%\t1,800만원\t180%\t800만원\n−20%\t1,600만원\t160%\t600만원\n−30%\t1,400만원\t140%\t400만원\n−35%\t1,300만원\t130%\t300만원\n\n예전 기준이면 주가가 30% 빠질 때부터, 130%로 낮춘 곳이면 35% 빠질 때부터 팔릴 수 있어요.\n그런데 표 오른쪽 끝을 보세요. 주가는 30% 빠졌는데 내 돈은 60%가 사라져 있어요.\n기준이 낮아져 버틸 시간은 조금 늘었지만, 줄어든 내 돈은 그대로예요.\n\n· · ·\n\n3개월 뒤엔 괜찮아질까요?"},{"kind":"img","name":"06.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/06.png"},{"kind":"text","html":"<p>똑같은 조치가 2020년 코로나 폭락 때도 있었어요. 그때 결과를 보면 힌트가 있어요.</p><p>주가가 반등하자 하루 평균 반대매매가 3월 179억원에서 6월 22억원으로 확 줄었어요.</p><p>그런데 9월에 주가가 다시 7% 정도 밀리자 46억원으로 두 배 넘게 다시 늘었어요(금감원 자료, 비즈워치 11월 12일).</p><p>업계에서도 \"주가가 다시 크게 떨어지면 미뤄 둔 물량이 시차를 두고 나올 수 있다\"고 했어요.</p><p>3개월 뒤는 그때 주가에 달려 있어요. 아무도 장담 못 해요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">이미 팔렸다면 어떻게 해요?</span></b></p>","plain":"똑같은 조치가 2020년 코로나 폭락 때도 있었어요. 그때 결과를 보면 힌트가 있어요.\n주가가 반등하자 하루 평균 반대매매가 3월 179억원에서 6월 22억원으로 확 줄었어요.\n그런데 9월에 주가가 다시 7% 정도 밀리자 46억원으로 두 배 넘게 다시 늘었어요(금감원 자료, 비즈워치 11월 12일).\n업계에서도 \"주가가 다시 크게 떨어지면 미뤄 둔 물량이 시차를 두고 나올 수 있다\"고 했어요.\n3개월 뒤는 그때 주가에 달려 있어요. 아무도 장담 못 해요.\n\n· · ·\n\n이미 팔렸다면 어떻게 해요?"},{"kind":"img","name":"07.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/07.png"},{"kind":"text","html":"<p>유예를 신청했는데도 팔렸다면, 증권사에 처리 내역부터 달라고 하세요. 아래 기록이 있으면 따지기가 훨씬 쉬워요.</p><p><br></p><p>☑ 유예 신청한 날짜와 시간 (전화라면 통화 시간)</p><p>☑ 상담원이 안내한 내용 (가능하면 녹취)</p><p>☑ 신청 접수 문자나 앱 화면 캡처</p><p>☑ 그날 내 계좌 담보비율</p><p>☑ 실제로 팔린 시간과 수량</p><p><br></p><p>증권사 답이 납득되지 않으면 금융감독원에 민원을 넣을 수 있어요. 금융감독원 e-금융민원센터(www.fcsc.kr)나 국번 없이 1332로 상담할 수 있어요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">블루노 생각</span></b></p><p><br></p><p>이번 조치는 시간을 벌어 준 거예요. 빚을 줄여 준 게 아니고요.</p><p>저라면 이 석 달을 \"주가가 오르길 기다리는 시간\"보다 \"빚을 조금이라도 줄이는 시간\"으로 쓰겠어요.</p><p>그리고 신청형 증권사를 쓰신다면, 신청보다 \"적용됐는지 확인\"이 더 중요해요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">자주 묻는 질문</span></b></p><p><br></p><p><b>Q. 140% 면제됐으니 이제 반대매매 안 당하나요?</b></p><p>A. 아니에요. 기준이 조금 낮아지거나 하루 이틀 미뤄지는 것뿐이에요. 주가가 더 빠지면 팔릴 수 있어요.</p><p><br></p><p><b>Q. 미수거래도 이번에 유예되나요?</b></p><p>A. 이번 조치는 신용융자 담보비율 이야기예요. 미수거래는 결제일까지 돈을 못 내면 팔리는 구조라 따로 봐야 해요. 내 증권사에 꼭 물어보세요.</p><p><br></p><p><b>Q. 유예 기간이 끝나면요?</b></p><p>A. 2027년 1월 31일까지예요. 그 뒤엔 다시 140%로 돌아갈 수 있어요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">영상으로 보기</span></b></p>","plain":"유예를 신청했는데도 팔렸다면, 증권사에 처리 내역부터 달라고 하세요. 아래 기록이 있으면 따지기가 훨씬 쉬워요.\n\n☑ 유예 신청한 날짜와 시간 (전화라면 통화 시간)\n☑ 상담원이 안내한 내용 (가능하면 녹취)\n☑ 신청 접수 문자나 앱 화면 캡처\n☑ 그날 내 계좌 담보비율\n☑ 실제로 팔린 시간과 수량\n\n증권사 답이 납득되지 않으면 금융감독원에 민원을 넣을 수 있어요. 금융감독원 e-금융민원센터(www.fcsc.kr)나 국번 없이 1332로 상담할 수 있어요.\n\n· · ·\n\n블루노 생각\n\n이번 조치는 시간을 벌어 준 거예요. 빚을 줄여 준 게 아니고요.\n저라면 이 석 달을 \"주가가 오르길 기다리는 시간\"보다 \"빚을 조금이라도 줄이는 시간\"으로 쓰겠어요.\n그리고 신청형 증권사를 쓰신다면, 신청보다 \"적용됐는지 확인\"이 더 중요해요.\n\n· · ·\n\n자주 묻는 질문\n\nQ. 140% 면제됐으니 이제 반대매매 안 당하나요?\nA. 아니에요. 기준이 조금 낮아지거나 하루 이틀 미뤄지는 것뿐이에요. 주가가 더 빠지면 팔릴 수 있어요.\n\nQ. 미수거래도 이번에 유예되나요?\nA. 이번 조치는 신용융자 담보비율 이야기예요. 미수거래는 결제일까지 돈을 못 내면 팔리는 구조라 따로 봐야 해요. 내 증권사에 꼭 물어보세요.\n\nQ. 유예 기간이 끝나면요?\nA. 2027년 1월 31일까지예요. 그 뒤엔 다시 140%로 돌아갈 수 있어요.\n\n· · ·\n\n영상으로 보기"},{"kind":"img","name":"thumb.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/thumb.png"},{"kind":"text","html":"<p>140% 면제가 처음 나왔을 때 영상으로도 정리해 뒀어요.</p><p>▶ 영상 보기: <a href=\"https://youtu.be/_m-2uD_CPAs\">https://youtu.be/_m-2uD_CPAs</a></p><p>▶ 짧게 보는 쇼츠: <a href=\"https://youtube.com/shorts/vUw3mxoGXJE\">https://youtube.com/shorts/vUw3mxoGXJE</a></p><p><br></p><p>여러분 증권사는 자동이었나요, 신청해야 했나요? 댓글로 알려 주시면 같은 증권사 쓰는 분들께 큰 도움이 돼요 🙂</p><p><br></p><p>출처: 아시아투데이(2026.11.11, 3억원 강제 매도·증권사별 방식·금감원 점검), 머니투데이(2026.11.17, 금융투자협회 종합통계포털 반대매매 1,330억원), 비즈워치(2026.11.12, 2020년 사례), 파이낸셜뉴스·한국경제(2026.11.8, 면제 기간), 이코노믹리뷰(2026.11.6)</p><p>계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 증권사 조건은 보도 당시 기준이라 바뀌었을 수 있어요. 이 글은 정보 제공용이며 특정 투자를 권하지 않아요.</p>","plain":"140% 면제가 처음 나왔을 때 영상으로도 정리해 뒀어요.\n▶ 영상 보기: https://youtu.be/_m-2uD_CPAs\n▶ 짧게 보는 쇼츠: https://youtube.com/shorts/vUw3mxoGXJE\n\n여러분 증권사는 자동이었나요, 신청해야 했나요? 댓글로 알려 주시면 같은 증권사 쓰는 분들께 큰 도움이 돼요 🙂\n\n출처: 아시아투데이(2026.11.11, 3억원 강제 매도·증권사별 방식·금감원 점검), 머니투데이(2026.11.17, 금융투자협회 종합통계포털 반대매매 1,330억원), 비즈워치(2026.11.12, 2020년 사례), 파이낸셜뉴스·한국경제(2026.11.8, 면제 기간), 이코노믹리뷰(2026.11.6)\n계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 증권사 조건은 보도 당시 기준이라 바뀌었을 수 있어요. 이 글은 정보 제공용이며 특정 투자를 권하지 않아요."}];
const FULL="<p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/01.png\" style=\"max-width:100%\"></p><p>유예 신청을 했고, 증권사에서 \"주식은 처분되지 않을 거예요\"라는 안내까지 받았대요.</p><p>그런데 다음 주 장이 열리자마자 3억원어치 주식이 강제로 팔렸어요.</p><p>11월 초 한국투자증권 고객에게 실제로 있었던 일이에요(아시아투데이 11월 11일 보도). 증권사는 \"직원 착오로 생긴 처리 실수\"라고 했고요.</p><p><br></p><p>정부가 반대매매를 막겠다고 담보비율 140% 규칙을 풀어 준 게 11월 9일이에요.</p><p>그런데 바로 그 주 코스피 반대매매는 1,330억원, 전주 402억원보다 3배 넘게 늘었어요.</p><p>막아 준다더니 왜 이렇게 된 걸까요? 뉴스 보면서 저도 고개를 갸웃했어요.</p><p>궁금한 순서대로 하나씩 풀어 볼게요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">반대매매가 뭔데 이렇게 무서워요?</span></b></p><p><br></p><p>증권사 돈을 빌려 주식을 사면(신용융자), 증권사는 그 주식을 담보로 잡아요.</p><p>주가가 떨어져 담보가 모자라면 \"돈을 더 넣어 주세요\" 하고 연락이 오고, 정해진 날까지 못 채우면 장이 열리기 전에 내 주식을 하한가로 팔아 버려요. 이게 반대매매예요.</p><p>내 뜻과 상관없이, 제일 싼 값에, 한꺼번에 팔린다는 게 무서운 점이에요.</p><p><br></p><p>기준이 되는 숫자가 담보비율이에요. 내 계좌의 주식 값을 빌린 돈으로 나눈 숫자예요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">빌린 돈</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">계좌의 주식 값</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">담보비율</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">200%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,400만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">140% (예전 공통 기준)</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,300만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">130% (미래에셋 등 새 기준)</td></tr></table><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">정부가 뭘 풀어 줬는데요?</span></b></p><p><br></p><p>증권사는 원래 담보비율 140%를 꼭 지켜야 했어요. 이 의무를 2026년 11월 9일부터 2027년 1월 31일까지 잠깐 풀어 줬어요(금감원 비조치의견서).</p><p>그래서 증권사가 기준을 130%로 낮추거나, 신청을 받아 팔기를 하루 이틀 미뤄 줄 수 있게 됐어요.</p><p>여기까지만 들으면 \"이제 안 팔리겠네\" 싶죠. 그런데 금융당국도 \"반대매매의 전면 중단은 아니다\"라고 선을 그었어요. 빚도 이자도 그대로예요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">그런데 왜 반대매매가 3배로 늘었어요?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/02.png\" style=\"max-width:100%\"></p><p>이유는 세 가지예요.</p><p><br></p><p>첫째, 대책이 나온 뒤에 주가가 더 빠졌어요. 기준을 10%p 낮춰 줘도 주가가 그보다 더 떨어지면 소용이 없어요.</p><p><br></p><p>둘째, 1,330억원은 미수거래 반대매매 숫자예요. 미수거래는 돈을 빌리는 게 아니라 외상으로 주식을 사는 거예요. 결제일까지 돈을 못 내면 바로 팔려요. 미수거래는 140% 담보비율 규칙과 상관없이 결제일까지 돈을 못 내면 팔리는 구조라, 이번 대책으로 막을 수 있는 숫자가 아니었어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/03.png\" style=\"max-width:100%\"></p><p>셋째, 증권사마다 방식이 달라서 바로 적용받기가 어려웠어요. 투자자가 직접 신청해야 하는 곳이 많았거든요.</p><p>업계에서도 \"증권사별로 방법도 다르고 반대매매를 막기엔 너무 약했다\"는 말이 나왔어요(머니투데이 11월 17일).</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">유예 신청했는데 왜 팔렸어요?</span></b></p><p><br></p><p>맨 위 3억원 사연이 바로 이 경우예요. 신청은 했는데 증권사 안에서 처리가 빠진 거예요.</p><p>11월 9일 첫날엔 한국투자증권·삼성증권·신한투자증권이 유예 신청을 전화로만 받았어요. 전화가 몰려서 연결이 안 된다는 불만이 쏟아졌고, 온라인 창구는 그 뒤에야 열렸어요.</p><p>금융감독원은 11월 둘째 주에 주요 증권사의 반대매매 접수와 전산 처리를 점검한다고 했어요.</p><p><br></p><p>신청했다고 끝이 아니에요. \"신청이 실제로 적용됐는지\" 증권사 앱이나 고객센터에서 꼭 다시 확인하세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">내 증권사는 자동이에요, 신청해야 해요?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/04.png\" style=\"max-width:100%\"></p><p>증권사마다 달라요. 11월 11일 보도 기준으로 정리하면 이래요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">방식</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">증권사</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">내용</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">자동으로 낮춤</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">미래에셋증권, KB증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">국내 주식 140% → 130%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">미리 동의해야 낮춤</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">NH투자증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">사전 동의한 고객만 130%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">종목별로 10%p 낮춤</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">대신증권, 삼성증권, 하나증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">삼성은 9일 하루 유예 뒤 바꿈, 하나는 1회 유예도 함께</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신청하면 미뤄 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">한국투자증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">130~140%는 매일 다시 신청, 120~130%는 한 번만</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신청하면 미뤄 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">키움증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">130~140% 구간 하루 유예, 연속은 안 됨</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신청하면 미뤄 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신한투자증권, 메리츠증권</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신한 130% 이상, 메리츠 120% 이상(하루)</td></tr></table><p><br></p><p>신청형이라면 한 번 신청했다고 석 달 내내 안전한 게 아니에요. 한국투자증권처럼 매일 다시 신청해야 하는 곳도 있어요.</p><p>조건은 그 뒤에 바뀌었을 수 있으니 내 증권사 공지를 꼭 한 번 보세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">그래서 내 계좌는 몇 % 빠지면 팔려요?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/05.png\" style=\"max-width:100%\"></p><p>내 돈 1,000만원에 1,000만원을 빌려서 2,000만원어치를 샀다고 해 볼게요(이자·수수료는 빼고 계산했어요).</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">주가</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">주식 값</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">담보비율</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">남은 내 돈</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">그대로</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">200%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">−10%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,800만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">180%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">800만원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">−20%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,600만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">160%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">600만원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">−30%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,400만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">140%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">400만원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">−35%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,300만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">130%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">300만원</td></tr></table><p><br></p><p>예전 기준이면 주가가 30% 빠질 때부터, 130%로 낮춘 곳이면 35% 빠질 때부터 팔릴 수 있어요.</p><p>그런데 표 오른쪽 끝을 보세요. 주가는 30% 빠졌는데 내 돈은 60%가 사라져 있어요.</p><p>기준이 낮아져 버틸 시간은 조금 늘었지만, 줄어든 내 돈은 그대로예요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">3개월 뒤엔 괜찮아질까요?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/06.png\" style=\"max-width:100%\"></p><p>똑같은 조치가 2020년 코로나 폭락 때도 있었어요. 그때 결과를 보면 힌트가 있어요.</p><p>주가가 반등하자 하루 평균 반대매매가 3월 179억원에서 6월 22억원으로 확 줄었어요.</p><p>그런데 9월에 주가가 다시 7% 정도 밀리자 46억원으로 두 배 넘게 다시 늘었어요(금감원 자료, 비즈워치 11월 12일).</p><p>업계에서도 \"주가가 다시 크게 떨어지면 미뤄 둔 물량이 시차를 두고 나올 수 있다\"고 했어요.</p><p>3개월 뒤는 그때 주가에 달려 있어요. 아무도 장담 못 해요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">이미 팔렸다면 어떻게 해요?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/07.png\" style=\"max-width:100%\"></p><p>유예를 신청했는데도 팔렸다면, 증권사에 처리 내역부터 달라고 하세요. 아래 기록이 있으면 따지기가 훨씬 쉬워요.</p><p><br></p><p>☑ 유예 신청한 날짜와 시간 (전화라면 통화 시간)</p><p>☑ 상담원이 안내한 내용 (가능하면 녹취)</p><p>☑ 신청 접수 문자나 앱 화면 캡처</p><p>☑ 그날 내 계좌 담보비율</p><p>☑ 실제로 팔린 시간과 수량</p><p><br></p><p>증권사 답이 납득되지 않으면 금융감독원에 민원을 넣을 수 있어요. 금융감독원 e-금융민원센터(www.fcsc.kr)나 국번 없이 1332로 상담할 수 있어요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">블루노 생각</span></b></p><p><br></p><p>이번 조치는 시간을 벌어 준 거예요. 빚을 줄여 준 게 아니고요.</p><p>저라면 이 석 달을 \"주가가 오르길 기다리는 시간\"보다 \"빚을 조금이라도 줄이는 시간\"으로 쓰겠어요.</p><p>그리고 신청형 증권사를 쓰신다면, 신청보다 \"적용됐는지 확인\"이 더 중요해요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">자주 묻는 질문</span></b></p><p><br></p><p><b>Q. 140% 면제됐으니 이제 반대매매 안 당하나요?</b></p><p>A. 아니에요. 기준이 조금 낮아지거나 하루 이틀 미뤄지는 것뿐이에요. 주가가 더 빠지면 팔릴 수 있어요.</p><p><br></p><p><b>Q. 미수거래도 이번에 유예되나요?</b></p><p>A. 이번 조치는 신용융자 담보비율 이야기예요. 미수거래는 결제일까지 돈을 못 내면 팔리는 구조라 따로 봐야 해요. 내 증권사에 꼭 물어보세요.</p><p><br></p><p><b>Q. 유예 기간이 끝나면요?</b></p><p>A. 2027년 1월 31일까지예요. 그 뒤엔 다시 140%로 돌아갈 수 있어요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">영상으로 보기</span></b></p><p style=\"text-align:center\"><a href=\"https://youtu.be/_m-2uD_CPAs\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20b/thumb.png\" style=\"max-width:100%\"></a></p><p>140% 면제가 처음 나왔을 때 영상으로도 정리해 뒀어요.</p><p>▶ 영상 보기: <a href=\"https://youtu.be/_m-2uD_CPAs\">https://youtu.be/_m-2uD_CPAs</a></p><p>▶ 짧게 보는 쇼츠: <a href=\"https://youtube.com/shorts/vUw3mxoGXJE\">https://youtube.com/shorts/vUw3mxoGXJE</a></p><p><br></p><p>여러분 증권사는 자동이었나요, 신청해야 했나요? 댓글로 알려 주시면 같은 증권사 쓰는 분들께 큰 도움이 돼요 🙂</p><p><br></p><p>출처: 아시아투데이(2026.11.11, 3억원 강제 매도·증권사별 방식·금감원 점검), 머니투데이(2026.11.17, 금융투자협회 종합통계포털 반대매매 1,330억원), 비즈워치(2026.11.12, 2020년 사례), 파이낸셜뉴스·한국경제(2026.11.8, 면제 기간), 이코노믹리뷰(2026.11.6)</p><p>계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 증권사 조건은 보도 당시 기준이라 바뀌었을 수 있어요. 이 글은 정보 제공용이며 특정 투자를 권하지 않아요.</p><p><br></p><p>#반대매매 #반대매매유예 #담보비율 #담보비율140% #신용융자 #미수거래 #빚투 #깡통계좌 #한국투자증권반대매매 #블루노</p>", FULLPLAIN="\n\n유예 신청을 했고, 증권사에서 \"주식은 처분되지 않을 거예요\"라는 안내까지 받았대요.\n그런데 다음 주 장이 열리자마자 3억원어치 주식이 강제로 팔렸어요.\n11월 초 한국투자증권 고객에게 실제로 있었던 일이에요(아시아투데이 11월 11일 보도). 증권사는 \"직원 착오로 생긴 처리 실수\"라고 했고요.\n\n정부가 반대매매를 막겠다고 담보비율 140% 규칙을 풀어 준 게 11월 9일이에요.\n그런데 바로 그 주 코스피 반대매매는 1,330억원, 전주 402억원보다 3배 넘게 늘었어요.\n막아 준다더니 왜 이렇게 된 걸까요? 뉴스 보면서 저도 고개를 갸웃했어요.\n궁금한 순서대로 하나씩 풀어 볼게요.\n\n· · ·\n\n반대매매가 뭔데 이렇게 무서워요?\n\n증권사 돈을 빌려 주식을 사면(신용융자), 증권사는 그 주식을 담보로 잡아요.\n주가가 떨어져 담보가 모자라면 \"돈을 더 넣어 주세요\" 하고 연락이 오고, 정해진 날까지 못 채우면 장이 열리기 전에 내 주식을 하한가로 팔아 버려요. 이게 반대매매예요.\n내 뜻과 상관없이, 제일 싼 값에, 한꺼번에 팔린다는 게 무서운 점이에요.\n\n기준이 되는 숫자가 담보비율이에요. 내 계좌의 주식 값을 빌린 돈으로 나눈 숫자예요.\n\n빌린 돈\t계좌의 주식 값\t담보비율\n1,000만원\t2,000만원\t200%\n1,000만원\t1,400만원\t140% (예전 공통 기준)\n1,000만원\t1,300만원\t130% (미래에셋 등 새 기준)\n\n· · ·\n\n정부가 뭘 풀어 줬는데요?\n\n증권사는 원래 담보비율 140%를 꼭 지켜야 했어요. 이 의무를 2026년 11월 9일부터 2027년 1월 31일까지 잠깐 풀어 줬어요(금감원 비조치의견서).\n그래서 증권사가 기준을 130%로 낮추거나, 신청을 받아 팔기를 하루 이틀 미뤄 줄 수 있게 됐어요.\n여기까지만 들으면 \"이제 안 팔리겠네\" 싶죠. 그런데 금융당국도 \"반대매매의 전면 중단은 아니다\"라고 선을 그었어요. 빚도 이자도 그대로예요.\n\n· · ·\n\n그런데 왜 반대매매가 3배로 늘었어요?\n\n\n\n이유는 세 가지예요.\n\n첫째, 대책이 나온 뒤에 주가가 더 빠졌어요. 기준을 10%p 낮춰 줘도 주가가 그보다 더 떨어지면 소용이 없어요.\n\n둘째, 1,330억원은 미수거래 반대매매 숫자예요. 미수거래는 돈을 빌리는 게 아니라 외상으로 주식을 사는 거예요. 결제일까지 돈을 못 내면 바로 팔려요. 미수거래는 140% 담보비율 규칙과 상관없이 결제일까지 돈을 못 내면 팔리는 구조라, 이번 대책으로 막을 수 있는 숫자가 아니었어요.\n\n\n\n셋째, 증권사마다 방식이 달라서 바로 적용받기가 어려웠어요. 투자자가 직접 신청해야 하는 곳이 많았거든요.\n업계에서도 \"증권사별로 방법도 다르고 반대매매를 막기엔 너무 약했다\"는 말이 나왔어요(머니투데이 11월 17일).\n\n· · ·\n\n유예 신청했는데 왜 팔렸어요?\n\n맨 위 3억원 사연이 바로 이 경우예요. 신청은 했는데 증권사 안에서 처리가 빠진 거예요.\n11월 9일 첫날엔 한국투자증권·삼성증권·신한투자증권이 유예 신청을 전화로만 받았어요. 전화가 몰려서 연결이 안 된다는 불만이 쏟아졌고, 온라인 창구는 그 뒤에야 열렸어요.\n금융감독원은 11월 둘째 주에 주요 증권사의 반대매매 접수와 전산 처리를 점검한다고 했어요.\n\n신청했다고 끝이 아니에요. \"신청이 실제로 적용됐는지\" 증권사 앱이나 고객센터에서 꼭 다시 확인하세요.\n\n· · ·\n\n내 증권사는 자동이에요, 신청해야 해요?\n\n\n\n증권사마다 달라요. 11월 11일 보도 기준으로 정리하면 이래요.\n\n방식\t증권사\t내용\n자동으로 낮춤\t미래에셋증권, KB증권\t국내 주식 140% → 130%\n미리 동의해야 낮춤\tNH투자증권\t사전 동의한 고객만 130%\n종목별로 10%p 낮춤\t대신증권, 삼성증권, 하나증권\t삼성은 9일 하루 유예 뒤 바꿈, 하나는 1회 유예도 함께\n신청하면 미뤄 줌\t한국투자증권\t130~140%는 매일 다시 신청, 120~130%는 한 번만\n신청하면 미뤄 줌\t키움증권\t130~140% 구간 하루 유예, 연속은 안 됨\n신청하면 미뤄 줌\t신한투자증권, 메리츠증권\t신한 130% 이상, 메리츠 120% 이상(하루)\n\n신청형이라면 한 번 신청했다고 석 달 내내 안전한 게 아니에요. 한국투자증권처럼 매일 다시 신청해야 하는 곳도 있어요.\n조건은 그 뒤에 바뀌었을 수 있으니 내 증권사 공지를 꼭 한 번 보세요.\n\n· · ·\n\n그래서 내 계좌는 몇 % 빠지면 팔려요?\n\n\n\n내 돈 1,000만원에 1,000만원을 빌려서 2,000만원어치를 샀다고 해 볼게요(이자·수수료는 빼고 계산했어요).\n\n주가\t주식 값\t담보비율\t남은 내 돈\n그대로\t2,000만원\t200%\t1,000만원\n−10%\t1,800만원\t180%\t800만원\n−20%\t1,600만원\t160%\t600만원\n−30%\t1,400만원\t140%\t400만원\n−35%\t1,300만원\t130%\t300만원\n\n예전 기준이면 주가가 30% 빠질 때부터, 130%로 낮춘 곳이면 35% 빠질 때부터 팔릴 수 있어요.\n그런데 표 오른쪽 끝을 보세요. 주가는 30% 빠졌는데 내 돈은 60%가 사라져 있어요.\n기준이 낮아져 버틸 시간은 조금 늘었지만, 줄어든 내 돈은 그대로예요.\n\n· · ·\n\n3개월 뒤엔 괜찮아질까요?\n\n\n\n똑같은 조치가 2020년 코로나 폭락 때도 있었어요. 그때 결과를 보면 힌트가 있어요.\n주가가 반등하자 하루 평균 반대매매가 3월 179억원에서 6월 22억원으로 확 줄었어요.\n그런데 9월에 주가가 다시 7% 정도 밀리자 46억원으로 두 배 넘게 다시 늘었어요(금감원 자료, 비즈워치 11월 12일).\n업계에서도 \"주가가 다시 크게 떨어지면 미뤄 둔 물량이 시차를 두고 나올 수 있다\"고 했어요.\n3개월 뒤는 그때 주가에 달려 있어요. 아무도 장담 못 해요.\n\n· · ·\n\n이미 팔렸다면 어떻게 해요?\n\n\n\n유예를 신청했는데도 팔렸다면, 증권사에 처리 내역부터 달라고 하세요. 아래 기록이 있으면 따지기가 훨씬 쉬워요.\n\n☑ 유예 신청한 날짜와 시간 (전화라면 통화 시간)\n☑ 상담원이 안내한 내용 (가능하면 녹취)\n☑ 신청 접수 문자나 앱 화면 캡처\n☑ 그날 내 계좌 담보비율\n☑ 실제로 팔린 시간과 수량\n\n증권사 답이 납득되지 않으면 금융감독원에 민원을 넣을 수 있어요. 금융감독원 e-금융민원센터(www.fcsc.kr)나 국번 없이 1332로 상담할 수 있어요.\n\n· · ·\n\n블루노 생각\n\n이번 조치는 시간을 벌어 준 거예요. 빚을 줄여 준 게 아니고요.\n저라면 이 석 달을 \"주가가 오르길 기다리는 시간\"보다 \"빚을 조금이라도 줄이는 시간\"으로 쓰겠어요.\n그리고 신청형 증권사를 쓰신다면, 신청보다 \"적용됐는지 확인\"이 더 중요해요.\n\n· · ·\n\n자주 묻는 질문\n\nQ. 140% 면제됐으니 이제 반대매매 안 당하나요?\nA. 아니에요. 기준이 조금 낮아지거나 하루 이틀 미뤄지는 것뿐이에요. 주가가 더 빠지면 팔릴 수 있어요.\n\nQ. 미수거래도 이번에 유예되나요?\nA. 이번 조치는 신용융자 담보비율 이야기예요. 미수거래는 결제일까지 돈을 못 내면 팔리는 구조라 따로 봐야 해요. 내 증권사에 꼭 물어보세요.\n\nQ. 유예 기간이 끝나면요?\nA. 2027년 1월 31일까지예요. 그 뒤엔 다시 140%로 돌아갈 수 있어요.\n\n· · ·\n\n영상으로 보기\n\n\n\n140% 면제가 처음 나왔을 때 영상으로도 정리해 뒀어요.\n▶ 영상 보기: https://youtu.be/_m-2uD_CPAs\n▶ 짧게 보는 쇼츠: https://youtube.com/shorts/vUw3mxoGXJE\n\n여러분 증권사는 자동이었나요, 신청해야 했나요? 댓글로 알려 주시면 같은 증권사 쓰는 분들께 큰 도움이 돼요 🙂\n\n출처: 아시아투데이(2026.11.11, 3억원 강제 매도·증권사별 방식·금감원 점검), 머니투데이(2026.11.17, 금융투자협회 종합통계포털 반대매매 1,330억원), 비즈워치(2026.11.12, 2020년 사례), 파이낸셜뉴스·한국경제(2026.11.8, 면제 기간), 이코노믹리뷰(2026.11.6)\n계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 증권사 조건은 보도 당시 기준이라 바뀌었을 수 있어요. 이 글은 정보 제공용이며 특정 투자를 권하지 않아요.\n\n#반대매매 #반대매매유예 #담보비율 #담보비율140% #신용융자 #미수거래 #빚투 #깡통계좌 #한국투자증권반대매매 #블루노";
