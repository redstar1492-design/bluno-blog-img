<script>
const P=[{"kind":"img","name":"hero.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/hero.png"},{"kind":"text","html":"<p><span style=\"background-color:#fff8b2\"><b>※ 주식을 전혀 몰라도 편하게 읽을 수 있도록 쉽게 썼어요 ※</b></span></p><p><br></p><p>증권사에 \"팔지 말아 주세요\" 하고 신청을 했대요.</p><p>\"네, 처분되지 않을 거예요\"라는 대답까지 들었고요.</p><p><br></p><p>그런데 다음 주 아침, 장이 열리자마자 3억원어치 주식이 팔려 나갔어요.</p><p><br></p><p>11월 초에 실제로 있었던 일이에요.</p><p>도대체 무슨 일이 있었던 걸까요?</p>","plain":"※ 주식을 전혀 몰라도 편하게 읽을 수 있도록 쉽게 썼어요 ※\n\n증권사에 \"팔지 말아 주세요\" 하고 신청을 했대요.\n\"네, 처분되지 않을 거예요\"라는 대답까지 들었고요.\n\n그런데 다음 주 아침, 장이 열리자마자 3억원어치 주식이 팔려 나갔어요.\n\n11월 초에 실제로 있었던 일이에요.\n도대체 무슨 일이 있었던 걸까요?"},{"kind":"img","name":"h1.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h01.png"},{"kind":"img","name":"news/a1-asiatoday.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/news/a1-asiatoday.png"},{"kind":"text","html":"<p>한국투자증권을 쓰던 한 투자자의 이야기예요.</p><p><br></p><p>주가가 떨어져서 증권사가 주식을 팔 수도 있는 상황이 됐어요.</p><p>그래서 증권사 안내대로 \"팔기를 잠깐 미뤄 주세요\"(반대매매 유예) 하고 신청했어요.</p><p><br></p><p>그런데 다음 주 장이 열리자마자 <span style=\"background-color:#fff8b2\"><b>3억원가량이 강제로 팔렸어요.</b></span></p><p>증권사는 \"직원 착오로 생긴 처리 실수\"라고 밝혔어요(아시아투데이 11월 11일).</p><p><br></p><p>그렇다면 이건 이 한 사람만 겪은 일이었을까요?</p>","plain":"한국투자증권을 쓰던 한 투자자의 이야기예요.\n\n주가가 떨어져서 증권사가 주식을 팔 수도 있는 상황이 됐어요.\n그래서 증권사 안내대로 \"팔기를 잠깐 미뤄 주세요\"(반대매매 유예) 하고 신청했어요.\n\n그런데 다음 주 장이 열리자마자 3억원가량이 강제로 팔렸어요.\n증권사는 \"직원 착오로 생긴 처리 실수\"라고 밝혔어요(아시아투데이 11월 11일).\n\n그렇다면 이건 이 한 사람만 겪은 일이었을까요?"},{"kind":"img","name":"h2.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h02.png"},{"kind":"img","name":"news/a2-mt-231.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/news/a2-mt-231.png"},{"kind":"text","html":"<p>정부는 11월 9일부터 반대매매를 줄이겠다고 규칙을 풀어 줬어요.</p><p><br></p><p>그런데 바로 그 주(11월 9~13일) 코스피에서 반대매매로 팔린 금액(금융투자협회 집계)은 <span style=\"background-color:#fff8b2\"><b>1,330억원</b></span>이었어요.</p><p>그 전 주가 402억원이었으니, <span style=\"background-color:#fff8b2\"><b>3배 넘게 늘어난 거예요.</b></span></p>","plain":"정부는 11월 9일부터 반대매매를 줄이겠다고 규칙을 풀어 줬어요.\n\n그런데 바로 그 주(11월 9~13일) 코스피에서 반대매매로 팔린 금액(금융투자협회 집계)은 1,330억원이었어요.\n그 전 주가 402억원이었으니, 3배 넘게 늘어난 거예요."},{"kind":"img","name":"01.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/01.png"},{"kind":"text","html":"<p>막아 준다고 했는데 왜 더 늘었을까요?</p><p>이걸 알려면 반대매매가 뭔지부터 알아야 해요.</p>","plain":"막아 준다고 했는데 왜 더 늘었을까요?\n이걸 알려면 반대매매가 뭔지부터 알아야 해요."},{"kind":"img","name":"h3.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h03.png"},{"kind":"img","name":"ring.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/ring.png"},{"kind":"text","html":"<p>금은방이나 전당포를 떠올려 보세요.</p><p><br></p><p>금반지를 맡기고 100만원을 빌렸어요.</p><p>그런데 금값이 뚝 떨어져서 반지 값이 빌린 돈보다 적어질 것 같아요.</p><p><br></p><p>그러면 전당포가 연락해요. \"돈을 조금 더 가져오세요.\"</p><p>못 가져오면? <span style=\"background-color:#fff8b2\"><b>전당포가 반지를 팔아서 빌려준 돈을 가져가요.</b></span></p><p><br></p><p>주식도 똑같아요.</p><p>증권사에서 돈을 빌려 주식을 사면(이걸 신용융자라고 해요), 그 주식이 금반지 역할을 해요.</p><p>주가가 떨어지면 증권사가 \"돈 더 넣어 주세요\" 하고, 못 넣으면 <span style=\"background-color:#fff8b2\"><b>내 주식을 내 허락 없이 팔아 버려요.</b></span> 이게 반대매매예요.</p><p><br></p><p>그럼 \"얼마나 떨어져야\" 팔릴까요? 숫자로 볼게요.</p><p><br></p><p>내 돈 1,000만원에 증권사 돈 1,000만원을 빌려서, 2,000만원어치 주식을 샀다고 해 볼게요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">주가</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">내 주식 값</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">빌린 돈</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">담보비율</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">처음</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">200%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">20% 떨어짐</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,600만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">160%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">30% 떨어짐</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,400만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">140%</td></tr></table><p><br></p><p>담보비율은 \"내 주식 값이 빌린 돈의 몇 배냐\"를 %로 쓴 거예요.</p><p>지금까지는 이 숫자가 <span style=\"background-color:#fff8b2\"><b>140% 아래로 내려가면</b></span> 팔릴 수 있었어요.</p>","plain":"금은방이나 전당포를 떠올려 보세요.\n\n금반지를 맡기고 100만원을 빌렸어요.\n그런데 금값이 뚝 떨어져서 반지 값이 빌린 돈보다 적어질 것 같아요.\n\n그러면 전당포가 연락해요. \"돈을 조금 더 가져오세요.\"\n못 가져오면? 전당포가 반지를 팔아서 빌려준 돈을 가져가요.\n\n주식도 똑같아요.\n증권사에서 돈을 빌려 주식을 사면(이걸 신용융자라고 해요), 그 주식이 금반지 역할을 해요.\n주가가 떨어지면 증권사가 \"돈 더 넣어 주세요\" 하고, 못 넣으면 내 주식을 내 허락 없이 팔아 버려요. 이게 반대매매예요.\n\n그럼 \"얼마나 떨어져야\" 팔릴까요? 숫자로 볼게요.\n\n내 돈 1,000만원에 증권사 돈 1,000만원을 빌려서, 2,000만원어치 주식을 샀다고 해 볼게요.\n\n주가\t내 주식 값\t빌린 돈\t담보비율\n처음\t2,000만원\t1,000만원\t200%\n20% 떨어짐\t1,600만원\t1,000만원\t160%\n30% 떨어짐\t1,400만원\t1,000만원\t140%\n\n담보비율은 \"내 주식 값이 빌린 돈의 몇 배냐\"를 %로 쓴 거예요.\n지금까지는 이 숫자가 140% 아래로 내려가면 팔릴 수 있었어요."},{"kind":"img","name":"h4.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h04.png"},{"kind":"img","name":"news/n3-hk-mirae.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/news/n3-hk-mirae.png"},{"kind":"text","html":"<p>원래 증권사는 이 140%를 꼭 지켜야 했어요.</p><p>정부가 이 의무를 <span style=\"background-color:#fff8b2\"><b>2026년 11월 9일부터 2027년 1월 31일까지</b></span> 잠깐 풀어 줬어요.</p><p><br></p><p>그래서 미래에셋증권은 기준을 130%로 낮췄고, 어떤 증권사는 신청하면 하루 이틀 팔기를 미뤄 주기로 했어요.</p><p><br></p><p>그래도 <span style=\"background-color:#fff8b2\"><b>빚이 줄어드는 건 아니에요.</b></span> 팔리는 날이 조금 늦춰질 뿐이고, 빌린 돈과 이자는 그대로예요.</p><p>금융당국도 \"반대매매가 전부 멈추는 건 아니다\"라고 했어요.</p>","plain":"원래 증권사는 이 140%를 꼭 지켜야 했어요.\n정부가 이 의무를 2026년 11월 9일부터 2027년 1월 31일까지 잠깐 풀어 줬어요.\n\n그래서 미래에셋증권은 기준을 130%로 낮췄고, 어떤 증권사는 신청하면 하루 이틀 팔기를 미뤄 주기로 했어요.\n\n그래도 빚이 줄어드는 건 아니에요. 팔리는 날이 조금 늦춰질 뿐이고, 빌린 돈과 이자는 그대로예요.\n금융당국도 \"반대매매가 전부 멈추는 건 아니다\"라고 했어요."},{"kind":"img","name":"h5.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h05.png"},{"kind":"img","name":"03.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/03.png"},{"kind":"text","html":"<p>이유는 크게 세 가지예요.</p><p><br></p><p>첫째, <span style=\"background-color:#fff8b2\"><b>대책이 나온 뒤에 주가가 더 떨어졌어요.</b></span></p><p>기준을 조금 낮춰 줘도, 주가가 그보다 더 떨어지면 소용이 없어요.</p><p><br></p><p>둘째, 이 1,330억원은 <span style=\"background-color:#fff8b2\"><b>미수거래</b></span>에서 나온 숫자예요.</p><p>미수거래는 돈을 빌리는 게 아니라 \"외상으로\" 주식을 먼저 사는 거예요. 정해진 날까지 돈을 못 내면 바로 팔려요.</p><p>140% 규칙과는 상관이 없어서, 이번 대책으로 막을 수가 없었어요.</p><p><br></p><p>셋째, 증권사마다 방식이 달라서 <span style=\"background-color:#fff8b2\"><b>직접 신청해야 하는 곳이 많았어요.</b></span></p><p>첫날엔 전화로만 받는 곳도 있어서, 전화 연결이 안 된다는 불만이 쏟아졌어요.</p>","plain":"이유는 크게 세 가지예요.\n\n첫째, 대책이 나온 뒤에 주가가 더 떨어졌어요.\n기준을 조금 낮춰 줘도, 주가가 그보다 더 떨어지면 소용이 없어요.\n\n둘째, 이 1,330억원은 미수거래에서 나온 숫자예요.\n미수거래는 돈을 빌리는 게 아니라 \"외상으로\" 주식을 먼저 사는 거예요. 정해진 날까지 돈을 못 내면 바로 팔려요.\n140% 규칙과는 상관이 없어서, 이번 대책으로 막을 수가 없었어요.\n\n셋째, 증권사마다 방식이 달라서 직접 신청해야 하는 곳이 많았어요.\n첫날엔 전화로만 받는 곳도 있어서, 전화 연결이 안 된다는 불만이 쏟아졌어요."},{"kind":"img","name":"h6.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h06.png"},{"kind":"img","name":"04.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/04.png"},{"kind":"text","html":"<p>증권사마다 달라요. 11월 11일 기사 기준으로 정리하면 이래요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">이렇게 해요</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">증권사</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">알아서 130%로 낮춰 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">미래에셋증권, KB증권</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">미리 동의한 사람만 130%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">NH투자증권</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">종목마다 10%p씩 낮춤</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">대신증권, 삼성증권, 하나증권</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신청해야 팔기를 미뤄 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">한국투자증권, 키움증권, 신한투자증권, 메리츠증권</td></tr></table><p><br></p><p><span style=\"background-color:#fff8b2\"><b>신청해야 하는 증권사라면, 신청한 뒤 \"진짜 적용됐는지\" 꼭 다시 확인하세요.</b></span></p><p>맨 처음 3억원 사연도 신청은 했는데 적용이 안 된 경우였어요.</p><p>한국투자증권처럼 매일 다시 신청해야 하는 곳도 있어요. 조건은 바뀌었을 수 있으니 내 증권사 공지를 한 번 보세요.</p>","plain":"증권사마다 달라요. 11월 11일 기사 기준으로 정리하면 이래요.\n\n이렇게 해요\t증권사\n알아서 130%로 낮춰 줌\t미래에셋증권, KB증권\n미리 동의한 사람만 130%\tNH투자증권\n종목마다 10%p씩 낮춤\t대신증권, 삼성증권, 하나증권\n신청해야 팔기를 미뤄 줌\t한국투자증권, 키움증권, 신한투자증권, 메리츠증권\n\n신청해야 하는 증권사라면, 신청한 뒤 \"진짜 적용됐는지\" 꼭 다시 확인하세요.\n맨 처음 3억원 사연도 신청은 했는데 적용이 안 된 경우였어요.\n한국투자증권처럼 매일 다시 신청해야 하는 곳도 있어요. 조건은 바뀌었을 수 있으니 내 증권사 공지를 한 번 보세요."},{"kind":"img","name":"h7.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h07.png"},{"kind":"img","name":"05.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/05.png"},{"kind":"text","html":"<p>아까 그 계좌로 다시 계산해 볼게요.</p><p>주가가 30% 떨어지면 주식은 1,400만원이 돼요. 여기서 빌린 1,000만원을 갚으면 남는 건 400만원이에요.</p><p><br></p><p><span style=\"background-color:#fff8b2\"><b>주가는 30% 떨어졌는데, 내 돈은 60%가 사라진 거예요.</b></span></p><p><br></p><p>빚을 내서 주식을 사면 이렇게 손해가 두 배로 커져요.</p><p>기준을 130%로 낮춰 줘도 이 400만원이 다시 늘어나지는 않아요.</p>","plain":"아까 그 계좌로 다시 계산해 볼게요.\n주가가 30% 떨어지면 주식은 1,400만원이 돼요. 여기서 빌린 1,000만원을 갚으면 남는 건 400만원이에요.\n\n주가는 30% 떨어졌는데, 내 돈은 60%가 사라진 거예요.\n\n빚을 내서 주식을 사면 이렇게 손해가 두 배로 커져요.\n기준을 130%로 낮춰 줘도 이 400만원이 다시 늘어나지는 않아요."},{"kind":"img","name":"h8.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h08.png"},{"kind":"img","name":"news/a3-bizwatch-2020.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/news/a3-bizwatch-2020.png"},{"kind":"text","html":"<p>똑같은 조치가 2020년 코로나 때도 있었어요.</p><p><br></p><p>그때 주가가 다시 오르자, 하루에 강제로 팔리는 주식이 3월 179억원에서 6월 22억원으로 확 줄었어요.</p><p>그런데 9월에 주가가 다시 떨어지자 46억원으로 <span style=\"background-color:#fff8b2\"><b>두 배 넘게 다시 늘었어요</b></span>(비즈워치 11월 12일).</p><p><br></p><p>석 달 뒤는 그때 주가에 달려 있어요. 누구도 장담할 수 없어요.</p>","plain":"똑같은 조치가 2020년 코로나 때도 있었어요.\n\n그때 주가가 다시 오르자, 하루에 강제로 팔리는 주식이 3월 179억원에서 6월 22억원으로 확 줄었어요.\n그런데 9월에 주가가 다시 떨어지자 46억원으로 두 배 넘게 다시 늘었어요(비즈워치 11월 12일).\n\n석 달 뒤는 그때 주가에 달려 있어요. 누구도 장담할 수 없어요."},{"kind":"img","name":"h9.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h09.png"},{"kind":"img","name":"07.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/07.png"},{"kind":"text","html":"<p>신청을 했는데도 팔렸다면, 먼저 아래 기록을 모아 두세요.</p><p><br></p><p>☑ 신청한 날짜와 시간 (전화였다면 통화 시간)</p><p>☑ 상담원이 뭐라고 안내했는지 (녹음이 있으면 더 좋아요)</p><p>☑ 신청 접수 문자나 앱 화면 캡처</p><p>☑ 실제로 팔린 시간과 수량</p><p><br></p><p>그다음 증권사에 \"왜 적용이 안 됐는지\" 처리 내역을 달라고 하세요.</p><p>답이 납득되지 않으면 <span style=\"background-color:#fff8b2\"><b>금융감독원 e-금융민원센터(www.fcsc.kr)나 국번 없이 1332</b></span>에서 상담과 민원 접수를 할 수 있어요.</p>","plain":"신청을 했는데도 팔렸다면, 먼저 아래 기록을 모아 두세요.\n\n☑ 신청한 날짜와 시간 (전화였다면 통화 시간)\n☑ 상담원이 뭐라고 안내했는지 (녹음이 있으면 더 좋아요)\n☑ 신청 접수 문자나 앱 화면 캡처\n☑ 실제로 팔린 시간과 수량\n\n그다음 증권사에 \"왜 적용이 안 됐는지\" 처리 내역을 달라고 하세요.\n답이 납득되지 않으면 금융감독원 e-금융민원센터(www.fcsc.kr)나 국번 없이 1332에서 상담과 민원 접수를 할 수 있어요."},{"kind":"img","name":"h10.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h10.png"},{"kind":"text","html":"<p>이번 조치는 <span style=\"background-color:#fff8b2\"><b>시간을 벌어 준 거예요. 빚을 줄여 준 게 아니고요.</b></span></p><p><br></p><p>저라면 이 석 달을 \"주가가 오르길 기다리는 시간\"보다 \"빚을 조금이라도 줄이는 시간\"으로 쓰겠어요.</p><p>그리고 신청형 증권사를 쓰신다면, 신청보다 \"적용됐는지 확인\"이 더 중요해요.</p><p><br></p><p>여러분은 이번 조치를 어떻게 보세요?</p><p>① 숨통이 트였다, 잘한 조치다</p><p>② 빚은 그대로라 손해를 미룬 것뿐이다</p><p>③ 증권사마다 달라서 오히려 헷갈린다</p><p><br></p><p>번호로 댓글 남겨 주시면 같이 이야기 나눠 볼게요.</p><p>도움이 됐다면 ♡공감 한 번 눌러 주세요. 다음 글 쓰는 데 큰 힘이 돼요 🙂</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p>","plain":"이번 조치는 시간을 벌어 준 거예요. 빚을 줄여 준 게 아니고요.\n\n저라면 이 석 달을 \"주가가 오르길 기다리는 시간\"보다 \"빚을 조금이라도 줄이는 시간\"으로 쓰겠어요.\n그리고 신청형 증권사를 쓰신다면, 신청보다 \"적용됐는지 확인\"이 더 중요해요.\n\n여러분은 이번 조치를 어떻게 보세요?\n① 숨통이 트였다, 잘한 조치다\n② 빚은 그대로라 손해를 미룬 것뿐이다\n③ 증권사마다 달라서 오히려 헷갈린다\n\n번호로 댓글 남겨 주시면 같이 이야기 나눠 볼게요.\n도움이 됐다면 ♡공감 한 번 눌러 주세요. 다음 글 쓰는 데 큰 힘이 돼요 🙂\n\n· · ·"},{"kind":"img","name":"thumb.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/thumb.png"},{"kind":"text","html":"<p>이 내용은 영상으로도 정리해 뒀어요.</p><p>▶ 영상 보기: <a href=\"https://youtu.be/_m-2uD_CPAs\">https://youtu.be/_m-2uD_CPAs</a></p><p>▶ 짧게 보는 쇼츠: <a href=\"https://youtube.com/shorts/vUw3mxoGXJE\">https://youtube.com/shorts/vUw3mxoGXJE</a></p><p><br></p><p>출처: 아시아투데이(2026.11.11), 머니투데이(2026.11.17, 금융투자협회 종합통계포털), 비즈워치(2026.11.12), 한국경제·파이낸셜뉴스(2026.11.8), 이코노믹리뷰(2026.11.6)</p><p>계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 증권사 조건은 기사 당시 기준이라 바뀌었을 수 있어요. 이 글은 정보 제공용이며 특정 투자를 권하지 않아요.</p>","plain":"이 내용은 영상으로도 정리해 뒀어요.\n▶ 영상 보기: https://youtu.be/_m-2uD_CPAs\n▶ 짧게 보는 쇼츠: https://youtube.com/shorts/vUw3mxoGXJE\n\n출처: 아시아투데이(2026.11.11), 머니투데이(2026.11.17, 금융투자협회 종합통계포털), 비즈워치(2026.11.12), 한국경제·파이낸셜뉴스(2026.11.8), 이코노믹리뷰(2026.11.6)\n계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 증권사 조건은 기사 당시 기준이라 바뀌었을 수 있어요. 이 글은 정보 제공용이며 특정 투자를 권하지 않아요."}];
const FULL="<p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/hero.png\" style=\"max-width:100%\"></p><p><span style=\"background-color:#fff8b2\"><b>※ 주식을 전혀 몰라도 편하게 읽을 수 있도록 쉽게 썼어요 ※</b></span></p><p><br></p><p>증권사에 \"팔지 말아 주세요\" 하고 신청을 했대요.</p><p>\"네, 처분되지 않을 거예요\"라는 대답까지 들었고요.</p><p><br></p><p>그런데 다음 주 아침, 장이 열리자마자 3억원어치 주식이 팔려 나갔어요.</p><p><br></p><p>11월 초에 실제로 있었던 일이에요.</p><p>도대체 무슨 일이 있었던 걸까요?</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h01.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/news/a1-asiatoday.png\" style=\"max-width:100%\"></p><p>한국투자증권을 쓰던 한 투자자의 이야기예요.</p><p><br></p><p>주가가 떨어져서 증권사가 주식을 팔 수도 있는 상황이 됐어요.</p><p>그래서 증권사 안내대로 \"팔기를 잠깐 미뤄 주세요\"(반대매매 유예) 하고 신청했어요.</p><p><br></p><p>그런데 다음 주 장이 열리자마자 <span style=\"background-color:#fff8b2\"><b>3억원가량이 강제로 팔렸어요.</b></span></p><p>증권사는 \"직원 착오로 생긴 처리 실수\"라고 밝혔어요(아시아투데이 11월 11일).</p><p><br></p><p>그렇다면 이건 이 한 사람만 겪은 일이었을까요?</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h02.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/news/a2-mt-231.png\" style=\"max-width:100%\"></p><p>정부는 11월 9일부터 반대매매를 줄이겠다고 규칙을 풀어 줬어요.</p><p><br></p><p>그런데 바로 그 주(11월 9~13일) 코스피에서 반대매매로 팔린 금액(금융투자협회 집계)은 <span style=\"background-color:#fff8b2\"><b>1,330억원</b></span>이었어요.</p><p>그 전 주가 402억원이었으니, <span style=\"background-color:#fff8b2\"><b>3배 넘게 늘어난 거예요.</b></span></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/01.png\" style=\"max-width:100%\"></p><p>막아 준다고 했는데 왜 더 늘었을까요?</p><p>이걸 알려면 반대매매가 뭔지부터 알아야 해요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h03.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/ring.png\" style=\"max-width:100%\"></p><p>금은방이나 전당포를 떠올려 보세요.</p><p><br></p><p>금반지를 맡기고 100만원을 빌렸어요.</p><p>그런데 금값이 뚝 떨어져서 반지 값이 빌린 돈보다 적어질 것 같아요.</p><p><br></p><p>그러면 전당포가 연락해요. \"돈을 조금 더 가져오세요.\"</p><p>못 가져오면? <span style=\"background-color:#fff8b2\"><b>전당포가 반지를 팔아서 빌려준 돈을 가져가요.</b></span></p><p><br></p><p>주식도 똑같아요.</p><p>증권사에서 돈을 빌려 주식을 사면(이걸 신용융자라고 해요), 그 주식이 금반지 역할을 해요.</p><p>주가가 떨어지면 증권사가 \"돈 더 넣어 주세요\" 하고, 못 넣으면 <span style=\"background-color:#fff8b2\"><b>내 주식을 내 허락 없이 팔아 버려요.</b></span> 이게 반대매매예요.</p><p><br></p><p>그럼 \"얼마나 떨어져야\" 팔릴까요? 숫자로 볼게요.</p><p><br></p><p>내 돈 1,000만원에 증권사 돈 1,000만원을 빌려서, 2,000만원어치 주식을 샀다고 해 볼게요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">주가</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">내 주식 값</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">빌린 돈</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">담보비율</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">처음</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">200%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">20% 떨어짐</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,600만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">160%</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">30% 떨어짐</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,400만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">1,000만원</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">140%</td></tr></table><p><br></p><p>담보비율은 \"내 주식 값이 빌린 돈의 몇 배냐\"를 %로 쓴 거예요.</p><p>지금까지는 이 숫자가 <span style=\"background-color:#fff8b2\"><b>140% 아래로 내려가면</b></span> 팔릴 수 있었어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h04.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/news/n3-hk-mirae.png\" style=\"max-width:100%\"></p><p>원래 증권사는 이 140%를 꼭 지켜야 했어요.</p><p>정부가 이 의무를 <span style=\"background-color:#fff8b2\"><b>2026년 11월 9일부터 2027년 1월 31일까지</b></span> 잠깐 풀어 줬어요.</p><p><br></p><p>그래서 미래에셋증권은 기준을 130%로 낮췄고, 어떤 증권사는 신청하면 하루 이틀 팔기를 미뤄 주기로 했어요.</p><p><br></p><p>그래도 <span style=\"background-color:#fff8b2\"><b>빚이 줄어드는 건 아니에요.</b></span> 팔리는 날이 조금 늦춰질 뿐이고, 빌린 돈과 이자는 그대로예요.</p><p>금융당국도 \"반대매매가 전부 멈추는 건 아니다\"라고 했어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h05.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/03.png\" style=\"max-width:100%\"></p><p>이유는 크게 세 가지예요.</p><p><br></p><p>첫째, <span style=\"background-color:#fff8b2\"><b>대책이 나온 뒤에 주가가 더 떨어졌어요.</b></span></p><p>기준을 조금 낮춰 줘도, 주가가 그보다 더 떨어지면 소용이 없어요.</p><p><br></p><p>둘째, 이 1,330억원은 <span style=\"background-color:#fff8b2\"><b>미수거래</b></span>에서 나온 숫자예요.</p><p>미수거래는 돈을 빌리는 게 아니라 \"외상으로\" 주식을 먼저 사는 거예요. 정해진 날까지 돈을 못 내면 바로 팔려요.</p><p>140% 규칙과는 상관이 없어서, 이번 대책으로 막을 수가 없었어요.</p><p><br></p><p>셋째, 증권사마다 방식이 달라서 <span style=\"background-color:#fff8b2\"><b>직접 신청해야 하는 곳이 많았어요.</b></span></p><p>첫날엔 전화로만 받는 곳도 있어서, 전화 연결이 안 된다는 불만이 쏟아졌어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h06.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/04.png\" style=\"max-width:100%\"></p><p>증권사마다 달라요. 11월 11일 기사 기준으로 정리하면 이래요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">이렇게 해요</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#1C2044;color:#fff\">증권사</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">알아서 130%로 낮춰 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">미래에셋증권, KB증권</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">미리 동의한 사람만 130%</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">NH투자증권</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">종목마다 10%p씩 낮춤</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">대신증권, 삼성증권, 하나증권</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">신청해야 팔기를 미뤄 줌</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">한국투자증권, 키움증권, 신한투자증권, 메리츠증권</td></tr></table><p><br></p><p><span style=\"background-color:#fff8b2\"><b>신청해야 하는 증권사라면, 신청한 뒤 \"진짜 적용됐는지\" 꼭 다시 확인하세요.</b></span></p><p>맨 처음 3억원 사연도 신청은 했는데 적용이 안 된 경우였어요.</p><p>한국투자증권처럼 매일 다시 신청해야 하는 곳도 있어요. 조건은 바뀌었을 수 있으니 내 증권사 공지를 한 번 보세요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h07.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/05.png\" style=\"max-width:100%\"></p><p>아까 그 계좌로 다시 계산해 볼게요.</p><p>주가가 30% 떨어지면 주식은 1,400만원이 돼요. 여기서 빌린 1,000만원을 갚으면 남는 건 400만원이에요.</p><p><br></p><p><span style=\"background-color:#fff8b2\"><b>주가는 30% 떨어졌는데, 내 돈은 60%가 사라진 거예요.</b></span></p><p><br></p><p>빚을 내서 주식을 사면 이렇게 손해가 두 배로 커져요.</p><p>기준을 130%로 낮춰 줘도 이 400만원이 다시 늘어나지는 않아요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h08.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/news/a3-bizwatch-2020.png\" style=\"max-width:100%\"></p><p>똑같은 조치가 2020년 코로나 때도 있었어요.</p><p><br></p><p>그때 주가가 다시 오르자, 하루에 강제로 팔리는 주식이 3월 179억원에서 6월 22억원으로 확 줄었어요.</p><p>그런데 9월에 주가가 다시 떨어지자 46억원으로 <span style=\"background-color:#fff8b2\"><b>두 배 넘게 다시 늘었어요</b></span>(비즈워치 11월 12일).</p><p><br></p><p>석 달 뒤는 그때 주가에 달려 있어요. 누구도 장담할 수 없어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h09.png\" style=\"max-width:100%\"></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/07.png\" style=\"max-width:100%\"></p><p>신청을 했는데도 팔렸다면, 먼저 아래 기록을 모아 두세요.</p><p><br></p><p>☑ 신청한 날짜와 시간 (전화였다면 통화 시간)</p><p>☑ 상담원이 뭐라고 안내했는지 (녹음이 있으면 더 좋아요)</p><p>☑ 신청 접수 문자나 앱 화면 캡처</p><p>☑ 실제로 팔린 시간과 수량</p><p><br></p><p>그다음 증권사에 \"왜 적용이 안 됐는지\" 처리 내역을 달라고 하세요.</p><p>답이 납득되지 않으면 <span style=\"background-color:#fff8b2\"><b>금융감독원 e-금융민원센터(www.fcsc.kr)나 국번 없이 1332</b></span>에서 상담과 민원 접수를 할 수 있어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/h10.png\" style=\"max-width:100%\"></p><p>이번 조치는 <span style=\"background-color:#fff8b2\"><b>시간을 벌어 준 거예요. 빚을 줄여 준 게 아니고요.</b></span></p><p><br></p><p>저라면 이 석 달을 \"주가가 오르길 기다리는 시간\"보다 \"빚을 조금이라도 줄이는 시간\"으로 쓰겠어요.</p><p>그리고 신청형 증권사를 쓰신다면, 신청보다 \"적용됐는지 확인\"이 더 중요해요.</p><p><br></p><p>여러분은 이번 조치를 어떻게 보세요?</p><p>① 숨통이 트였다, 잘한 조치다</p><p>② 빚은 그대로라 손해를 미룬 것뿐이다</p><p>③ 증권사마다 달라서 오히려 헷갈린다</p><p><br></p><p>번호로 댓글 남겨 주시면 같이 이야기 나눠 볼게요.</p><p>도움이 됐다면 ♡공감 한 번 눌러 주세요. 다음 글 쓰는 데 큰 힘이 돼요 🙂</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p style=\"text-align:center\"><a href=\"https://youtu.be/_m-2uD_CPAs\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20c/thumb.png\" style=\"max-width:100%\"></a></p><p>이 내용은 영상으로도 정리해 뒀어요.</p><p>▶ 영상 보기: <a href=\"https://youtu.be/_m-2uD_CPAs\">https://youtu.be/_m-2uD_CPAs</a></p><p>▶ 짧게 보는 쇼츠: <a href=\"https://youtube.com/shorts/vUw3mxoGXJE\">https://youtube.com/shorts/vUw3mxoGXJE</a></p><p><br></p><p>출처: 아시아투데이(2026.11.11), 머니투데이(2026.11.17, 금융투자협회 종합통계포털), 비즈워치(2026.11.12), 한국경제·파이낸셜뉴스(2026.11.8), 이코노믹리뷰(2026.11.6)</p><p>계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 증권사 조건은 기사 당시 기준이라 바뀌었을 수 있어요. 이 글은 정보 제공용이며 특정 투자를 권하지 않아요.</p><p><br></p><p>#반대매매 #반대매매유예 #반대매매뜻 #담보비율 #담보비율140% #신용융자 #미수거래 #빚투 #깡통계좌 #강제매도 #코스피급락 #주식초보 #주식공부 #한국투자증권 #미래에셋증권 #키움증권 #증권사반대매매 #금융감독원민원 #재테크 #블루노</p>", FULLPLAIN="\n\n※ 주식을 전혀 몰라도 편하게 읽을 수 있도록 쉽게 썼어요 ※\n\n증권사에 \"팔지 말아 주세요\" 하고 신청을 했대요.\n\"네, 처분되지 않을 거예요\"라는 대답까지 들었고요.\n\n그런데 다음 주 아침, 장이 열리자마자 3억원어치 주식이 팔려 나갔어요.\n\n11월 초에 실제로 있었던 일이에요.\n도대체 무슨 일이 있었던 걸까요?\n\n\n\n\n\n한국투자증권을 쓰던 한 투자자의 이야기예요.\n\n주가가 떨어져서 증권사가 주식을 팔 수도 있는 상황이 됐어요.\n그래서 증권사 안내대로 \"팔기를 잠깐 미뤄 주세요\"(반대매매 유예) 하고 신청했어요.\n\n그런데 다음 주 장이 열리자마자 3억원가량이 강제로 팔렸어요.\n증권사는 \"직원 착오로 생긴 처리 실수\"라고 밝혔어요(아시아투데이 11월 11일).\n\n그렇다면 이건 이 한 사람만 겪은 일이었을까요?\n\n\n\n\n\n정부는 11월 9일부터 반대매매를 줄이겠다고 규칙을 풀어 줬어요.\n\n그런데 바로 그 주(11월 9~13일) 코스피에서 반대매매로 팔린 금액(금융투자협회 집계)은 1,330억원이었어요.\n그 전 주가 402억원이었으니, 3배 넘게 늘어난 거예요.\n\n\n\n막아 준다고 했는데 왜 더 늘었을까요?\n이걸 알려면 반대매매가 뭔지부터 알아야 해요.\n\n\n\n\n\n금은방이나 전당포를 떠올려 보세요.\n\n금반지를 맡기고 100만원을 빌렸어요.\n그런데 금값이 뚝 떨어져서 반지 값이 빌린 돈보다 적어질 것 같아요.\n\n그러면 전당포가 연락해요. \"돈을 조금 더 가져오세요.\"\n못 가져오면? 전당포가 반지를 팔아서 빌려준 돈을 가져가요.\n\n주식도 똑같아요.\n증권사에서 돈을 빌려 주식을 사면(이걸 신용융자라고 해요), 그 주식이 금반지 역할을 해요.\n주가가 떨어지면 증권사가 \"돈 더 넣어 주세요\" 하고, 못 넣으면 내 주식을 내 허락 없이 팔아 버려요. 이게 반대매매예요.\n\n그럼 \"얼마나 떨어져야\" 팔릴까요? 숫자로 볼게요.\n\n내 돈 1,000만원에 증권사 돈 1,000만원을 빌려서, 2,000만원어치 주식을 샀다고 해 볼게요.\n\n주가\t내 주식 값\t빌린 돈\t담보비율\n처음\t2,000만원\t1,000만원\t200%\n20% 떨어짐\t1,600만원\t1,000만원\t160%\n30% 떨어짐\t1,400만원\t1,000만원\t140%\n\n담보비율은 \"내 주식 값이 빌린 돈의 몇 배냐\"를 %로 쓴 거예요.\n지금까지는 이 숫자가 140% 아래로 내려가면 팔릴 수 있었어요.\n\n\n\n\n\n원래 증권사는 이 140%를 꼭 지켜야 했어요.\n정부가 이 의무를 2026년 11월 9일부터 2027년 1월 31일까지 잠깐 풀어 줬어요.\n\n그래서 미래에셋증권은 기준을 130%로 낮췄고, 어떤 증권사는 신청하면 하루 이틀 팔기를 미뤄 주기로 했어요.\n\n그래도 빚이 줄어드는 건 아니에요. 팔리는 날이 조금 늦춰질 뿐이고, 빌린 돈과 이자는 그대로예요.\n금융당국도 \"반대매매가 전부 멈추는 건 아니다\"라고 했어요.\n\n\n\n\n\n이유는 크게 세 가지예요.\n\n첫째, 대책이 나온 뒤에 주가가 더 떨어졌어요.\n기준을 조금 낮춰 줘도, 주가가 그보다 더 떨어지면 소용이 없어요.\n\n둘째, 이 1,330억원은 미수거래에서 나온 숫자예요.\n미수거래는 돈을 빌리는 게 아니라 \"외상으로\" 주식을 먼저 사는 거예요. 정해진 날까지 돈을 못 내면 바로 팔려요.\n140% 규칙과는 상관이 없어서, 이번 대책으로 막을 수가 없었어요.\n\n셋째, 증권사마다 방식이 달라서 직접 신청해야 하는 곳이 많았어요.\n첫날엔 전화로만 받는 곳도 있어서, 전화 연결이 안 된다는 불만이 쏟아졌어요.\n\n\n\n\n\n증권사마다 달라요. 11월 11일 기사 기준으로 정리하면 이래요.\n\n이렇게 해요\t증권사\n알아서 130%로 낮춰 줌\t미래에셋증권, KB증권\n미리 동의한 사람만 130%\tNH투자증권\n종목마다 10%p씩 낮춤\t대신증권, 삼성증권, 하나증권\n신청해야 팔기를 미뤄 줌\t한국투자증권, 키움증권, 신한투자증권, 메리츠증권\n\n신청해야 하는 증권사라면, 신청한 뒤 \"진짜 적용됐는지\" 꼭 다시 확인하세요.\n맨 처음 3억원 사연도 신청은 했는데 적용이 안 된 경우였어요.\n한국투자증권처럼 매일 다시 신청해야 하는 곳도 있어요. 조건은 바뀌었을 수 있으니 내 증권사 공지를 한 번 보세요.\n\n\n\n\n\n아까 그 계좌로 다시 계산해 볼게요.\n주가가 30% 떨어지면 주식은 1,400만원이 돼요. 여기서 빌린 1,000만원을 갚으면 남는 건 400만원이에요.\n\n주가는 30% 떨어졌는데, 내 돈은 60%가 사라진 거예요.\n\n빚을 내서 주식을 사면 이렇게 손해가 두 배로 커져요.\n기준을 130%로 낮춰 줘도 이 400만원이 다시 늘어나지는 않아요.\n\n\n\n\n\n똑같은 조치가 2020년 코로나 때도 있었어요.\n\n그때 주가가 다시 오르자, 하루에 강제로 팔리는 주식이 3월 179억원에서 6월 22억원으로 확 줄었어요.\n그런데 9월에 주가가 다시 떨어지자 46억원으로 두 배 넘게 다시 늘었어요(비즈워치 11월 12일).\n\n석 달 뒤는 그때 주가에 달려 있어요. 누구도 장담할 수 없어요.\n\n\n\n\n\n신청을 했는데도 팔렸다면, 먼저 아래 기록을 모아 두세요.\n\n☑ 신청한 날짜와 시간 (전화였다면 통화 시간)\n☑ 상담원이 뭐라고 안내했는지 (녹음이 있으면 더 좋아요)\n☑ 신청 접수 문자나 앱 화면 캡처\n☑ 실제로 팔린 시간과 수량\n\n그다음 증권사에 \"왜 적용이 안 됐는지\" 처리 내역을 달라고 하세요.\n답이 납득되지 않으면 금융감독원 e-금융민원센터(www.fcsc.kr)나 국번 없이 1332에서 상담과 민원 접수를 할 수 있어요.\n\n\n\n이번 조치는 시간을 벌어 준 거예요. 빚을 줄여 준 게 아니고요.\n\n저라면 이 석 달을 \"주가가 오르길 기다리는 시간\"보다 \"빚을 조금이라도 줄이는 시간\"으로 쓰겠어요.\n그리고 신청형 증권사를 쓰신다면, 신청보다 \"적용됐는지 확인\"이 더 중요해요.\n\n여러분은 이번 조치를 어떻게 보세요?\n① 숨통이 트였다, 잘한 조치다\n② 빚은 그대로라 손해를 미룬 것뿐이다\n③ 증권사마다 달라서 오히려 헷갈린다\n\n번호로 댓글 남겨 주시면 같이 이야기 나눠 볼게요.\n도움이 됐다면 ♡공감 한 번 눌러 주세요. 다음 글 쓰는 데 큰 힘이 돼요 🙂\n\n· · ·\n\n\n\n이 내용은 영상으로도 정리해 뒀어요.\n▶ 영상 보기: https://youtu.be/_m-2uD_CPAs\n▶ 짧게 보는 쇼츠: https://youtube.com/shorts/vUw3mxoGXJE\n\n출처: 아시아투데이(2026.11.11), 머니투데이(2026.11.17, 금융투자협회 종합통계포털), 비즈워치(2026.11.12), 한국경제·파이낸셜뉴스(2026.11.8), 이코노믹리뷰(2026.11.6)\n계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 증권사 조건은 기사 당시 기준이라 바뀌었을 수 있어요. 이 글은 정보 제공용이며 특정 투자를 권하지 않아요.\n\n#반대매매 #반대매매유예 #반대매매뜻 #담보비율 #담보비율140% #신용융자 #미수거래 #빚투 #깡통계좌 #강제매도 #코스피급락 #주식초보 #주식공부 #한국투자증권 #미래에셋증권 #키움증권 #증권사반대매매 #금융감독원민원 #재테크 #블루노";
const TITLE="반대매매 유예 신청했는데 3억원이 팔렸다? 막아 준다던 반대매매가 오히려 3배 된 이유", TAGS="#반대매매 #반대매매유예 #반대매매뜻 #담보비율 #담보비율140% #신용융자 #미수거래 #빚투 #깡통계좌 #강제매도 #코스피급락 #주식초보 #주식공부 #한국투자증권 #미래에셋증권 #키움증권 #증권사반대매매 #금융감독원민원 #재테크 #블루노";
let i=0;
const list=document.getElementById('list');
P.forEach((p,k)=>{const d=document.createElement('div');d.className='p';d.id='p'+k;
 d.innerHTML='<span class="n">'+(k+1)+'</span><button class="copy">이것만 복사</button>'+(p.kind==='img'?'<img src="'+p.data+'">':p.html);
 d.querySelector('.copy').onclick=()=>copy(k,false);list.appendChild(d);});
async function copy(k,adv=true){const p=P[k];
 try{ if(p.kind==='img'){const b=await (await fetch(p.data)).blob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);}
 else{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([p.html],{type:'text/html'}),'text/plain':new Blob([p.plain],{type:'text/plain'})})]);}
 document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur'));
 const el=document.getElementById('p'+k);el.classList.add('cur','done');el.scrollIntoView({block:'center',behavior:'smooth'});
 if(adv) i=k+1; show((p.kind==='img'?'이미지':'글')+' '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');
 }catch(e){ if(p.kind==='text'){const el=document.getElementById('p'+k);const r=document.createRange();r.selectNodeContents(el);r.setStartAfter(el.querySelector('.copy'));const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');s.removeAllRanges();if(ok){el.classList.add('cur','done');if(adv)i=k+1;show('글 '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');return;}} show('복사 실패: '+e.message+' (이미지는 그림 위 오른쪽 클릭 → 이미지 복사)');}}
function show(t){document.getElementById('status').textContent=t;}
document.getElementById('next').onclick=()=>{ if(i>=P.length){show('끝! 태그 복사 후 발행하세요');return;} copy(i); };
document.getElementById('all').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([FULL],{type:'text/html'}),'text/plain':new Blob([FULLPLAIN],{type:'text/plain'})})]);show('본문 전체(글+이미지 '+P.filter(p=>p.kind==='img').length+'장) 복사됨 → 네이버 본문에 Ctrl+V 한 번');}catch(e){show('복사 실패: '+e.message);}};
document.getElementById('reset').onclick=()=>{i=0;document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur','done'));show('처음부터');window.scrollTo(0,0);};
document.getElementById('ctitle').onclick=async()=>{await navigator.clipboard.writeText(TITLE);show('제목 복사됨');};
document.getElementById('ctags').onclick=async()=>{await navigator.clipboard.writeText(TAGS);show('태그 복사됨');};
show('조각 '+P.length+'개 (이미지 '+P.filter(p=>p.kind==='img').length+'장)');
