<script>
const P=[{"kind":"img","name":"skin3/head-econ.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/skin3/head-econ.png"},{"kind":"text","html":"<p>\"증권사가 내 주식을 마음대로 팔아 버렸대요.\"</p><p>지난주에 이런 얘기 들으셨나요? 이걸 반대매매라고 해요.</p><p>빚내서 주식을 산 계좌에서 생기는 일인데, 마침 11월 9일부터 규칙이 하나 바뀌었어요.</p><p>어려운 말은 빼고, 그림이랑 계산으로 3분 만에 정리해 볼게요.</p>","plain":"\"증권사가 내 주식을 마음대로 팔아 버렸대요.\"\n지난주에 이런 얘기 들으셨나요? 이걸 반대매매라고 해요.\n빚내서 주식을 산 계좌에서 생기는 일인데, 마침 11월 9일부터 규칙이 하나 바뀌었어요.\n어려운 말은 빼고, 그림이랑 계산으로 3분 만에 정리해 볼게요."},{"kind":"img","name":"01.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/01.png"},{"kind":"text","html":"<p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">01. 반대매매, 한 줄로 말하면?</span></b></p>","plain":"· · ·\n\n01. 반대매매, 한 줄로 말하면?"},{"kind":"img","name":"02.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/02.png"},{"kind":"text","html":"<p>증권사에서 돈을 빌려 주식을 살 수 있어요. 이걸 신용융자라고 해요.</p><p>그런데 주가가 떨어지면 증권사는 불안해져요. \"빌려준 돈 못 받으면 어떡하지?\"</p><p>그래서 \"돈을 더 넣어 주세요\" 하고 연락이 와요.</p><p>이때 못 채우면? 증권사가 내 주식을 내 뜻과 상관없이 팔아서 빌려준 돈을 가져가요. 이게 반대매매예요.</p>","plain":"증권사에서 돈을 빌려 주식을 살 수 있어요. 이걸 신용융자라고 해요.\n그런데 주가가 떨어지면 증권사는 불안해져요. \"빌려준 돈 못 받으면 어떡하지?\"\n그래서 \"돈을 더 넣어 주세요\" 하고 연락이 와요.\n이때 못 채우면? 증권사가 내 주식을 내 뜻과 상관없이 팔아서 빌려준 돈을 가져가요. 이게 반대매매예요."},{"kind":"img","name":"03.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/03.png"},{"kind":"text","html":"<p>전당포를 떠올리면 쉬워요.</p><p>시계를 맡기고 돈을 빌렸는데 시계 값이 뚝 떨어지면, 전당포가 시계를 팔아 버리죠.</p><p>이번에 바뀐 건 딱 하나예요. 전당포가 조금 더 기다려 주기로 한 거예요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">02. 140%라는 숫자, 정체가 뭐예요?</span></b></p>","plain":"전당포를 떠올리면 쉬워요.\n시계를 맡기고 돈을 빌렸는데 시계 값이 뚝 떨어지면, 전당포가 시계를 팔아 버리죠.\n이번에 바뀐 건 딱 하나예요. 전당포가 조금 더 기다려 주기로 한 거예요.\n\n· · ·\n\n02. 140%라는 숫자, 정체가 뭐예요?"},{"kind":"img","name":"04.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/04.png"},{"kind":"text","html":"<p>담보비율은 내 계좌의 주식 값을 빌린 돈으로 나눈 숫자예요.</p><p>1,000만원을 빌렸다면 계좌에 주식이 1,400만원어치는 있어야 140%가 돼요.</p><p>지금까지는 모든 증권사가 이 140%를 지켜야 했어요.</p>","plain":"담보비율은 내 계좌의 주식 값을 빌린 돈으로 나눈 숫자예요.\n1,000만원을 빌렸다면 계좌에 주식이 1,400만원어치는 있어야 140%가 돼요.\n지금까지는 모든 증권사가 이 140%를 지켜야 했어요."},{"kind":"img","name":"05.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/05.png"},{"kind":"text","html":"<p>140% 아래로 내려가면 이런 순서로 진행돼요.</p><p>첫날 증권사가 돈을 더 넣으라고 알려 줘요. 정해진 날까지 못 채우면, 장이 열리기 전에 하한가로 팔아 버려요.</p><p>한꺼번에 이렇게 팔리면 주가가 더 떨어지고, 그러면 또 팔리는 악순환이 생겨요.</p><p>날짜와 방식은 증권사마다 조금씩 달라요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">03. 지난주에 무슨 일이 있었길래?</span></b></p>","plain":"140% 아래로 내려가면 이런 순서로 진행돼요.\n첫날 증권사가 돈을 더 넣으라고 알려 줘요. 정해진 날까지 못 채우면, 장이 열리기 전에 하한가로 팔아 버려요.\n한꺼번에 이렇게 팔리면 주가가 더 떨어지고, 그러면 또 팔리는 악순환이 생겨요.\n날짜와 방식은 증권사마다 조금씩 달라요.\n\n· · ·\n\n03. 지난주에 무슨 일이 있었길래?"},{"kind":"img","name":"06.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/06.png"},{"kind":"text","html":"<p>11월 5일(목)에 코스피가 5.28% 빠졌고, 6일(금)에 또 6.02% 빠졌어요. 이틀 만에 11% 가까이요.</p><p>금요일엔 장이 열리고 3분 만에 서킷브레이커가 걸려서 거래가 잠깐 멈췄어요.</p><p>빚내서 산 주식, 신용융자 잔고는 11월 5일 기준 28조 7,715억원이에요. 한 달 전엔 34조원이 넘었어요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">04. 그래서 뭐가 바뀌었어요?</span></b></p>","plain":"11월 5일(목)에 코스피가 5.28% 빠졌고, 6일(금)에 또 6.02% 빠졌어요. 이틀 만에 11% 가까이요.\n금요일엔 장이 열리고 3분 만에 서킷브레이커가 걸려서 거래가 잠깐 멈췄어요.\n빚내서 산 주식, 신용융자 잔고는 11월 5일 기준 28조 7,715억원이에요. 한 달 전엔 34조원이 넘었어요.\n\n· · ·\n\n04. 그래서 뭐가 바뀌었어요?"},{"kind":"img","name":"07.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/07.png"},{"kind":"text","html":"<p>금융당국이 증권사의 담보비율 140% 유지 의무를 잠깐 풀어 줬어요.</p><p>기간은 2026년 11월 9일부터 2027년 1월 31일까지예요.</p><p>이 기간엔 증권사가 140%를 안 지켜도 제재하지 않아요(금감원 비조치의견서).</p>","plain":"금융당국이 증권사의 담보비율 140% 유지 의무를 잠깐 풀어 줬어요.\n기간은 2026년 11월 9일부터 2027년 1월 31일까지예요.\n이 기간엔 증권사가 140%를 안 지켜도 제재하지 않아요(금감원 비조치의견서)."},{"kind":"img","name":"08.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/08.png"},{"kind":"text","html":"<p>그래도 반대매매가 멈추는 건 아니에요.</p><p>금융당국도 \"반대매매의 전면 중단은 아니다\"라고 분명히 말했어요.</p><p>빚도 그대로예요. 팔리는 시점이 조금 늦춰질 뿐이에요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">05. 증권사마다 다르게 바꿨어요</span></b></p>","plain":"그래도 반대매매가 멈추는 건 아니에요.\n금융당국도 \"반대매매의 전면 중단은 아니다\"라고 분명히 말했어요.\n빚도 그대로예요. 팔리는 시점이 조금 늦춰질 뿐이에요.\n\n· · ·\n\n05. 증권사마다 다르게 바꿨어요"},{"kind":"img","name":"09.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/09.png"},{"kind":"text","html":"<p>140%는 원래 모든 증권사의 공통 선이었는데, 이제 증권사마다 달라졌어요.</p><p>미래에셋증권은 국내 주식 기준을 130%로 낮췄어요(해외 주식은 140% 그대로).</p><p>삼성증권은 11월 9일 하루 10%p 낮췄고, 그 뒤엔 고객이 신청하는 방식으로 바꾼다고 했어요.</p><p>한국투자증권과 키움증권은 신청하면 매도를 미뤄 줘요.</p><p>발표 당시 기준이라 지금은 달라졌을 수 있어요. 내 증권사 공지를 꼭 확인하세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">06. 내 계좌로 계산해 보면?</span></b></p>","plain":"140%는 원래 모든 증권사의 공통 선이었는데, 이제 증권사마다 달라졌어요.\n미래에셋증권은 국내 주식 기준을 130%로 낮췄어요(해외 주식은 140% 그대로).\n삼성증권은 11월 9일 하루 10%p 낮췄고, 그 뒤엔 고객이 신청하는 방식으로 바꾼다고 했어요.\n한국투자증권과 키움증권은 신청하면 매도를 미뤄 줘요.\n발표 당시 기준이라 지금은 달라졌을 수 있어요. 내 증권사 공지를 꼭 확인하세요.\n\n· · ·\n\n06. 내 계좌로 계산해 보면?"},{"kind":"img","name":"10.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/10.png"},{"kind":"text","html":"<p>예를 들어 볼게요. 내 돈 1,000만원에 1,000만원을 빌려서 2,000만원어치 주식을 샀어요.</p><p>주가가 30% 빠지면 주식은 1,400만원이 되고, 담보비율이 딱 140%예요. 예전 기준이면 여기서부터 강제로 팔릴 수 있었어요.</p><p>기준이 130%로 내려가면 35%까지는 버틸 수 있어요. 숨 쉴 틈이 조금 생겼어요.</p>","plain":"예를 들어 볼게요. 내 돈 1,000만원에 1,000만원을 빌려서 2,000만원어치 주식을 샀어요.\n주가가 30% 빠지면 주식은 1,400만원이 되고, 담보비율이 딱 140%예요. 예전 기준이면 여기서부터 강제로 팔릴 수 있었어요.\n기준이 130%로 내려가면 35%까지는 버틸 수 있어요. 숨 쉴 틈이 조금 생겼어요."},{"kind":"img","name":"11.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/11.png"},{"kind":"text","html":"<p>그럼 주가가 30% 빠졌을 때 내 돈은 얼마 남았을까요? 1,400만원에서 빌린 1,000만원을 빼면 400만원이에요.</p><p>주가는 30% 빠졌는데 내 돈은 60%가 사라진 거예요. 빚은 그대로고 이자도 계속 나가요.</p>","plain":"그럼 주가가 30% 빠졌을 때 내 돈은 얼마 남았을까요? 1,400만원에서 빌린 1,000만원을 빼면 400만원이에요.\n주가는 30% 빠졌는데 내 돈은 60%가 사라진 거예요. 빚은 그대로고 이자도 계속 나가요."},{"kind":"img","name":"12.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/12.png"},{"kind":"text","html":"<p>주가가 빠질 때마다 어떻게 되는지 표로 정리했어요.</p><p>이자와 수수료는 빼고 계산한 예시예요. 실제 계좌는 증권사 앱에서 확인하세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">07. 계좌 열기 전에 세 가지만 확인하세요</span></b></p>","plain":"주가가 빠질 때마다 어떻게 되는지 표로 정리했어요.\n이자와 수수료는 빼고 계산한 예시예요. 실제 계좌는 증권사 앱에서 확인하세요.\n\n· · ·\n\n07. 계좌 열기 전에 세 가지만 확인하세요"},{"kind":"img","name":"13.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/13.png"},{"kind":"text","html":"<p>☑ 내 증권사가 담보비율을 몇 %로 낮췄는지 (증권사마다 달라요)</p><p>☑ 지금 내 계좌의 담보비율이 몇 %인지 (증권사 앱에서 바로 보여요)</p><p>☑ 매도를 미뤄 주는 제도, 따로 신청해야 하는지 (신청해야 하는 곳도 있어요)</p><p>그리고 이번 조치는 2027년 1월 31일까지예요. 그 뒤엔 원래 선으로 돌아갈 수 있어요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">08. 자주 묻는 질문</span></b></p><p><br></p><p><b>Q. 140% 면제면 이제 반대매매 안 당하나요?</b></p><p>A. 아니에요. 증권사가 기준을 조금 낮추거나 시간을 더 주는 것뿐이에요. 금융당국도 반대매매가 전부 멈추는 건 아니라고 했어요.</p><p><br></p><p><b>Q. 담보비율은 어떻게 계산해요?</b></p><p>A. 내 계좌의 주식 값 ÷ 빌린 돈이에요. 1,000만원을 빌렸고 주식이 1,400만원어치면 140%예요.</p><p><br></p><p><b>Q. 면제 기간이 끝나면 어떻게 돼요?</b></p><p>A. 2027년 1월 31일까지예요. 그 뒤엔 다시 140%로 돌아갈 수 있으니 그 전에 내 빚을 어떻게 할지 정해 두세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">영상으로 보기</span></b></p>","plain":"☑ 내 증권사가 담보비율을 몇 %로 낮췄는지 (증권사마다 달라요)\n☑ 지금 내 계좌의 담보비율이 몇 %인지 (증권사 앱에서 바로 보여요)\n☑ 매도를 미뤄 주는 제도, 따로 신청해야 하는지 (신청해야 하는 곳도 있어요)\n그리고 이번 조치는 2027년 1월 31일까지예요. 그 뒤엔 원래 선으로 돌아갈 수 있어요.\n\n· · ·\n\n08. 자주 묻는 질문\n\nQ. 140% 면제면 이제 반대매매 안 당하나요?\nA. 아니에요. 증권사가 기준을 조금 낮추거나 시간을 더 주는 것뿐이에요. 금융당국도 반대매매가 전부 멈추는 건 아니라고 했어요.\n\nQ. 담보비율은 어떻게 계산해요?\nA. 내 계좌의 주식 값 ÷ 빌린 돈이에요. 1,000만원을 빌렸고 주식이 1,400만원어치면 140%예요.\n\nQ. 면제 기간이 끝나면 어떻게 돼요?\nA. 2027년 1월 31일까지예요. 그 뒤엔 다시 140%로 돌아갈 수 있으니 그 전에 내 빚을 어떻게 할지 정해 두세요.\n\n· · ·\n\n영상으로 보기"},{"kind":"img","name":"thumb.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/thumb.png"},{"kind":"text","html":"<p>같은 내용을 영상으로도 정리해 뒀어요. 뉴스 화면이랑 계산을 같이 보실 수 있어요.</p><p>▶ 영상 보기: <a href=\"https://youtu.be/_m-2uD_CPAs\">https://youtu.be/_m-2uD_CPAs</a></p><p>▶ 짧게 보는 쇼츠: <a href=\"https://youtube.com/shorts/vUw3mxoGXJE\">https://youtube.com/shorts/vUw3mxoGXJE</a></p><p><br></p><p>여러분 증권사는 담보비율을 몇 %로 낮췄나요? 댓글로 알려 주시면 다른 분들께 큰 도움이 돼요 🙂</p>","plain":"같은 내용을 영상으로도 정리해 뒀어요. 뉴스 화면이랑 계산을 같이 보실 수 있어요.\n▶ 영상 보기: https://youtu.be/_m-2uD_CPAs\n▶ 짧게 보는 쇼츠: https://youtube.com/shorts/vUw3mxoGXJE\n\n여러분 증권사는 담보비율을 몇 %로 낮췄나요? 댓글로 알려 주시면 다른 분들께 큰 도움이 돼요 🙂"},{"kind":"img","name":"skin3/post-footer.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/skin3/post-footer.png"},{"kind":"text","html":"<p>출처: 금융감독원·금융투자협회 발표(파이낸셜뉴스·한국경제 2026.11.8), 이코노믹리뷰(2026.11.6), 아주경제(2026.11.8, 신용융자 잔고), 머니투데이·SBS Biz(2026.11.6), 증권사 반대매매 안내</p><p>계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 이 글은 정보 제공용이며 특정 투자를 권하지 않아요. 내 계좌 조건은 거래 증권사에서 꼭 확인하세요.</p>","plain":"출처: 금융감독원·금융투자협회 발표(파이낸셜뉴스·한국경제 2026.11.8), 이코노믹리뷰(2026.11.6), 아주경제(2026.11.8, 신용융자 잔고), 머니투데이·SBS Biz(2026.11.6), 증권사 반대매매 안내\n계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 이 글은 정보 제공용이며 특정 투자를 권하지 않아요. 내 계좌 조건은 거래 증권사에서 꼭 확인하세요."}];
const FULL="<p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/skin3/head-econ.png\" style=\"max-width:100%\"></p><p>\"증권사가 내 주식을 마음대로 팔아 버렸대요.\"</p><p>지난주에 이런 얘기 들으셨나요? 이걸 반대매매라고 해요.</p><p>빚내서 주식을 산 계좌에서 생기는 일인데, 마침 11월 9일부터 규칙이 하나 바뀌었어요.</p><p>어려운 말은 빼고, 그림이랑 계산으로 3분 만에 정리해 볼게요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/01.png\" style=\"max-width:100%\"></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">01. 반대매매, 한 줄로 말하면?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/02.png\" style=\"max-width:100%\"></p><p>증권사에서 돈을 빌려 주식을 살 수 있어요. 이걸 신용융자라고 해요.</p><p>그런데 주가가 떨어지면 증권사는 불안해져요. \"빌려준 돈 못 받으면 어떡하지?\"</p><p>그래서 \"돈을 더 넣어 주세요\" 하고 연락이 와요.</p><p>이때 못 채우면? 증권사가 내 주식을 내 뜻과 상관없이 팔아서 빌려준 돈을 가져가요. 이게 반대매매예요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/03.png\" style=\"max-width:100%\"></p><p>전당포를 떠올리면 쉬워요.</p><p>시계를 맡기고 돈을 빌렸는데 시계 값이 뚝 떨어지면, 전당포가 시계를 팔아 버리죠.</p><p>이번에 바뀐 건 딱 하나예요. 전당포가 조금 더 기다려 주기로 한 거예요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">02. 140%라는 숫자, 정체가 뭐예요?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/04.png\" style=\"max-width:100%\"></p><p>담보비율은 내 계좌의 주식 값을 빌린 돈으로 나눈 숫자예요.</p><p>1,000만원을 빌렸다면 계좌에 주식이 1,400만원어치는 있어야 140%가 돼요.</p><p>지금까지는 모든 증권사가 이 140%를 지켜야 했어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/05.png\" style=\"max-width:100%\"></p><p>140% 아래로 내려가면 이런 순서로 진행돼요.</p><p>첫날 증권사가 돈을 더 넣으라고 알려 줘요. 정해진 날까지 못 채우면, 장이 열리기 전에 하한가로 팔아 버려요.</p><p>한꺼번에 이렇게 팔리면 주가가 더 떨어지고, 그러면 또 팔리는 악순환이 생겨요.</p><p>날짜와 방식은 증권사마다 조금씩 달라요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">03. 지난주에 무슨 일이 있었길래?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/06.png\" style=\"max-width:100%\"></p><p>11월 5일(목)에 코스피가 5.28% 빠졌고, 6일(금)에 또 6.02% 빠졌어요. 이틀 만에 11% 가까이요.</p><p>금요일엔 장이 열리고 3분 만에 서킷브레이커가 걸려서 거래가 잠깐 멈췄어요.</p><p>빚내서 산 주식, 신용융자 잔고는 11월 5일 기준 28조 7,715억원이에요. 한 달 전엔 34조원이 넘었어요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">04. 그래서 뭐가 바뀌었어요?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/07.png\" style=\"max-width:100%\"></p><p>금융당국이 증권사의 담보비율 140% 유지 의무를 잠깐 풀어 줬어요.</p><p>기간은 2026년 11월 9일부터 2027년 1월 31일까지예요.</p><p>이 기간엔 증권사가 140%를 안 지켜도 제재하지 않아요(금감원 비조치의견서).</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/08.png\" style=\"max-width:100%\"></p><p>그래도 반대매매가 멈추는 건 아니에요.</p><p>금융당국도 \"반대매매의 전면 중단은 아니다\"라고 분명히 말했어요.</p><p>빚도 그대로예요. 팔리는 시점이 조금 늦춰질 뿐이에요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">05. 증권사마다 다르게 바꿨어요</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/09.png\" style=\"max-width:100%\"></p><p>140%는 원래 모든 증권사의 공통 선이었는데, 이제 증권사마다 달라졌어요.</p><p>미래에셋증권은 국내 주식 기준을 130%로 낮췄어요(해외 주식은 140% 그대로).</p><p>삼성증권은 11월 9일 하루 10%p 낮췄고, 그 뒤엔 고객이 신청하는 방식으로 바꾼다고 했어요.</p><p>한국투자증권과 키움증권은 신청하면 매도를 미뤄 줘요.</p><p>발표 당시 기준이라 지금은 달라졌을 수 있어요. 내 증권사 공지를 꼭 확인하세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">06. 내 계좌로 계산해 보면?</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/10.png\" style=\"max-width:100%\"></p><p>예를 들어 볼게요. 내 돈 1,000만원에 1,000만원을 빌려서 2,000만원어치 주식을 샀어요.</p><p>주가가 30% 빠지면 주식은 1,400만원이 되고, 담보비율이 딱 140%예요. 예전 기준이면 여기서부터 강제로 팔릴 수 있었어요.</p><p>기준이 130%로 내려가면 35%까지는 버틸 수 있어요. 숨 쉴 틈이 조금 생겼어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/11.png\" style=\"max-width:100%\"></p><p>그럼 주가가 30% 빠졌을 때 내 돈은 얼마 남았을까요? 1,400만원에서 빌린 1,000만원을 빼면 400만원이에요.</p><p>주가는 30% 빠졌는데 내 돈은 60%가 사라진 거예요. 빚은 그대로고 이자도 계속 나가요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/12.png\" style=\"max-width:100%\"></p><p>주가가 빠질 때마다 어떻게 되는지 표로 정리했어요.</p><p>이자와 수수료는 빼고 계산한 예시예요. 실제 계좌는 증권사 앱에서 확인하세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">07. 계좌 열기 전에 세 가지만 확인하세요</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/13.png\" style=\"max-width:100%\"></p><p>☑ 내 증권사가 담보비율을 몇 %로 낮췄는지 (증권사마다 달라요)</p><p>☑ 지금 내 계좌의 담보비율이 몇 %인지 (증권사 앱에서 바로 보여요)</p><p>☑ 매도를 미뤄 주는 제도, 따로 신청해야 하는지 (신청해야 하는 곳도 있어요)</p><p>그리고 이번 조치는 2027년 1월 31일까지예요. 그 뒤엔 원래 선으로 돌아갈 수 있어요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">08. 자주 묻는 질문</span></b></p><p><br></p><p><b>Q. 140% 면제면 이제 반대매매 안 당하나요?</b></p><p>A. 아니에요. 증권사가 기준을 조금 낮추거나 시간을 더 주는 것뿐이에요. 금융당국도 반대매매가 전부 멈추는 건 아니라고 했어요.</p><p><br></p><p><b>Q. 담보비율은 어떻게 계산해요?</b></p><p>A. 내 계좌의 주식 값 ÷ 빌린 돈이에요. 1,000만원을 빌렸고 주식이 1,400만원어치면 140%예요.</p><p><br></p><p><b>Q. 면제 기간이 끝나면 어떻게 돼요?</b></p><p>A. 2027년 1월 31일까지예요. 그 뒤엔 다시 140%로 돌아갈 수 있으니 그 전에 내 빚을 어떻게 할지 정해 두세요.</p><p><br></p><p style=\"text-align:center;color:#bbb\">· · ·</p><p><br></p><p><b><span style=\"font-size:24px;color:#1C2044\">영상으로 보기</span></b></p><p style=\"text-align:center\"><a href=\"https://youtu.be/_m-2uD_CPAs\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/t20/thumb.png\" style=\"max-width:100%\"></a></p><p>같은 내용을 영상으로도 정리해 뒀어요. 뉴스 화면이랑 계산을 같이 보실 수 있어요.</p><p>▶ 영상 보기: <a href=\"https://youtu.be/_m-2uD_CPAs\">https://youtu.be/_m-2uD_CPAs</a></p><p>▶ 짧게 보는 쇼츠: <a href=\"https://youtube.com/shorts/vUw3mxoGXJE\">https://youtube.com/shorts/vUw3mxoGXJE</a></p><p><br></p><p>여러분 증권사는 담보비율을 몇 %로 낮췄나요? 댓글로 알려 주시면 다른 분들께 큰 도움이 돼요 🙂</p><p style=\"text-align:center\"><a href=\"https://youtu.be/_m-2uD_CPAs\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/skin3/post-footer.png\" style=\"max-width:100%\"></a></p><p>출처: 금융감독원·금융투자협회 발표(파이낸셜뉴스·한국경제 2026.11.8), 이코노믹리뷰(2026.11.6), 아주경제(2026.11.8, 신용융자 잔고), 머니투데이·SBS Biz(2026.11.6), 증권사 반대매매 안내</p><p>계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 이 글은 정보 제공용이며 특정 투자를 권하지 않아요. 내 계좌 조건은 거래 증권사에서 꼭 확인하세요.</p><p><br></p><p>#반대매매 #담보비율 #신용융자 #빚투 #담보비율140% #반대매매면제 #미래에셋130% #강제매도 #코스피급락 #블루노</p>", FULLPLAIN="\n\n\"증권사가 내 주식을 마음대로 팔아 버렸대요.\"\n지난주에 이런 얘기 들으셨나요? 이걸 반대매매라고 해요.\n빚내서 주식을 산 계좌에서 생기는 일인데, 마침 11월 9일부터 규칙이 하나 바뀌었어요.\n어려운 말은 빼고, 그림이랑 계산으로 3분 만에 정리해 볼게요.\n\n\n\n· · ·\n\n01. 반대매매, 한 줄로 말하면?\n\n\n\n증권사에서 돈을 빌려 주식을 살 수 있어요. 이걸 신용융자라고 해요.\n그런데 주가가 떨어지면 증권사는 불안해져요. \"빌려준 돈 못 받으면 어떡하지?\"\n그래서 \"돈을 더 넣어 주세요\" 하고 연락이 와요.\n이때 못 채우면? 증권사가 내 주식을 내 뜻과 상관없이 팔아서 빌려준 돈을 가져가요. 이게 반대매매예요.\n\n\n\n전당포를 떠올리면 쉬워요.\n시계를 맡기고 돈을 빌렸는데 시계 값이 뚝 떨어지면, 전당포가 시계를 팔아 버리죠.\n이번에 바뀐 건 딱 하나예요. 전당포가 조금 더 기다려 주기로 한 거예요.\n\n· · ·\n\n02. 140%라는 숫자, 정체가 뭐예요?\n\n\n\n담보비율은 내 계좌의 주식 값을 빌린 돈으로 나눈 숫자예요.\n1,000만원을 빌렸다면 계좌에 주식이 1,400만원어치는 있어야 140%가 돼요.\n지금까지는 모든 증권사가 이 140%를 지켜야 했어요.\n\n\n\n140% 아래로 내려가면 이런 순서로 진행돼요.\n첫날 증권사가 돈을 더 넣으라고 알려 줘요. 정해진 날까지 못 채우면, 장이 열리기 전에 하한가로 팔아 버려요.\n한꺼번에 이렇게 팔리면 주가가 더 떨어지고, 그러면 또 팔리는 악순환이 생겨요.\n날짜와 방식은 증권사마다 조금씩 달라요.\n\n· · ·\n\n03. 지난주에 무슨 일이 있었길래?\n\n\n\n11월 5일(목)에 코스피가 5.28% 빠졌고, 6일(금)에 또 6.02% 빠졌어요. 이틀 만에 11% 가까이요.\n금요일엔 장이 열리고 3분 만에 서킷브레이커가 걸려서 거래가 잠깐 멈췄어요.\n빚내서 산 주식, 신용융자 잔고는 11월 5일 기준 28조 7,715억원이에요. 한 달 전엔 34조원이 넘었어요.\n\n· · ·\n\n04. 그래서 뭐가 바뀌었어요?\n\n\n\n금융당국이 증권사의 담보비율 140% 유지 의무를 잠깐 풀어 줬어요.\n기간은 2026년 11월 9일부터 2027년 1월 31일까지예요.\n이 기간엔 증권사가 140%를 안 지켜도 제재하지 않아요(금감원 비조치의견서).\n\n\n\n그래도 반대매매가 멈추는 건 아니에요.\n금융당국도 \"반대매매의 전면 중단은 아니다\"라고 분명히 말했어요.\n빚도 그대로예요. 팔리는 시점이 조금 늦춰질 뿐이에요.\n\n· · ·\n\n05. 증권사마다 다르게 바꿨어요\n\n\n\n140%는 원래 모든 증권사의 공통 선이었는데, 이제 증권사마다 달라졌어요.\n미래에셋증권은 국내 주식 기준을 130%로 낮췄어요(해외 주식은 140% 그대로).\n삼성증권은 11월 9일 하루 10%p 낮췄고, 그 뒤엔 고객이 신청하는 방식으로 바꾼다고 했어요.\n한국투자증권과 키움증권은 신청하면 매도를 미뤄 줘요.\n발표 당시 기준이라 지금은 달라졌을 수 있어요. 내 증권사 공지를 꼭 확인하세요.\n\n· · ·\n\n06. 내 계좌로 계산해 보면?\n\n\n\n예를 들어 볼게요. 내 돈 1,000만원에 1,000만원을 빌려서 2,000만원어치 주식을 샀어요.\n주가가 30% 빠지면 주식은 1,400만원이 되고, 담보비율이 딱 140%예요. 예전 기준이면 여기서부터 강제로 팔릴 수 있었어요.\n기준이 130%로 내려가면 35%까지는 버틸 수 있어요. 숨 쉴 틈이 조금 생겼어요.\n\n\n\n그럼 주가가 30% 빠졌을 때 내 돈은 얼마 남았을까요? 1,400만원에서 빌린 1,000만원을 빼면 400만원이에요.\n주가는 30% 빠졌는데 내 돈은 60%가 사라진 거예요. 빚은 그대로고 이자도 계속 나가요.\n\n\n\n주가가 빠질 때마다 어떻게 되는지 표로 정리했어요.\n이자와 수수료는 빼고 계산한 예시예요. 실제 계좌는 증권사 앱에서 확인하세요.\n\n· · ·\n\n07. 계좌 열기 전에 세 가지만 확인하세요\n\n\n\n☑ 내 증권사가 담보비율을 몇 %로 낮췄는지 (증권사마다 달라요)\n☑ 지금 내 계좌의 담보비율이 몇 %인지 (증권사 앱에서 바로 보여요)\n☑ 매도를 미뤄 주는 제도, 따로 신청해야 하는지 (신청해야 하는 곳도 있어요)\n그리고 이번 조치는 2027년 1월 31일까지예요. 그 뒤엔 원래 선으로 돌아갈 수 있어요.\n\n· · ·\n\n08. 자주 묻는 질문\n\nQ. 140% 면제면 이제 반대매매 안 당하나요?\nA. 아니에요. 증권사가 기준을 조금 낮추거나 시간을 더 주는 것뿐이에요. 금융당국도 반대매매가 전부 멈추는 건 아니라고 했어요.\n\nQ. 담보비율은 어떻게 계산해요?\nA. 내 계좌의 주식 값 ÷ 빌린 돈이에요. 1,000만원을 빌렸고 주식이 1,400만원어치면 140%예요.\n\nQ. 면제 기간이 끝나면 어떻게 돼요?\nA. 2027년 1월 31일까지예요. 그 뒤엔 다시 140%로 돌아갈 수 있으니 그 전에 내 빚을 어떻게 할지 정해 두세요.\n\n· · ·\n\n영상으로 보기\n\n\n\n같은 내용을 영상으로도 정리해 뒀어요. 뉴스 화면이랑 계산을 같이 보실 수 있어요.\n▶ 영상 보기: https://youtu.be/_m-2uD_CPAs\n▶ 짧게 보는 쇼츠: https://youtube.com/shorts/vUw3mxoGXJE\n\n여러분 증권사는 담보비율을 몇 %로 낮췄나요? 댓글로 알려 주시면 다른 분들께 큰 도움이 돼요 🙂\n\n\n\n출처: 금융감독원·금융투자협회 발표(파이낸셜뉴스·한국경제 2026.11.8), 이코노믹리뷰(2026.11.6), 아주경제(2026.11.8, 신용융자 잔고), 머니투데이·SBS Biz(2026.11.6), 증권사 반대매매 안내\n계산은 블루노가 가정해서 해 본 예시예요(이자·수수료 제외). 이 글은 정보 제공용이며 특정 투자를 권하지 않아요. 내 계좌 조건은 거래 증권사에서 꼭 확인하세요.\n\n#반대매매 #담보비율 #신용융자 #빚투 #담보비율140% #반대매매면제 #미래에셋130% #강제매도 #코스피급락 #블루노";
const TITLE="증권사가 내 주식을 강제로 판다? 반대매매 담보비율 140% 면제, 주가 몇 % 빠지면 팔릴까", TAGS="#반대매매 #담보비율 #신용융자 #빚투 #담보비율140% #반대매매면제 #미래에셋130% #강제매도 #코스피급락 #블루노";
let i=0;
const list=document.getElementById('list');
P.forEach((p,k)=>{const d=document.createElement('div');d.className='p';d.id='p'+k;
 d.innerHTML='<span class="n">'+(k+1)+'</span><button class="copy">이것만 복사</button>'+(p.kind==='img'?'<img src="'+p.data+'">':p.html);
 d.querySelector('.copy').onclick=()=>copy(k,false);list.appendChild(d);});
async function copy(k,adv=true){const p=P[k];
 try{ if(p.kind==='img'){const b=await (await fetch(p.data)).blob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);}
 else{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([p.html],{type:'text/html'}),'text/plain':new Blob([p.plain],{type:'text/plain'})})]);}
 document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur'));
 const el=document.getElementById('p'+k);el.classList.add('cur','done');el.scrollIntoView({block:'center',behavior:'smooth'});
 if(adv) i=k+1; show((p.kind==='img'?'이미지':'글')+' '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');
 }catch(e){ if(p.kind==='text'){const el=document.getElementById('p'+k);const r=document.createRange();r.selectNodeContents(el);r.setStartAfter(el.querySelector('.copy'));const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');s.removeAllRanges();if(ok){el.classList.add('cur','done');if(adv)i=k+1;show('글 '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');return;}} show('복사 실패: '+e.message+' (이미지는 그림 위 오른쪽 클릭 → 이미지 복사)');}}
function show(t){document.getElementById('status').textContent=t;}
document.getElementById('next').onclick=()=>{ if(i>=P.length){show('끝! 태그 복사 후 발행하세요');return;} copy(i); };
document.getElementById('all').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([FULL],{type:'text/html'}),'text/plain':new Blob([FULLPLAIN],{type:'text/plain'})})]);show('본문 전체(글+이미지 '+P.filter(p=>p.kind==='img').length+'장) 복사됨 → 네이버 본문에 Ctrl+V 한 번');}catch(e){show('복사 실패: '+e.message);}};
document.getElementById('reset').onclick=()=>{i=0;document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur','done'));show('처음부터');window.scrollTo(0,0);};
document.getElementById('ctitle').onclick=async()=>{await navigator.clipboard.writeText(TITLE);show('제목 복사됨');};
document.getElementById('ctags').onclick=async()=>{await navigator.clipboard.writeText(TAGS);show('태그 복사됨');};
show('조각 '+P.length+'개 (이미지 '+P.filter(p=>p.kind==='img').length+'장)');
