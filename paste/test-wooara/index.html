<script>
const P=[{"kind":"img","name":"head-food.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/head-food.png"},{"kind":"text","html":"<p>📍 서울 영등포구 국제금융로2길 36 지하1층</p><p>🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 끝</p><p>🍽 저녁 코스 1인 99,000원부터 / 점심 코스 39,000원부터 (2인부터)</p><p>🍷 콜키지 프리, 병 수 제한 없음</p><p>⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요</p><p><br></p><p>기념일 저녁은 늘 고민이에요.</p><p>고깃집은 시끄럽고, 호텔은 어깨가 굳고.</p><p>이번엔 둘만 들어가는 방에서 한우 코스를 먹는 집, 여의도 우아라로 정했어요.</p><p>내 돈 내고 먹은 후기예요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">01 가는 길</span></b></p>","plain":"📍 서울 영등포구 국제금융로2길 36 지하1층\n🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 끝\n🍽 저녁 코스 1인 99,000원부터 / 점심 코스 39,000원부터 (2인부터)\n🍷 콜키지 프리, 병 수 제한 없음\n⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요\n\n기념일 저녁은 늘 고민이에요.\n고깃집은 시끄럽고, 호텔은 어깨가 굳고.\n이번엔 둘만 들어가는 방에서 한우 코스를 먹는 집, 여의도 우아라로 정했어요.\n내 돈 내고 먹은 후기예요.\n\n01 가는 길"},{"kind":"img","name":"02.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/02.jpg"},{"kind":"text","html":"<p>여의도역 3번 출구 나와서 횡단보도 하나.</p><p>하얀 건물에 WOOARA 간판 보이면 다 온 거예요.</p>","plain":"여의도역 3번 출구 나와서 횡단보도 하나.\n하얀 건물에 WOOARA 간판 보이면 다 온 거예요."},{"kind":"img","name":"03.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/03.jpg"},{"kind":"text","html":"<p>차는 들어가는데 입구가 좁아요.</p><p><span style=\"background-color:#fff8b2\"><b>높이 2m 넘는 차, 바닥 낮은 차는 진입이 어렵대요.</b></span></p><p>어차피 술 마실 거면 지하철이 정답.</p>","plain":"차는 들어가는데 입구가 좁아요.\n높이 2m 넘는 차, 바닥 낮은 차는 진입이 어렵대요.\n어차피 술 마실 거면 지하철이 정답."},{"kind":"img","name":"04.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/04.jpg"},{"kind":"text","html":"<p>그리고 이거.</p><p><span style=\"background-color:#fff8b2\"><b>콜키지 프리, 병 수 제한 없음.</b></span></p><p>집에 모셔 둔 와인 들고 가면 술값 0원이에요. 이건 진짜 큰 장점.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">02 들어가 보면</span></b></p>","plain":"그리고 이거.\n콜키지 프리, 병 수 제한 없음.\n집에 모셔 둔 와인 들고 가면 술값 0원이에요. 이건 진짜 큰 장점.\n\n02 들어가 보면"},{"kind":"img","name":"05.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/05.jpg"},{"kind":"text","html":"<p>지하 1층 내려가자마자 금색 WOOARA.</p>","plain":"지하 1층 내려가자마자 금색 WOOARA."},{"kind":"img","name":"06.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/06.jpg"},{"kind":"text","html":"<p>예약 확인하고 따라 들어가는 복도가 동굴처럼 둥글게 휘어 있어요.</p><p>벌써 여의도 아닌 것 같은 기분.</p>","plain":"예약 확인하고 따라 들어가는 복도가 동굴처럼 둥글게 휘어 있어요.\n벌써 여의도 아닌 것 같은 기분."},{"kind":"img","name":"07.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/07.jpg"},{"kind":"text","html":"<p>양쪽으로 격자문이 쭉쭉. 방만 20개쯤 된대요.</p>","plain":"양쪽으로 격자문이 쭉쭉. 방만 20개쯤 된대요."},{"kind":"img","name":"08.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/08.jpg"},{"kind":"text","html":"<p>문 닫으면 진짜 둘만 남아요.</p><p>옆 테이블 건배 소리도, 직원 부르는 소리도 없음.</p><p>상견례로 오면 어른들이 좋아하시겠다 싶었어요.</p>","plain":"문 닫으면 진짜 둘만 남아요.\n옆 테이블 건배 소리도, 직원 부르는 소리도 없음.\n상견례로 오면 어른들이 좋아하시겠다 싶었어요."},{"kind":"img","name":"09.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/09.jpg"},{"kind":"text","html":"<p>주방은 탁 트인 오픈 키친.</p><p>요리사분들 손이 바쁘게 움직이는데 정리가 칼같아서 보는 맛이 있어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">03 메뉴판</span></b></p>","plain":"주방은 탁 트인 오픈 키친.\n요리사분들 손이 바쁘게 움직이는데 정리가 칼같아서 보는 맛이 있어요.\n\n03 메뉴판"},{"kind":"img","name":"11.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/11.jpg"},{"kind":"text","html":"<p>저녁은 한우 양(80g·120g·150g)에 따라 값이 갈려요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">저녁 코스</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">1인 가격</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">A코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">99,000원 / 109,000원 / 119,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">B코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">129,000원 / 139,000원 / 149,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">C코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">159,000원 / 169,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">시그니처</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">189,000원</td></tr></table><p><br></p><p>우리는 B코스.</p><p>저녁이 부담되면 <span style=\"background-color:#fff8b2\"><b>점심 A코스 39,000원</b></span>부터 있으니 이걸로 맛보기도 좋아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">04 코스 시작</span></b></p>","plain":"저녁은 한우 양(80g·120g·150g)에 따라 값이 갈려요.\n\n저녁 코스\t1인 가격\nA코스\t99,000원 / 109,000원 / 119,000원\nB코스\t129,000원 / 139,000원 / 149,000원\nC코스\t159,000원 / 169,000원\n시그니처\t189,000원\n\n우리는 B코스.\n저녁이 부담되면 점심 A코스 39,000원부터 있으니 이걸로 맛보기도 좋아요.\n\n04 코스 시작"},{"kind":"img","name":"15.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/15.jpg"},{"kind":"text","html":"<p>예약 때 \"기념일이에요\" 한마디 했을 뿐인데</p><p>앉자마자 샴페인이 쪼르륵.</p>","plain":"예약 때 \"기념일이에요\" 한마디 했을 뿐인데\n앉자마자 샴페인이 쪼르륵."},{"kind":"img","name":"16.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/16.jpg"},{"kind":"text","html":"<p>기포가 끝도 없이 올라와요. 시작부터 반은 먹고 들어감.</p>","plain":"기포가 끝도 없이 올라와요. 시작부터 반은 먹고 들어감."},{"kind":"img","name":"18.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/18.jpg"},{"kind":"text","html":"<p>그리고 등장한 나무 상자.</p><p>뚜껑을 열면 캐비어 통, 단호박, 토마토, 송이버섯, 계피, 솔방울까지.</p><p>크리스마스 맞이로 새로 꾸몄대요.</p>","plain":"그리고 등장한 나무 상자.\n뚜껑을 열면 캐비어 통, 단호박, 토마토, 송이버섯, 계피, 솔방울까지.\n크리스마스 맞이로 새로 꾸몄대요."},{"kind":"img","name":"19.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/19.jpg"},{"kind":"text","html":"<p>아랫칸을 열면 얼음 위에 오늘의 주인공.</p><p>마블링 촘촘한 한우 두 덩이.</p><p><span style=\"background-color:#fff8b2\"><b>이거 보고 나면 남은 코스가 다 기다려져요.</b></span></p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">차완무시</span></b></p>","plain":"아랫칸을 열면 얼음 위에 오늘의 주인공.\n마블링 촘촘한 한우 두 덩이.\n이거 보고 나면 남은 코스가 다 기다려져요.\n\n차완무시"},{"kind":"img","name":"20.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/20.jpg"},{"kind":"text","html":"<p>뚜껑 덮인 하얀 그릇 하나.</p>","plain":"뚜껑 덮인 하얀 그릇 하나."},{"kind":"img","name":"21.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/21.jpg"},{"kind":"text","html":"<p>열면 노란 계란찜 위에 캐비어, 성게알, 훈연 참송이가 소복.</p>","plain":"열면 노란 계란찜 위에 캐비어, 성게알, 훈연 참송이가 소복."},{"kind":"img","name":"22.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/22.jpg"},{"kind":"text","html":"<p>숟가락이 힘 하나 안 들이고 쑥 들어가요.</p><p>뜨끈한 계란이 혀에서 스르르 녹고</p><p>캐비어가 톡톡 터지면서 짭짤하게 간을 맞춰 줘요.</p><p>마지막에 트러플 향이 코로 훅.</p><p>첫 숟가락부터 \"아, 오늘 잘 왔다\" 싶었어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">한입 요리 네 가지</span></b></p>","plain":"숟가락이 힘 하나 안 들이고 쑥 들어가요.\n뜨끈한 계란이 혀에서 스르르 녹고\n캐비어가 톡톡 터지면서 짭짤하게 간을 맞춰 줘요.\n마지막에 트러플 향이 코로 훅.\n첫 숟가락부터 \"아, 오늘 잘 왔다\" 싶었어요.\n\n한입 요리 네 가지"},{"kind":"img","name":"23.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/23.jpg"},{"kind":"text","html":"<p>접시 받자마자 둘 다 \"와\".</p><p>이끼 깔고 솔방울, 나뭇가지, 석류알 그릇까지. 숲을 통째로 옮겨 왔어요.</p><p>오른쪽 위부터 시계 방향으로 먹으래요.</p>","plain":"접시 받자마자 둘 다 \"와\".\n이끼 깔고 솔방울, 나뭇가지, 석류알 그릇까지. 숲을 통째로 옮겨 왔어요.\n오른쪽 위부터 시계 방향으로 먹으래요."},{"kind":"img","name":"24.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/24.jpg"},{"kind":"text","html":"<p>첫 번째는 손으로 집어서 한입에 쏙.</p>","plain":"첫 번째는 손으로 집어서 한입에 쏙."},{"kind":"img","name":"25.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/25.jpg"},{"kind":"text","html":"<p>트러플 소스 올린 한우 안심.</p><p>씹을 새도 없이 사라져요. 아니 이게 벌써 끝이야?</p>","plain":"트러플 소스 올린 한우 안심.\n씹을 새도 없이 사라져요. 아니 이게 벌써 끝이야?"},{"kind":"img","name":"26.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/26.jpg"},{"kind":"text","html":"<p>김 타르트 안에 초밥, 관자, 멜론.</p><p>바삭한 김 깨물면 관자가 달큰하게, 끝에 멜론이 시원하게.</p><p>한 입에 세 번 맛이 바뀌어요.</p>","plain":"김 타르트 안에 초밥, 관자, 멜론.\n바삭한 김 깨물면 관자가 달큰하게, 끝에 멜론이 시원하게.\n한 입에 세 번 맛이 바뀌어요."},{"kind":"img","name":"27.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/27.jpg"},{"kind":"text","html":"<p>마지막은 새우랑 랍스터 말아 튀긴 스프링롤.</p><p>깨무는 순간 바사삭 소리가 방 안에 울려요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">참치와 절인 알배추</span></b></p>","plain":"마지막은 새우랑 랍스터 말아 튀긴 스프링롤.\n깨무는 순간 바사삭 소리가 방 안에 울려요.\n\n참치와 절인 알배추"},{"kind":"img","name":"28.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/28.jpg"},{"kind":"text","html":"<p>맑은 유자간장 위에 빨강, 노랑, 하양 조각들이 동동.</p>","plain":"맑은 유자간장 위에 빨강, 노랑, 하양 조각들이 동동."},{"kind":"img","name":"29.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/29.jpg"},{"kind":"text","html":"<p>참치 안에 절임무랑 미나리가 숨어 있어요.</p><p>부드러운 참치 다음에 아삭, 새콤한 유자간장이 입안을 싹 씻어 줘요.</p><p>기름진 거 먹은 입이 리셋되는 느낌.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">단호박 수프</span></b></p>","plain":"참치 안에 절임무랑 미나리가 숨어 있어요.\n부드러운 참치 다음에 아삭, 새콤한 유자간장이 입안을 싹 씻어 줘요.\n기름진 거 먹은 입이 리셋되는 느낌.\n\n단호박 수프"},{"kind":"img","name":"30.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/30.jpg"},{"kind":"text","html":"<p>샛노란 수프 가운데 구운 버섯 하나.</p><p>곶감, 잣, 트러플 오일이 숨어 있대요.</p>","plain":"샛노란 수프 가운데 구운 버섯 하나.\n곶감, 잣, 트러플 오일이 숨어 있대요."},{"kind":"img","name":"31.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/31.jpg"},{"kind":"text","html":"<p>한 숟갈 뜨면 단호박이 진하게 달고</p><p>잣이 고소하게, 곶감이 쫀득하게 따라와요.</p><p>찬 바람 불 때 이거 한 그릇이면 몸이 다 녹겠다 싶었어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">찐 전복</span></b></p>","plain":"한 숟갈 뜨면 단호박이 진하게 달고\n잣이 고소하게, 곶감이 쫀득하게 따라와요.\n찬 바람 불 때 이거 한 그릇이면 몸이 다 녹겠다 싶었어요.\n\n찐 전복"},{"kind":"img","name":"32.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/32.jpg"},{"kind":"text","html":"<p>간장 소스에 잠긴 전복 위로 초록 실다시마가 돌돌.</p>","plain":"간장 소스에 잠긴 전복 위로 초록 실다시마가 돌돌."},{"kind":"img","name":"33.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/33.jpg"},{"kind":"text","html":"<p>질길 줄 알았는데 웬걸, 칼 없이 숟가락으로 잘려요.</p><p>애호박찜, 무조림이랑 소스에 콕 찍어 먹으면 감칠맛이 끝까지 남아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">볏짚 훈연 장어 주먹밥</span></b></p>","plain":"질길 줄 알았는데 웬걸, 칼 없이 숟가락으로 잘려요.\n애호박찜, 무조림이랑 소스에 콕 찍어 먹으면 감칠맛이 끝까지 남아요.\n\n볏짚 훈연 장어 주먹밥"},{"kind":"img","name":"34.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/34.jpg"},{"kind":"text","html":"<p>청자빛 그릇 한가운데, 볏짚에 그을린 장어가 주먹밥 위에 턱.</p><p>연근, 김, 방아잎 튀김이 왕관처럼 올라가 있어요.</p>","plain":"청자빛 그릇 한가운데, 볏짚에 그을린 장어가 주먹밥 위에 턱.\n연근, 김, 방아잎 튀김이 왕관처럼 올라가 있어요."},{"kind":"img","name":"35.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/35.jpg"},{"kind":"text","html":"<p>여기서 직원분이 주전자 들고 와서 육수를 쪼르륵 부어 줘요.</p><p>김이 확 오르면서 볏짚 훈연 향이 방에 퍼지는데, 이 장면이 이 집 하이라이트 중 하나.</p>","plain":"여기서 직원분이 주전자 들고 와서 육수를 쪼르륵 부어 줘요.\n김이 확 오르면서 볏짚 훈연 향이 방에 퍼지는데, 이 장면이 이 집 하이라이트 중 하나."},{"kind":"img","name":"36.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/36.jpg"},{"kind":"text","html":"<p>숟가락으로 주먹밥 살살 풀어서</p>","plain":"숟가락으로 주먹밥 살살 풀어서"},{"kind":"img","name":"37.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/37.jpg"},{"kind":"text","html":"<p>노릇한 장어 한 점이랑 육수 머금은 밥을 같이 한 숟갈.</p><p>크.. 구수하고 뜨끈하고.</p><p>코스 먹다가 \"밥 먹었다\" 싶은 건 이 그릇이었어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">들기름 돌문어 한우국수</span></b></p>","plain":"노릇한 장어 한 점이랑 육수 머금은 밥을 같이 한 숟갈.\n크.. 구수하고 뜨끈하고.\n코스 먹다가 \"밥 먹었다\" 싶은 건 이 그릇이었어요.\n\n들기름 돌문어 한우국수"},{"kind":"img","name":"38.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/38.jpg"},{"kind":"text","html":"<p>작은 토기 그릇에 돌문어, 다진 한우, 참나물이 소복.</p>","plain":"작은 토기 그릇에 돌문어, 다진 한우, 참나물이 소복."},{"kind":"img","name":"39.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/39.jpg"},{"kind":"text","html":"<p>젓가락으로 휘휘 비벼서 들어 올리면 가는 면이 주르륵.</p><p>유자·레몬 육수가 상큼하게 치고 들어오고, 끝맛은 들기름이 고소하게 잡아 줘요.</p><p>문어는 쫄깃, 한우는 촉촉.</p><p>그릇이 작아서 아쉬울 정도로 금방 비웠어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">메인, 한우구이 반상</span></b></p>","plain":"젓가락으로 휘휘 비벼서 들어 올리면 가는 면이 주르륵.\n유자·레몬 육수가 상큼하게 치고 들어오고, 끝맛은 들기름이 고소하게 잡아 줘요.\n문어는 쫄깃, 한우는 촉촉.\n그릇이 작아서 아쉬울 정도로 금방 비웠어요.\n\n메인, 한우구이 반상"},{"kind":"img","name":"40.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/40.jpg"},{"kind":"text","html":"<p>드디어 메인.</p><p>미역국, 흰쌀밥, 갓김치, 고사리, 씨앗젓갈까지 한 상 쫙.</p>","plain":"드디어 메인.\n미역국, 흰쌀밥, 갓김치, 고사리, 씨앗젓갈까지 한 상 쫙."},{"kind":"img","name":"41.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/41.jpg"},{"kind":"text","html":"<p>한우는 육즙 안 빠지게 겉만 초벌해서 나와요.</p><p>이 단면 색 좀 보세요.</p>","plain":"한우는 육즙 안 빠지게 겉만 초벌해서 나와요.\n이 단면 색 좀 보세요."},{"kind":"img","name":"42.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/42.jpg"},{"kind":"text","html":"<p><span style=\"background-color:#fff8b2\"><b>그리고 내 앞에 내 화로.</b></span></p><p>버섯, 대파, 새송이랑 같이 올려서</p>","plain":"그리고 내 앞에 내 화로.\n버섯, 대파, 새송이랑 같이 올려서"},{"kind":"img","name":"43.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/43.jpg"},{"kind":"text","html":"<p>치익. 겉만 살짝 익혀 한 점, 조금 더 익혀 한 점.</p><p>씹으면 육즙이 쫙 나오고 고소한 기름 맛이 혀에 남을 때</p><p>미역국 한 숟갈 떠 먹으면.. 이게 한국 사람 마무리죠.</p><p>코스라 양 적을까 걱정했는데 <span style=\"background-color:#fff8b2\"><b>밥이랑 국 남겼어요.</b></span> 배 터지는 줄.</p>","plain":"치익. 겉만 살짝 익혀 한 점, 조금 더 익혀 한 점.\n씹으면 육즙이 쫙 나오고 고소한 기름 맛이 혀에 남을 때\n미역국 한 숟갈 떠 먹으면.. 이게 한국 사람 마무리죠.\n코스라 양 적을까 걱정했는데 밥이랑 국 남겼어요. 배 터지는 줄."},{"kind":"img","name":"44.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/44.jpg"},{"kind":"text","html":"<p>마지막 한 점에 샴페인 한 모금. 건배 안 할 수가 없죠.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">디저트</span></b></p>","plain":"마지막 한 점에 샴페인 한 모금. 건배 안 할 수가 없죠.\n\n디저트"},{"kind":"img","name":"45.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/45.jpg"},{"kind":"text","html":"<p>검은 접시에 \"Happy Anniversary\".</p><p>폴라로이드까지 찍어서 그 자리에서 뽑아 주셨어요.</p><p>솔직히 맛보다 이게 더 오래 기억날 것 같아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">05 가기 전에 알아 두면 좋은 것</span></b></p><p>· 기념일이면 <span style=\"background-color:#fff8b2\"><b>예약할 때 꼭 말하기.</b></span> 샴페인, 레터링, 폴라로이드까지 챙겨 줘요.</p><p>· 술은 들고 가기. 콜키지 무료라 와인 한 병이면 몇만원 아껴요.</p><p>· 큰 차는 주차장 입구에 걸릴 수 있어요.</p><p>· 코스는 2인부터라 혼밥은 안 돼요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">06 아쉬운 점</span></b></p><p>가격은 확실히 세요. 둘이 저녁 코스면 25만원이 훌쩍.</p><p>매일 갈 집은 아니고 \"오늘은 좀 잘 먹자\" 하는 날 가는 집이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">07 총평</span></b></p><p>문 닫히는 방에서, 내 화로에, 내 속도로 먹는 한우 코스.</p><p>차완무시 첫 숟갈부터 디저트 접시 글씨까지 두 시간 동안 휴대폰 한 번 안 봤어요.</p><p>기념일, 상견례, 부모님 생신처럼 자리가 중요한 날이면 여기 추천해요.</p><p>재방문 ○. 다음엔 부모님 모시고 점심 코스부터.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">08 오늘 쓴 돈(메뉴판 기준)</span></b></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">메뉴</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">수량</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">금액</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">저녁 B코스(한우 80g)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2인</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">콜키지</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">-</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">0원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">합계(2명)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\"></td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원(1인 129,000원)</td></tr></table><p><br></p><p>한우를 120g·150g으로 늘리면 1인 1만원씩 올라가요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">09 위치</span></b></p><p style=\"background:#F2F2F2;padding:14px;color:#888\">[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층] ← 여기서 네이버 에디터 [장소] 버튼으로 지도 넣기</p><p>여의도역 3번 출구에서 횡단보도 하나. IFC몰·더현대 서울 바로 옆이에요.</p><p>방이 정해져 있으니 주말 저녁은 꼭 예약하고 가세요.</p>","plain":"검은 접시에 \"Happy Anniversary\".\n폴라로이드까지 찍어서 그 자리에서 뽑아 주셨어요.\n솔직히 맛보다 이게 더 오래 기억날 것 같아요.\n\n05 가기 전에 알아 두면 좋은 것\n· 기념일이면 예약할 때 꼭 말하기. 샴페인, 레터링, 폴라로이드까지 챙겨 줘요.\n· 술은 들고 가기. 콜키지 무료라 와인 한 병이면 몇만원 아껴요.\n· 큰 차는 주차장 입구에 걸릴 수 있어요.\n· 코스는 2인부터라 혼밥은 안 돼요.\n\n06 아쉬운 점\n가격은 확실히 세요. 둘이 저녁 코스면 25만원이 훌쩍.\n매일 갈 집은 아니고 \"오늘은 좀 잘 먹자\" 하는 날 가는 집이에요.\n\n07 총평\n문 닫히는 방에서, 내 화로에, 내 속도로 먹는 한우 코스.\n차완무시 첫 숟갈부터 디저트 접시 글씨까지 두 시간 동안 휴대폰 한 번 안 봤어요.\n기념일, 상견례, 부모님 생신처럼 자리가 중요한 날이면 여기 추천해요.\n재방문 ○. 다음엔 부모님 모시고 점심 코스부터.\n\n08 오늘 쓴 돈(메뉴판 기준)\n메뉴\t수량\t금액\n저녁 B코스(한우 80g)\t2인\t258,000원\n콜키지\t-\t0원\n합계(2명)\t\t258,000원(1인 129,000원)\n\n한우를 120g·150g으로 늘리면 1인 1만원씩 올라가요.\n\n09 위치\n[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층]\n여의도역 3번 출구에서 횡단보도 하나. IFC몰·더현대 서울 바로 옆이에요.\n방이 정해져 있으니 주말 저녁은 꼭 예약하고 가세요."},{"kind":"img","name":"post-footer.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/post-footer.png"},{"kind":"text","html":"<p>블루노.</p>","plain":"블루노."}];
const FULL="<p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/head-food.png\" style=\"max-width:100%\"></p><p>📍 서울 영등포구 국제금융로2길 36 지하1층</p><p>🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 끝</p><p>🍽 저녁 코스 1인 99,000원부터 / 점심 코스 39,000원부터 (2인부터)</p><p>🍷 콜키지 프리, 병 수 제한 없음</p><p>⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요</p><p><br></p><p>기념일 저녁은 늘 고민이에요.</p><p>고깃집은 시끄럽고, 호텔은 어깨가 굳고.</p><p>이번엔 둘만 들어가는 방에서 한우 코스를 먹는 집, 여의도 우아라로 정했어요.</p><p>내 돈 내고 먹은 후기예요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">01 가는 길</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/02.jpg\" style=\"max-width:100%\"></p><p>여의도역 3번 출구 나와서 횡단보도 하나.</p><p>하얀 건물에 WOOARA 간판 보이면 다 온 거예요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/03.jpg\" style=\"max-width:100%\"></p><p>차는 들어가는데 입구가 좁아요.</p><p><span style=\"background-color:#fff8b2\"><b>높이 2m 넘는 차, 바닥 낮은 차는 진입이 어렵대요.</b></span></p><p>어차피 술 마실 거면 지하철이 정답.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/04.jpg\" style=\"max-width:100%\"></p><p>그리고 이거.</p><p><span style=\"background-color:#fff8b2\"><b>콜키지 프리, 병 수 제한 없음.</b></span></p><p>집에 모셔 둔 와인 들고 가면 술값 0원이에요. 이건 진짜 큰 장점.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">02 들어가 보면</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/05.jpg\" style=\"max-width:100%\"></p><p>지하 1층 내려가자마자 금색 WOOARA.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/06.jpg\" style=\"max-width:100%\"></p><p>예약 확인하고 따라 들어가는 복도가 동굴처럼 둥글게 휘어 있어요.</p><p>벌써 여의도 아닌 것 같은 기분.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/07.jpg\" style=\"max-width:100%\"></p><p>양쪽으로 격자문이 쭉쭉. 방만 20개쯤 된대요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/08.jpg\" style=\"max-width:100%\"></p><p>문 닫으면 진짜 둘만 남아요.</p><p>옆 테이블 건배 소리도, 직원 부르는 소리도 없음.</p><p>상견례로 오면 어른들이 좋아하시겠다 싶었어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/09.jpg\" style=\"max-width:100%\"></p><p>주방은 탁 트인 오픈 키친.</p><p>요리사분들 손이 바쁘게 움직이는데 정리가 칼같아서 보는 맛이 있어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">03 메뉴판</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/11.jpg\" style=\"max-width:100%\"></p><p>저녁은 한우 양(80g·120g·150g)에 따라 값이 갈려요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">저녁 코스</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">1인 가격</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">A코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">99,000원 / 109,000원 / 119,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">B코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">129,000원 / 139,000원 / 149,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">C코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">159,000원 / 169,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">시그니처</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">189,000원</td></tr></table><p><br></p><p>우리는 B코스.</p><p>저녁이 부담되면 <span style=\"background-color:#fff8b2\"><b>점심 A코스 39,000원</b></span>부터 있으니 이걸로 맛보기도 좋아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">04 코스 시작</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/15.jpg\" style=\"max-width:100%\"></p><p>예약 때 \"기념일이에요\" 한마디 했을 뿐인데</p><p>앉자마자 샴페인이 쪼르륵.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/16.jpg\" style=\"max-width:100%\"></p><p>기포가 끝도 없이 올라와요. 시작부터 반은 먹고 들어감.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/18.jpg\" style=\"max-width:100%\"></p><p>그리고 등장한 나무 상자.</p><p>뚜껑을 열면 캐비어 통, 단호박, 토마토, 송이버섯, 계피, 솔방울까지.</p><p>크리스마스 맞이로 새로 꾸몄대요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/19.jpg\" style=\"max-width:100%\"></p><p>아랫칸을 열면 얼음 위에 오늘의 주인공.</p><p>마블링 촘촘한 한우 두 덩이.</p><p><span style=\"background-color:#fff8b2\"><b>이거 보고 나면 남은 코스가 다 기다려져요.</b></span></p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">차완무시</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/20.jpg\" style=\"max-width:100%\"></p><p>뚜껑 덮인 하얀 그릇 하나.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/21.jpg\" style=\"max-width:100%\"></p><p>열면 노란 계란찜 위에 캐비어, 성게알, 훈연 참송이가 소복.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/22.jpg\" style=\"max-width:100%\"></p><p>숟가락이 힘 하나 안 들이고 쑥 들어가요.</p><p>뜨끈한 계란이 혀에서 스르르 녹고</p><p>캐비어가 톡톡 터지면서 짭짤하게 간을 맞춰 줘요.</p><p>마지막에 트러플 향이 코로 훅.</p><p>첫 숟가락부터 \"아, 오늘 잘 왔다\" 싶었어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">한입 요리 네 가지</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/23.jpg\" style=\"max-width:100%\"></p><p>접시 받자마자 둘 다 \"와\".</p><p>이끼 깔고 솔방울, 나뭇가지, 석류알 그릇까지. 숲을 통째로 옮겨 왔어요.</p><p>오른쪽 위부터 시계 방향으로 먹으래요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/24.jpg\" style=\"max-width:100%\"></p><p>첫 번째는 손으로 집어서 한입에 쏙.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/25.jpg\" style=\"max-width:100%\"></p><p>트러플 소스 올린 한우 안심.</p><p>씹을 새도 없이 사라져요. 아니 이게 벌써 끝이야?</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/26.jpg\" style=\"max-width:100%\"></p><p>김 타르트 안에 초밥, 관자, 멜론.</p><p>바삭한 김 깨물면 관자가 달큰하게, 끝에 멜론이 시원하게.</p><p>한 입에 세 번 맛이 바뀌어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/27.jpg\" style=\"max-width:100%\"></p><p>마지막은 새우랑 랍스터 말아 튀긴 스프링롤.</p><p>깨무는 순간 바사삭 소리가 방 안에 울려요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">참치와 절인 알배추</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/28.jpg\" style=\"max-width:100%\"></p><p>맑은 유자간장 위에 빨강, 노랑, 하양 조각들이 동동.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/29.jpg\" style=\"max-width:100%\"></p><p>참치 안에 절임무랑 미나리가 숨어 있어요.</p><p>부드러운 참치 다음에 아삭, 새콤한 유자간장이 입안을 싹 씻어 줘요.</p><p>기름진 거 먹은 입이 리셋되는 느낌.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">단호박 수프</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/30.jpg\" style=\"max-width:100%\"></p><p>샛노란 수프 가운데 구운 버섯 하나.</p><p>곶감, 잣, 트러플 오일이 숨어 있대요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/31.jpg\" style=\"max-width:100%\"></p><p>한 숟갈 뜨면 단호박이 진하게 달고</p><p>잣이 고소하게, 곶감이 쫀득하게 따라와요.</p><p>찬 바람 불 때 이거 한 그릇이면 몸이 다 녹겠다 싶었어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">찐 전복</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/32.jpg\" style=\"max-width:100%\"></p><p>간장 소스에 잠긴 전복 위로 초록 실다시마가 돌돌.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/33.jpg\" style=\"max-width:100%\"></p><p>질길 줄 알았는데 웬걸, 칼 없이 숟가락으로 잘려요.</p><p>애호박찜, 무조림이랑 소스에 콕 찍어 먹으면 감칠맛이 끝까지 남아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">볏짚 훈연 장어 주먹밥</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/34.jpg\" style=\"max-width:100%\"></p><p>청자빛 그릇 한가운데, 볏짚에 그을린 장어가 주먹밥 위에 턱.</p><p>연근, 김, 방아잎 튀김이 왕관처럼 올라가 있어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/35.jpg\" style=\"max-width:100%\"></p><p>여기서 직원분이 주전자 들고 와서 육수를 쪼르륵 부어 줘요.</p><p>김이 확 오르면서 볏짚 훈연 향이 방에 퍼지는데, 이 장면이 이 집 하이라이트 중 하나.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/36.jpg\" style=\"max-width:100%\"></p><p>숟가락으로 주먹밥 살살 풀어서</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/37.jpg\" style=\"max-width:100%\"></p><p>노릇한 장어 한 점이랑 육수 머금은 밥을 같이 한 숟갈.</p><p>크.. 구수하고 뜨끈하고.</p><p>코스 먹다가 \"밥 먹었다\" 싶은 건 이 그릇이었어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">들기름 돌문어 한우국수</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/38.jpg\" style=\"max-width:100%\"></p><p>작은 토기 그릇에 돌문어, 다진 한우, 참나물이 소복.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/39.jpg\" style=\"max-width:100%\"></p><p>젓가락으로 휘휘 비벼서 들어 올리면 가는 면이 주르륵.</p><p>유자·레몬 육수가 상큼하게 치고 들어오고, 끝맛은 들기름이 고소하게 잡아 줘요.</p><p>문어는 쫄깃, 한우는 촉촉.</p><p>그릇이 작아서 아쉬울 정도로 금방 비웠어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">메인, 한우구이 반상</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/40.jpg\" style=\"max-width:100%\"></p><p>드디어 메인.</p><p>미역국, 흰쌀밥, 갓김치, 고사리, 씨앗젓갈까지 한 상 쫙.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/41.jpg\" style=\"max-width:100%\"></p><p>한우는 육즙 안 빠지게 겉만 초벌해서 나와요.</p><p>이 단면 색 좀 보세요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/42.jpg\" style=\"max-width:100%\"></p><p><span style=\"background-color:#fff8b2\"><b>그리고 내 앞에 내 화로.</b></span></p><p>버섯, 대파, 새송이랑 같이 올려서</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/43.jpg\" style=\"max-width:100%\"></p><p>치익. 겉만 살짝 익혀 한 점, 조금 더 익혀 한 점.</p><p>씹으면 육즙이 쫙 나오고 고소한 기름 맛이 혀에 남을 때</p><p>미역국 한 숟갈 떠 먹으면.. 이게 한국 사람 마무리죠.</p><p>코스라 양 적을까 걱정했는데 <span style=\"background-color:#fff8b2\"><b>밥이랑 국 남겼어요.</b></span> 배 터지는 줄.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/44.jpg\" style=\"max-width:100%\"></p><p>마지막 한 점에 샴페인 한 모금. 건배 안 할 수가 없죠.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">디저트</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/45.jpg\" style=\"max-width:100%\"></p><p>검은 접시에 \"Happy Anniversary\".</p><p>폴라로이드까지 찍어서 그 자리에서 뽑아 주셨어요.</p><p>솔직히 맛보다 이게 더 오래 기억날 것 같아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">05 가기 전에 알아 두면 좋은 것</span></b></p><p>· 기념일이면 <span style=\"background-color:#fff8b2\"><b>예약할 때 꼭 말하기.</b></span> 샴페인, 레터링, 폴라로이드까지 챙겨 줘요.</p><p>· 술은 들고 가기. 콜키지 무료라 와인 한 병이면 몇만원 아껴요.</p><p>· 큰 차는 주차장 입구에 걸릴 수 있어요.</p><p>· 코스는 2인부터라 혼밥은 안 돼요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">06 아쉬운 점</span></b></p><p>가격은 확실히 세요. 둘이 저녁 코스면 25만원이 훌쩍.</p><p>매일 갈 집은 아니고 \"오늘은 좀 잘 먹자\" 하는 날 가는 집이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">07 총평</span></b></p><p>문 닫히는 방에서, 내 화로에, 내 속도로 먹는 한우 코스.</p><p>차완무시 첫 숟갈부터 디저트 접시 글씨까지 두 시간 동안 휴대폰 한 번 안 봤어요.</p><p>기념일, 상견례, 부모님 생신처럼 자리가 중요한 날이면 여기 추천해요.</p><p>재방문 ○. 다음엔 부모님 모시고 점심 코스부터.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">08 오늘 쓴 돈(메뉴판 기준)</span></b></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">메뉴</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">수량</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">금액</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">저녁 B코스(한우 80g)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2인</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">콜키지</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">-</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">0원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">합계(2명)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\"></td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원(1인 129,000원)</td></tr></table><p><br></p><p>한우를 120g·150g으로 늘리면 1인 1만원씩 올라가요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">09 위치</span></b></p><p style=\"background:#F2F2F2;padding:14px;color:#888\">[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층] ← 여기서 네이버 에디터 [장소] 버튼으로 지도 넣기</p><p>여의도역 3번 출구에서 횡단보도 하나. IFC몰·더현대 서울 바로 옆이에요.</p><p>방이 정해져 있으니 주말 저녁은 꼭 예약하고 가세요.</p><p style=\"text-align:center\"><a href=\"https://www.youtube.com/@bluno-economy\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/post-footer.png\" style=\"max-width:100%\"></a></p><p>블루노.</p><p><br></p><p>#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #여의도데이트 #내돈내산 #블루노</p>", FULLPLAIN="\n\n📍 서울 영등포구 국제금융로2길 36 지하1층\n🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 끝\n🍽 저녁 코스 1인 99,000원부터 / 점심 코스 39,000원부터 (2인부터)\n🍷 콜키지 프리, 병 수 제한 없음\n⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요\n\n기념일 저녁은 늘 고민이에요.\n고깃집은 시끄럽고, 호텔은 어깨가 굳고.\n이번엔 둘만 들어가는 방에서 한우 코스를 먹는 집, 여의도 우아라로 정했어요.\n내 돈 내고 먹은 후기예요.\n\n01 가는 길\n\n\n\n여의도역 3번 출구 나와서 횡단보도 하나.\n하얀 건물에 WOOARA 간판 보이면 다 온 거예요.\n\n\n\n차는 들어가는데 입구가 좁아요.\n높이 2m 넘는 차, 바닥 낮은 차는 진입이 어렵대요.\n어차피 술 마실 거면 지하철이 정답.\n\n\n\n그리고 이거.\n콜키지 프리, 병 수 제한 없음.\n집에 모셔 둔 와인 들고 가면 술값 0원이에요. 이건 진짜 큰 장점.\n\n02 들어가 보면\n\n\n\n지하 1층 내려가자마자 금색 WOOARA.\n\n\n\n예약 확인하고 따라 들어가는 복도가 동굴처럼 둥글게 휘어 있어요.\n벌써 여의도 아닌 것 같은 기분.\n\n\n\n양쪽으로 격자문이 쭉쭉. 방만 20개쯤 된대요.\n\n\n\n문 닫으면 진짜 둘만 남아요.\n옆 테이블 건배 소리도, 직원 부르는 소리도 없음.\n상견례로 오면 어른들이 좋아하시겠다 싶었어요.\n\n\n\n주방은 탁 트인 오픈 키친.\n요리사분들 손이 바쁘게 움직이는데 정리가 칼같아서 보는 맛이 있어요.\n\n03 메뉴판\n\n\n\n저녁은 한우 양(80g·120g·150g)에 따라 값이 갈려요.\n\n저녁 코스\t1인 가격\nA코스\t99,000원 / 109,000원 / 119,000원\nB코스\t129,000원 / 139,000원 / 149,000원\nC코스\t159,000원 / 169,000원\n시그니처\t189,000원\n\n우리는 B코스.\n저녁이 부담되면 점심 A코스 39,000원부터 있으니 이걸로 맛보기도 좋아요.\n\n04 코스 시작\n\n\n\n예약 때 \"기념일이에요\" 한마디 했을 뿐인데\n앉자마자 샴페인이 쪼르륵.\n\n\n\n기포가 끝도 없이 올라와요. 시작부터 반은 먹고 들어감.\n\n\n\n그리고 등장한 나무 상자.\n뚜껑을 열면 캐비어 통, 단호박, 토마토, 송이버섯, 계피, 솔방울까지.\n크리스마스 맞이로 새로 꾸몄대요.\n\n\n\n아랫칸을 열면 얼음 위에 오늘의 주인공.\n마블링 촘촘한 한우 두 덩이.\n이거 보고 나면 남은 코스가 다 기다려져요.\n\n차완무시\n\n\n\n뚜껑 덮인 하얀 그릇 하나.\n\n\n\n열면 노란 계란찜 위에 캐비어, 성게알, 훈연 참송이가 소복.\n\n\n\n숟가락이 힘 하나 안 들이고 쑥 들어가요.\n뜨끈한 계란이 혀에서 스르르 녹고\n캐비어가 톡톡 터지면서 짭짤하게 간을 맞춰 줘요.\n마지막에 트러플 향이 코로 훅.\n첫 숟가락부터 \"아, 오늘 잘 왔다\" 싶었어요.\n\n한입 요리 네 가지\n\n\n\n접시 받자마자 둘 다 \"와\".\n이끼 깔고 솔방울, 나뭇가지, 석류알 그릇까지. 숲을 통째로 옮겨 왔어요.\n오른쪽 위부터 시계 방향으로 먹으래요.\n\n\n\n첫 번째는 손으로 집어서 한입에 쏙.\n\n\n\n트러플 소스 올린 한우 안심.\n씹을 새도 없이 사라져요. 아니 이게 벌써 끝이야?\n\n\n\n김 타르트 안에 초밥, 관자, 멜론.\n바삭한 김 깨물면 관자가 달큰하게, 끝에 멜론이 시원하게.\n한 입에 세 번 맛이 바뀌어요.\n\n\n\n마지막은 새우랑 랍스터 말아 튀긴 스프링롤.\n깨무는 순간 바사삭 소리가 방 안에 울려요.\n\n참치와 절인 알배추\n\n\n\n맑은 유자간장 위에 빨강, 노랑, 하양 조각들이 동동.\n\n\n\n참치 안에 절임무랑 미나리가 숨어 있어요.\n부드러운 참치 다음에 아삭, 새콤한 유자간장이 입안을 싹 씻어 줘요.\n기름진 거 먹은 입이 리셋되는 느낌.\n\n단호박 수프\n\n\n\n샛노란 수프 가운데 구운 버섯 하나.\n곶감, 잣, 트러플 오일이 숨어 있대요.\n\n\n\n한 숟갈 뜨면 단호박이 진하게 달고\n잣이 고소하게, 곶감이 쫀득하게 따라와요.\n찬 바람 불 때 이거 한 그릇이면 몸이 다 녹겠다 싶었어요.\n\n찐 전복\n\n\n\n간장 소스에 잠긴 전복 위로 초록 실다시마가 돌돌.\n\n\n\n질길 줄 알았는데 웬걸, 칼 없이 숟가락으로 잘려요.\n애호박찜, 무조림이랑 소스에 콕 찍어 먹으면 감칠맛이 끝까지 남아요.\n\n볏짚 훈연 장어 주먹밥\n\n\n\n청자빛 그릇 한가운데, 볏짚에 그을린 장어가 주먹밥 위에 턱.\n연근, 김, 방아잎 튀김이 왕관처럼 올라가 있어요.\n\n\n\n여기서 직원분이 주전자 들고 와서 육수를 쪼르륵 부어 줘요.\n김이 확 오르면서 볏짚 훈연 향이 방에 퍼지는데, 이 장면이 이 집 하이라이트 중 하나.\n\n\n\n숟가락으로 주먹밥 살살 풀어서\n\n\n\n노릇한 장어 한 점이랑 육수 머금은 밥을 같이 한 숟갈.\n크.. 구수하고 뜨끈하고.\n코스 먹다가 \"밥 먹었다\" 싶은 건 이 그릇이었어요.\n\n들기름 돌문어 한우국수\n\n\n\n작은 토기 그릇에 돌문어, 다진 한우, 참나물이 소복.\n\n\n\n젓가락으로 휘휘 비벼서 들어 올리면 가는 면이 주르륵.\n유자·레몬 육수가 상큼하게 치고 들어오고, 끝맛은 들기름이 고소하게 잡아 줘요.\n문어는 쫄깃, 한우는 촉촉.\n그릇이 작아서 아쉬울 정도로 금방 비웠어요.\n\n메인, 한우구이 반상\n\n\n\n드디어 메인.\n미역국, 흰쌀밥, 갓김치, 고사리, 씨앗젓갈까지 한 상 쫙.\n\n\n\n한우는 육즙 안 빠지게 겉만 초벌해서 나와요.\n이 단면 색 좀 보세요.\n\n\n\n그리고 내 앞에 내 화로.\n버섯, 대파, 새송이랑 같이 올려서\n\n\n\n치익. 겉만 살짝 익혀 한 점, 조금 더 익혀 한 점.\n씹으면 육즙이 쫙 나오고 고소한 기름 맛이 혀에 남을 때\n미역국 한 숟갈 떠 먹으면.. 이게 한국 사람 마무리죠.\n코스라 양 적을까 걱정했는데 밥이랑 국 남겼어요. 배 터지는 줄.\n\n\n\n마지막 한 점에 샴페인 한 모금. 건배 안 할 수가 없죠.\n\n디저트\n\n\n\n검은 접시에 \"Happy Anniversary\".\n폴라로이드까지 찍어서 그 자리에서 뽑아 주셨어요.\n솔직히 맛보다 이게 더 오래 기억날 것 같아요.\n\n05 가기 전에 알아 두면 좋은 것\n· 기념일이면 예약할 때 꼭 말하기. 샴페인, 레터링, 폴라로이드까지 챙겨 줘요.\n· 술은 들고 가기. 콜키지 무료라 와인 한 병이면 몇만원 아껴요.\n· 큰 차는 주차장 입구에 걸릴 수 있어요.\n· 코스는 2인부터라 혼밥은 안 돼요.\n\n06 아쉬운 점\n가격은 확실히 세요. 둘이 저녁 코스면 25만원이 훌쩍.\n매일 갈 집은 아니고 \"오늘은 좀 잘 먹자\" 하는 날 가는 집이에요.\n\n07 총평\n문 닫히는 방에서, 내 화로에, 내 속도로 먹는 한우 코스.\n차완무시 첫 숟갈부터 디저트 접시 글씨까지 두 시간 동안 휴대폰 한 번 안 봤어요.\n기념일, 상견례, 부모님 생신처럼 자리가 중요한 날이면 여기 추천해요.\n재방문 ○. 다음엔 부모님 모시고 점심 코스부터.\n\n08 오늘 쓴 돈(메뉴판 기준)\n메뉴\t수량\t금액\n저녁 B코스(한우 80g)\t2인\t258,000원\n콜키지\t-\t0원\n합계(2명)\t\t258,000원(1인 129,000원)\n\n한우를 120g·150g으로 늘리면 1인 1만원씩 올라가요.\n\n09 위치\n[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층]\n여의도역 3번 출구에서 횡단보도 하나. IFC몰·더현대 서울 바로 옆이에요.\n방이 정해져 있으니 주말 저녁은 꼭 예약하고 가세요.\n\n\n\n블루노.\n\n#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #여의도데이트 #내돈내산 #블루노";
const TITLE="[여의도역 맛집] 우아라 여의도점 - 문 닫히는 방에서 내 화로로 굽는 한우 오마카세 (콜키지 프리)", TAGS="#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #여의도데이트 #내돈내산 #블루노";
let i=0;
const list=document.getElementById('list');
P.forEach((p,k)=>{const d=document.createElement('div');d.className='p';d.id='p'+k;
 d.innerHTML='<span class="n">'+(k+1)+'</span><button class="copy">이것만 복사</button>'+(p.kind==='img'?'<img src="'+p.data+'">':p.html);
 d.querySelector('.copy').onclick=()=>copy(k,false);list.appendChild(d);});
async function copy(k,adv=true){const p=P[k];
 try{ if(p.kind==='img'){const b=await (await fetch(p.data)).blob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);}
 else{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([p.html],{type:'text/html'}),'text/plain':new Blob([p.plain],{type:'text/plain'})})]);}
 document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur'));
 const el=document.getElementById('p'+k);el.classList.add('cur','done');el.scrollIntoView({block:'center',behavior:'smooth'});
 if(adv) i=k+1; show((p.kind==='img'?'이미지':'글')+' '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');
 }catch(e){ if(p.kind==='text'){const el=document.getElementById('p'+k);const r=document.createRange();r.selectNodeContents(el);r.setStartAfter(el.querySelector('.copy'));const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');s.removeAllRanges();if(ok){el.classList.add('cur','done');if(adv)i=k+1;show('글 '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');return;}} show('복사 실패: '+e.message+' (이미지는 그림 위 오른쪽 클릭 → 이미지 복사)');}}
function show(t){document.getElementById('status').textContent=t;}
document.getElementById('next').onclick=()=>{ if(i>=P.length){show('끝! 태그 복사 후 발행하세요');return;} copy(i); };
document.getElementById('all').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([FULL],{type:'text/html'}),'text/plain':new Blob([FULLPLAIN],{type:'text/plain'})})]);show('본문 전체(글+이미지 '+P.filter(p=>p.kind==='img').length+'장) 복사됨 → 네이버 본문에 Ctrl+V 한 번');}catch(e){show('복사 실패: '+e.message);}};
document.getElementById('reset').onclick=()=>{i=0;document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur','done'));show('처음부터');window.scrollTo(0,0);};
document.getElementById('ctitle').onclick=async()=>{await navigator.clipboard.writeText(TITLE);show('제목 복사됨');};
document.getElementById('ctags').onclick=async()=>{await navigator.clipboard.writeText(TAGS);show('태그 복사됨');};
show('조각 '+P.length+'개 (이미지 '+P.filter(p=>p.kind==='img').length+'장)');
</script></body></html>
