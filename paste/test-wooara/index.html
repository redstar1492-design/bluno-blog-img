<script>
const P=[{"kind":"img","name":"head-food.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/head-food.png"},{"kind":"text","html":"<p>📍 서울 영등포구 국제금융로2길 36 지하1층</p><p>🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 바로</p><p>🍽 저녁 코스 1인 99,000원부터 / 점심 코스 39,000원부터 (코스는 2인부터)</p><p>🍷 콜키지 프리, 병 수 제한 없음</p><p>🅿 주차 가능(입구가 좁아 높이 2m 넘는 차는 어려움)</p><p>⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요</p><p><br></p><p>기념일 저녁, 어디서 먹을지 일주일을 고민했어요.</p><p>고깃집은 연기에 옆 테이블 소리에 정신이 없고,</p><p>호텔 레스토랑은 왠지 어깨에 힘이 들어가고.</p><p><br></p><p><span style=\"background-color:#fff8b2\"><b>\"조용히 둘이서, 맛있는 한우를, 천천히.\"</b></span></p><p>이 세 가지를 다 들어준 곳이 여의도역 바로 앞 우아라였어요.</p><p>결론부터 말하면, 방문을 닫는 순간부터 디저트 접시에 적힌 글씨를 볼 때까지 두 시간 동안 한 번도 휴대폰을 안 봤어요.</p><p>내 돈 내고 먹은 후기입니다.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">01 여의도역에서 3분, 찾기 쉬워요</span></b></p>","plain":"📍 서울 영등포구 국제금융로2길 36 지하1층\n🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 바로\n🍽 저녁 코스 1인 99,000원부터 / 점심 코스 39,000원부터 (코스는 2인부터)\n🍷 콜키지 프리, 병 수 제한 없음\n🅿 주차 가능(입구가 좁아 높이 2m 넘는 차는 어려움)\n⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요\n\n기념일 저녁, 어디서 먹을지 일주일을 고민했어요.\n고깃집은 연기에 옆 테이블 소리에 정신이 없고,\n호텔 레스토랑은 왠지 어깨에 힘이 들어가고.\n\n\"조용히 둘이서, 맛있는 한우를, 천천히.\"\n이 세 가지를 다 들어준 곳이 여의도역 바로 앞 우아라였어요.\n결론부터 말하면, 방문을 닫는 순간부터 디저트 접시에 적힌 글씨를 볼 때까지 두 시간 동안 한 번도 휴대폰을 안 봤어요.\n내 돈 내고 먹은 후기입니다.\n\n01 여의도역에서 3분, 찾기 쉬워요"},{"kind":"img","name":"02.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/02.jpg"},{"kind":"text","html":"<p>여의도역 3번 출구로 나와 횡단보도 하나만 건너면 하얀 건물에 WOOARA 간판이 보여요.</p><p>IFC몰, 더현대 서울이 바로 옆이라 쇼핑하다 넘어오기 딱 좋은 거리예요.</p>","plain":"여의도역 3번 출구로 나와 횡단보도 하나만 건너면 하얀 건물에 WOOARA 간판이 보여요.\nIFC몰, 더현대 서울이 바로 옆이라 쇼핑하다 넘어오기 딱 좋은 거리예요."},{"kind":"img","name":"03.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/03.jpg"},{"kind":"text","html":"<p>차를 가져가신다면 이건 꼭 보고 가세요.</p><p><span style=\"background-color:#fff8b2\"><b>주차장 입구가 좁아서 높이 2m 넘는 차, 차체가 낮은 차는 못 들어갈 수 있어요.</b></span></p><p>코스에 술 한잔 곁들일 거라면 지하철이 속 편해요.</p>","plain":"차를 가져가신다면 이건 꼭 보고 가세요.\n주차장 입구가 좁아서 높이 2m 넘는 차, 차체가 낮은 차는 못 들어갈 수 있어요.\n코스에 술 한잔 곁들일 거라면 지하철이 속 편해요."},{"kind":"img","name":"04.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/04.jpg"},{"kind":"text","html":"<p>그리고 이 집의 숨은 장점. <span style=\"background-color:#fff8b2\"><b>콜키지 프리, 그것도 병 수 제한이 없어요.</b></span></p><p>집에 아껴 둔 와인, 선물 받은 위스키 한 병 들고 가면 그날 술값이 0원이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">02 문 하나 지나면 여의도 소음이 사라져요</span></b></p>","plain":"그리고 이 집의 숨은 장점. 콜키지 프리, 그것도 병 수 제한이 없어요.\n집에 아껴 둔 와인, 선물 받은 위스키 한 병 들고 가면 그날 술값이 0원이에요.\n\n02 문 하나 지나면 여의도 소음이 사라져요"},{"kind":"img","name":"05.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/05.jpg"},{"kind":"text","html":"<p>지하 1층으로 내려가면 어두운 벽에 WOOARA 금색 글씨, 그 옆으로 파란 빛이 흐르는 유리 벽이 맞아 줘요.</p>","plain":"지하 1층으로 내려가면 어두운 벽에 WOOARA 금색 글씨, 그 옆으로 파란 빛이 흐르는 유리 벽이 맞아 줘요."},{"kind":"img","name":"06.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/06.jpg"},{"kind":"text","html":"<p>예약을 확인하고 들어가는 복도가 동굴처럼 둥글게 감겨 있어요. 여기서부터 벌써 다른 데 온 기분이에요.</p>","plain":"예약을 확인하고 들어가는 복도가 동굴처럼 둥글게 감겨 있어요. 여기서부터 벌써 다른 데 온 기분이에요."},{"kind":"img","name":"07.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/07.jpg"},{"kind":"text","html":"<p>복도 양옆으로 격자무늬 문이 쭉 이어져요. 방이 20개쯤 있대요.</p>","plain":"복도 양옆으로 격자무늬 문이 쭉 이어져요. 방이 20개쯤 있대요."},{"kind":"img","name":"08.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/08.jpg"},{"kind":"text","html":"<p><span style=\"background-color:#fff8b2\"><b>모든 자리가 문 닫히는 방이에요.</b></span></p><p>옆 테이블 웃음소리도, 직원 부르는 소리도 안 들려요.</p><p>목소리 낮춰서 얘기해도 다 들리니까, 오랜만에 얼굴 보고 대화를 했어요.</p><p>양가 부모님 처음 뵙는 상견례 자리로도 이만한 데가 없겠다 싶었어요.</p>","plain":"모든 자리가 문 닫히는 방이에요.\n옆 테이블 웃음소리도, 직원 부르는 소리도 안 들려요.\n목소리 낮춰서 얘기해도 다 들리니까, 오랜만에 얼굴 보고 대화를 했어요.\n양가 부모님 처음 뵙는 상견례 자리로도 이만한 데가 없겠다 싶었어요."},{"kind":"img","name":"09.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/09.jpg"},{"kind":"text","html":"<p>주방은 탁 트인 열린 주방이에요. 요리사분들이 바쁘게 움직이는 게 다 보이는데, 정돈이 잘 돼 있어서 오히려 믿음이 가요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">03 메뉴판, 미리 보고 가세요</span></b></p>","plain":"주방은 탁 트인 열린 주방이에요. 요리사분들이 바쁘게 움직이는 게 다 보이는데, 정돈이 잘 돼 있어서 오히려 믿음이 가요.\n\n03 메뉴판, 미리 보고 가세요"},{"kind":"img","name":"11.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/11.jpg"},{"kind":"text","html":"<p>저녁 코스는 한우 양(80g·120g·150g)에 따라 값이 나뉘어요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">저녁 코스</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">1인 가격</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">A코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">99,000원 / 109,000원 / 119,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">B코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">129,000원 / 139,000원 / 149,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">C코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">159,000원 / 169,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">시그니처</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">189,000원</td></tr></table><p><br></p><p>저녁이 부담되면 <span style=\"background-color:#fff8b2\"><b>점심 A코스 39,000원</b></span>으로 먼저 맛보는 것도 방법이에요.</p><p>저희는 저녁 B코스로 골랐어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">04 코스가 시작되면</span></b></p>","plain":"저녁 코스는 한우 양(80g·120g·150g)에 따라 값이 나뉘어요.\n\n저녁 코스\t1인 가격\nA코스\t99,000원 / 109,000원 / 119,000원\nB코스\t129,000원 / 139,000원 / 149,000원\nC코스\t159,000원 / 169,000원\n시그니처\t189,000원\n\n저녁이 부담되면 점심 A코스 39,000원으로 먼저 맛보는 것도 방법이에요.\n저희는 저녁 B코스로 골랐어요.\n\n04 코스가 시작되면"},{"kind":"img","name":"15.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/15.jpg"},{"kind":"text","html":"<p>예약할 때 \"기념일이에요\" 한마디 했을 뿐인데, 자리에 앉자마자 샴페인이 나왔어요.</p><p>직원분이 잔에 직접 따라 주시는데, 가는 기포가 끝도 없이 올라오는 걸 보고 둘이 동시에 웃었어요.</p>","plain":"예약할 때 \"기념일이에요\" 한마디 했을 뿐인데, 자리에 앉자마자 샴페인이 나왔어요.\n직원분이 잔에 직접 따라 주시는데, 가는 기포가 끝도 없이 올라오는 걸 보고 둘이 동시에 웃었어요."},{"kind":"img","name":"18.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/18.jpg"},{"kind":"text","html":"<p>그다음이 이 집의 첫 번째 쇼예요. 나무 상자를 열어 오늘 쓸 재료를 보여 주세요.</p><p>캐비어 통, 반짝이는 단호박과 토마토, 송이버섯, 계피 막대와 솔방울까지. 크리스마스를 앞두고 새로 꾸몄대요.</p>","plain":"그다음이 이 집의 첫 번째 쇼예요. 나무 상자를 열어 오늘 쓸 재료를 보여 주세요.\n캐비어 통, 반짝이는 단호박과 토마토, 송이버섯, 계피 막대와 솔방울까지. 크리스마스를 앞두고 새로 꾸몄대요."},{"kind":"img","name":"19.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/19.jpg"},{"kind":"text","html":"<p>아래 칸을 열면 얼음 위에 오늘의 주인공 한우가 누워 있어요.</p><p><span style=\"background-color:#fff8b2\"><b>하얀 마블링이 촘촘히 박힌 붉은 고기.</b></span> 이걸 보고 나면 남은 코스가 다 기다려져요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">① 차완무시</span></b></p>","plain":"아래 칸을 열면 얼음 위에 오늘의 주인공 한우가 누워 있어요.\n하얀 마블링이 촘촘히 박힌 붉은 고기. 이걸 보고 나면 남은 코스가 다 기다려져요.\n\n① 차완무시"},{"kind":"img","name":"21.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/21.jpg"},{"kind":"text","html":"<p>뚜껑을 열면 노란 계란찜 위에 까만 캐비어, 주황빛 성게알, 훈연한 참송이가 얌전히 올라가 있어요.</p>","plain":"뚜껑을 열면 노란 계란찜 위에 까만 캐비어, 주황빛 성게알, 훈연한 참송이가 얌전히 올라가 있어요."},{"kind":"img","name":"22.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/22.jpg"},{"kind":"text","html":"<p>숟가락이 아무 힘 없이 쑥 들어가요. 한 입 떠먹으면 따뜻하고 매끈한 계란이 혀 위에서 녹고, 뒤따라 트러플 향이 코로 올라와요.</p><p>캐비어가 톡 터지면서 짭조름한 맛이 간을 딱 맞춰 줘요. 빈속을 살살 깨우는 첫 숟가락이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">② 숲속 정원 같은 한입 요리 네 가지</span></b></p>","plain":"숟가락이 아무 힘 없이 쑥 들어가요. 한 입 떠먹으면 따뜻하고 매끈한 계란이 혀 위에서 녹고, 뒤따라 트러플 향이 코로 올라와요.\n캐비어가 톡 터지면서 짭조름한 맛이 간을 딱 맞춰 줘요. 빈속을 살살 깨우는 첫 숟가락이에요.\n\n② 숲속 정원 같은 한입 요리 네 가지"},{"kind":"img","name":"23.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/23.jpg"},{"kind":"text","html":"<p>접시를 받는 순간 \"와\" 소리가 나요. 이끼를 깐 접시 위에 솔방울, 나무 가지, 석류알 그릇까지. 작은 숲을 통째로 옮겨 놓은 것 같아요.</p><p>오른쪽 위부터 시계 방향으로 먹으면 된다고 알려 주세요.</p>","plain":"접시를 받는 순간 \"와\" 소리가 나요. 이끼를 깐 접시 위에 솔방울, 나무 가지, 석류알 그릇까지. 작은 숲을 통째로 옮겨 놓은 것 같아요.\n오른쪽 위부터 시계 방향으로 먹으면 된다고 알려 주세요."},{"kind":"img","name":"25.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/25.jpg"},{"kind":"text","html":"<p>트러플 소스를 올린 한우 안심은 한 입에 쏙. 고기가 부드러워서 씹을 새도 없이 사라져요.</p>","plain":"트러플 소스를 올린 한우 안심은 한 입에 쏙. 고기가 부드러워서 씹을 새도 없이 사라져요."},{"kind":"img","name":"26.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/26.jpg"},{"kind":"text","html":"<p>김 타르트 안에는 초밥, 관자, 멜론이 숨어 있어요. 바삭한 김 다음에 관자의 단맛, 마지막에 멜론의 시원한 단맛이 차례로 와요.</p>","plain":"김 타르트 안에는 초밥, 관자, 멜론이 숨어 있어요. 바삭한 김 다음에 관자의 단맛, 마지막에 멜론의 시원한 단맛이 차례로 와요."},{"kind":"img","name":"27.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/27.jpg"},{"kind":"text","html":"<p>마지막은 새우와 랍스터를 말아 튀긴 스프링롤. 깨무는 순간 바삭 소리가 방 안에 울려요.</p><p>네 가지가 식감이 다 달라서, 다음 걸 집을 때마다 은근히 설레요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">③ 참치와 절인 알배추</span></b></p>","plain":"마지막은 새우와 랍스터를 말아 튀긴 스프링롤. 깨무는 순간 바삭 소리가 방 안에 울려요.\n네 가지가 식감이 다 달라서, 다음 걸 집을 때마다 은근히 설레요.\n\n③ 참치와 절인 알배추"},{"kind":"img","name":"28.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/28.jpg"},{"kind":"text","html":"<p>맑은 유자간장 위에 빨갛고 노랗고 하얀 조각들이 보석처럼 놓여 있어요.</p>","plain":"맑은 유자간장 위에 빨갛고 노랗고 하얀 조각들이 보석처럼 놓여 있어요."},{"kind":"img","name":"29.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/29.jpg"},{"kind":"text","html":"<p>참치 안에 절임무와 미나리가 들어 있어서 한 입에 부드러움과 아삭함이 같이 와요.</p><p>유자간장의 새콤함이 입안을 싹 씻어 줘서, 다음 요리를 맞을 준비가 돼요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">④ 단호박 수프</span></b></p>","plain":"참치 안에 절임무와 미나리가 들어 있어서 한 입에 부드러움과 아삭함이 같이 와요.\n유자간장의 새콤함이 입안을 싹 씻어 줘서, 다음 요리를 맞을 준비가 돼요.\n\n④ 단호박 수프"},{"kind":"img","name":"30.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/30.jpg"},{"kind":"text","html":"<p>샛노란 단호박 수프 한가운데 구운 버섯이 올라가 있어요. 곶감과 다진 잣, 트러플 오일까지.</p>","plain":"샛노란 단호박 수프 한가운데 구운 버섯이 올라가 있어요. 곶감과 다진 잣, 트러플 오일까지."},{"kind":"img","name":"31.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/31.jpg"},{"kind":"text","html":"<p>떠먹으면 진한 단호박 단맛이 먼저 오고, 잣이 고소하게, 곶감이 쫀득하게 따라와요.</p><p>찬 바람 부는 날이면 이 한 그릇이 계속 생각날 것 같아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑤ 찐 전복</span></b></p>","plain":"떠먹으면 진한 단호박 단맛이 먼저 오고, 잣이 고소하게, 곶감이 쫀득하게 따라와요.\n찬 바람 부는 날이면 이 한 그릇이 계속 생각날 것 같아요.\n\n⑤ 찐 전복"},{"kind":"img","name":"32.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/32.jpg"},{"kind":"text","html":"<p>간장 소스에 잠긴 전복 위로 초록 실다시마가 동그랗게 말려 있어요.</p>","plain":"간장 소스에 잠긴 전복 위로 초록 실다시마가 동그랗게 말려 있어요."},{"kind":"img","name":"33.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/33.jpg"},{"kind":"text","html":"<p>전복은 부드럽게 쪄져서 질기지 않고 쫄깃해요. 애호박찜, 무조림, 대파조림을 곁들여 소스에 찍어 먹으면 감칠맛이 입안에 오래 남아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑥ 볏짚 훈연 장어 주먹밥</span></b></p>","plain":"전복은 부드럽게 쪄져서 질기지 않고 쫄깃해요. 애호박찜, 무조림, 대파조림을 곁들여 소스에 찍어 먹으면 감칠맛이 입안에 오래 남아요.\n\n⑥ 볏짚 훈연 장어 주먹밥"},{"kind":"img","name":"34.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/34.jpg"},{"kind":"text","html":"<p>청자빛 그릇 가운데, 볏짚에 훈연한 장어가 주먹밥 위에 올라가 있어요. 연근, 김, 방아잎 튀김이 왕관처럼 얹혀 있고요.</p>","plain":"청자빛 그릇 가운데, 볏짚에 훈연한 장어가 주먹밥 위에 올라가 있어요. 연근, 김, 방아잎 튀김이 왕관처럼 얹혀 있고요."},{"kind":"img","name":"35.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/35.jpg"},{"kind":"text","html":"<p>여기서 직원분이 주전자를 들고 와 따뜻한 육수를 천천히 부어 주세요. 김이 확 올라오면서 훈연 향이 방 안에 퍼져요.</p>","plain":"여기서 직원분이 주전자를 들고 와 따뜻한 육수를 천천히 부어 주세요. 김이 확 올라오면서 훈연 향이 방 안에 퍼져요."},{"kind":"img","name":"36.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/36.jpg"},{"kind":"text","html":"<p>주먹밥을 숟가락으로 살짝 풀면 육수에 밥알이 풀려요.</p>","plain":"주먹밥을 숟가락으로 살짝 풀면 육수에 밥알이 풀려요."},{"kind":"img","name":"37.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/37.jpg"},{"kind":"text","html":"<p>노릇하게 그을린 장어 한 점, 육수 머금은 밥 한 숟갈. 구수하고 따뜻해서 속이 편안해지는 맛이에요. 코스 중에 제일 \"밥 먹었다\" 싶은 순간이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑦ 들기름 돌문어 한우국수</span></b></p>","plain":"노릇하게 그을린 장어 한 점, 육수 머금은 밥 한 숟갈. 구수하고 따뜻해서 속이 편안해지는 맛이에요. 코스 중에 제일 \"밥 먹었다\" 싶은 순간이에요.\n\n⑦ 들기름 돌문어 한우국수"},{"kind":"img","name":"38.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/38.jpg"},{"kind":"text","html":"<p>작은 토기 그릇에 하얀 돌문어, 다진 한우, 참나물이 소복이 올라가 있어요.</p>","plain":"작은 토기 그릇에 하얀 돌문어, 다진 한우, 참나물이 소복이 올라가 있어요."},{"kind":"img","name":"39.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/39.jpg"},{"kind":"text","html":"<p>젓가락으로 휘휘 비벼서 들어 올리면 가는 면이 쭉. 유자·레몬 육수가 상큼하게 치고 들어오고, 끝에 들기름의 고소함이 남아요.</p><p>쫄깃한 문어와 고기가 면 사이사이에 씹혀서, 작은 그릇인데 아쉽게 금방 비워요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑧ 메인, 내 화로에서 굽는 한우와 미역국 반상</span></b></p>","plain":"젓가락으로 휘휘 비벼서 들어 올리면 가는 면이 쭉. 유자·레몬 육수가 상큼하게 치고 들어오고, 끝에 들기름의 고소함이 남아요.\n쫄깃한 문어와 고기가 면 사이사이에 씹혀서, 작은 그릇인데 아쉽게 금방 비워요.\n\n⑧ 메인, 내 화로에서 굽는 한우와 미역국 반상"},{"kind":"img","name":"40.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/40.jpg"},{"kind":"text","html":"<p>드디어 메인. 미역국에 흰쌀밥, 갓김치, 고사리나물, 씨앗젓갈까지 한 상이 차려져요.</p>","plain":"드디어 메인. 미역국에 흰쌀밥, 갓김치, 고사리나물, 씨앗젓갈까지 한 상이 차려져요."},{"kind":"img","name":"41.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/41.jpg"},{"kind":"text","html":"<p>한우는 육즙이 빠지지 않게 겉만 초벌해서 나와요. 단면의 붉은빛 좀 보세요.</p>","plain":"한우는 육즙이 빠지지 않게 겉만 초벌해서 나와요. 단면의 붉은빛 좀 보세요."},{"kind":"img","name":"42.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/42.jpg"},{"kind":"text","html":"<p><span style=\"background-color:#fff8b2\"><b>그리고 내 앞에 놓인 작은 화로. 여기서 내가 원하는 만큼 구워 먹어요.</b></span></p><p>버섯, 대파, 새송이도 같이 올려요.</p>","plain":"그리고 내 앞에 놓인 작은 화로. 여기서 내가 원하는 만큼 구워 먹어요.\n버섯, 대파, 새송이도 같이 올려요."},{"kind":"img","name":"43.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/43.jpg"},{"kind":"text","html":"<p>치익 소리 나게 겉만 살짝 익혀 한 점, 조금 더 익혀 한 점.</p><p>씹으면 육즙이 배어 나오고, 고소한 기름 맛이 혀에 남을 때 미역국 한 숟갈. 이게 한국 사람 입에 딱 맞는 마무리예요.</p><p>코스라 양이 적을까 걱정했는데, <span style=\"background-color:#fff8b2\"><b>밥과 국을 남길 만큼 배가 불렀어요.</b></span></p>","plain":"치익 소리 나게 겉만 살짝 익혀 한 점, 조금 더 익혀 한 점.\n씹으면 육즙이 배어 나오고, 고소한 기름 맛이 혀에 남을 때 미역국 한 숟갈. 이게 한국 사람 입에 딱 맞는 마무리예요.\n코스라 양이 적을까 걱정했는데, 밥과 국을 남길 만큼 배가 불렀어요."},{"kind":"img","name":"44.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/44.jpg"},{"kind":"text","html":"<p>마지막 고기 한 점에 샴페인 한 모금. 건배를 안 할 수가 없어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑨ 디저트, 그리고 접시 위의 글씨</span></b></p>","plain":"마지막 고기 한 점에 샴페인 한 모금. 건배를 안 할 수가 없어요.\n\n⑨ 디저트, 그리고 접시 위의 글씨"},{"kind":"img","name":"45.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/45.jpg"},{"kind":"text","html":"<p>식사를 마치니 검은 접시에 \"Happy Anniversary\"가 적힌 디저트가 나왔어요.</p><p>폴라로이드 사진까지 찍어서 그 자리에서 뽑아 주셨고요.</p><p>음식도 음식이지만, 이 집을 다시 찾게 만드는 건 이런 마음 씀씀이예요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">05 이건 알고 가세요</span></b></p><p>· 기념일이면 <span style=\"background-color:#fff8b2\"><b>예약할 때 꼭 미리 말하세요.</b></span> 샴페인, 레터링, 폴라로이드까지 챙겨 주세요.</p><p>· 술은 들고 가세요. 콜키지가 무료라 와인 한 병이면 술값을 크게 아껴요.</p><p>· 큰 차는 주차장 입구가 걸릴 수 있어요. 지하철이 편해요.</p><p>· 코스는 2인부터라 혼자는 어려워요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">06 아쉬운 점</span></b></p><p>가격이 가볍지는 않아요. 둘이 저녁 코스면 25만원이 넘어요.</p><p>매일 갈 집은 아니고, \"오늘은 좀 잘 먹자\" 하는 날에 가는 집이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">07 총평</span></b></p><p>한 줄로 말하면 <span style=\"background-color:#fff8b2\"><b>문 닫힌 방에서 대접받으며 한우 코스를 천천히 먹는 집</b></span>이에요.</p><p>기념일, 상견례, 부모님 생신처럼 자리가 중요한 날에 추천해요.</p><p>재방문 ○. 다음엔 부모님 모시고 점심 코스부터 가 보려고요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">08 오늘 쓴 돈(메뉴판 기준)</span></b></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">메뉴</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">수량</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">금액</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">저녁 B코스(한우 80g 기준)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2인</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">콜키지</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">-</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">0원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">합계(2명)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\"></td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원(1인 129,000원)</td></tr></table><p><br></p><p>한우를 120g·150g으로 늘리면 1인 1만원씩 올라가요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">09 위치</span></b></p><p style=\"background:#F2F2F2;padding:14px;color:#888\">[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층] ← 여기서 네이버 에디터 [장소] 버튼으로 지도 넣기</p><p>여의도역 3번 출구에서 횡단보도 하나만 건너면 돼요. IFC몰·더현대 서울 바로 옆이에요.</p><p>방 개수가 정해져 있으니 주말 저녁은 꼭 예약하고 가세요.</p>","plain":"식사를 마치니 검은 접시에 \"Happy Anniversary\"가 적힌 디저트가 나왔어요.\n폴라로이드 사진까지 찍어서 그 자리에서 뽑아 주셨고요.\n음식도 음식이지만, 이 집을 다시 찾게 만드는 건 이런 마음 씀씀이예요.\n\n05 이건 알고 가세요\n· 기념일이면 예약할 때 꼭 미리 말하세요. 샴페인, 레터링, 폴라로이드까지 챙겨 주세요.\n· 술은 들고 가세요. 콜키지가 무료라 와인 한 병이면 술값을 크게 아껴요.\n· 큰 차는 주차장 입구가 걸릴 수 있어요. 지하철이 편해요.\n· 코스는 2인부터라 혼자는 어려워요.\n\n06 아쉬운 점\n가격이 가볍지는 않아요. 둘이 저녁 코스면 25만원이 넘어요.\n매일 갈 집은 아니고, \"오늘은 좀 잘 먹자\" 하는 날에 가는 집이에요.\n\n07 총평\n한 줄로 말하면 문 닫힌 방에서 대접받으며 한우 코스를 천천히 먹는 집이에요.\n기념일, 상견례, 부모님 생신처럼 자리가 중요한 날에 추천해요.\n재방문 ○. 다음엔 부모님 모시고 점심 코스부터 가 보려고요.\n\n08 오늘 쓴 돈(메뉴판 기준)\n메뉴\t수량\t금액\n저녁 B코스(한우 80g 기준)\t2인\t258,000원\n콜키지\t-\t0원\n합계(2명)\t\t258,000원(1인 129,000원)\n\n한우를 120g·150g으로 늘리면 1인 1만원씩 올라가요.\n\n09 위치\n[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층]\n여의도역 3번 출구에서 횡단보도 하나만 건너면 돼요. IFC몰·더현대 서울 바로 옆이에요.\n방 개수가 정해져 있으니 주말 저녁은 꼭 예약하고 가세요."},{"kind":"img","name":"post-footer.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/post-footer.png"},{"kind":"text","html":"<p>블루노.</p>","plain":"블루노."}];
const FULL="<p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/head-food.png\" style=\"max-width:100%\"></p><p>📍 서울 영등포구 국제금융로2길 36 지하1층</p><p>🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 바로</p><p>🍽 저녁 코스 1인 99,000원부터 / 점심 코스 39,000원부터 (코스는 2인부터)</p><p>🍷 콜키지 프리, 병 수 제한 없음</p><p>🅿 주차 가능(입구가 좁아 높이 2m 넘는 차는 어려움)</p><p>⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요</p><p><br></p><p>기념일 저녁, 어디서 먹을지 일주일을 고민했어요.</p><p>고깃집은 연기에 옆 테이블 소리에 정신이 없고,</p><p>호텔 레스토랑은 왠지 어깨에 힘이 들어가고.</p><p><br></p><p><span style=\"background-color:#fff8b2\"><b>\"조용히 둘이서, 맛있는 한우를, 천천히.\"</b></span></p><p>이 세 가지를 다 들어준 곳이 여의도역 바로 앞 우아라였어요.</p><p>결론부터 말하면, 방문을 닫는 순간부터 디저트 접시에 적힌 글씨를 볼 때까지 두 시간 동안 한 번도 휴대폰을 안 봤어요.</p><p>내 돈 내고 먹은 후기입니다.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">01 여의도역에서 3분, 찾기 쉬워요</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/02.jpg\" style=\"max-width:100%\"></p><p>여의도역 3번 출구로 나와 횡단보도 하나만 건너면 하얀 건물에 WOOARA 간판이 보여요.</p><p>IFC몰, 더현대 서울이 바로 옆이라 쇼핑하다 넘어오기 딱 좋은 거리예요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/03.jpg\" style=\"max-width:100%\"></p><p>차를 가져가신다면 이건 꼭 보고 가세요.</p><p><span style=\"background-color:#fff8b2\"><b>주차장 입구가 좁아서 높이 2m 넘는 차, 차체가 낮은 차는 못 들어갈 수 있어요.</b></span></p><p>코스에 술 한잔 곁들일 거라면 지하철이 속 편해요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/04.jpg\" style=\"max-width:100%\"></p><p>그리고 이 집의 숨은 장점. <span style=\"background-color:#fff8b2\"><b>콜키지 프리, 그것도 병 수 제한이 없어요.</b></span></p><p>집에 아껴 둔 와인, 선물 받은 위스키 한 병 들고 가면 그날 술값이 0원이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">02 문 하나 지나면 여의도 소음이 사라져요</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/05.jpg\" style=\"max-width:100%\"></p><p>지하 1층으로 내려가면 어두운 벽에 WOOARA 금색 글씨, 그 옆으로 파란 빛이 흐르는 유리 벽이 맞아 줘요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/06.jpg\" style=\"max-width:100%\"></p><p>예약을 확인하고 들어가는 복도가 동굴처럼 둥글게 감겨 있어요. 여기서부터 벌써 다른 데 온 기분이에요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/07.jpg\" style=\"max-width:100%\"></p><p>복도 양옆으로 격자무늬 문이 쭉 이어져요. 방이 20개쯤 있대요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/08.jpg\" style=\"max-width:100%\"></p><p><span style=\"background-color:#fff8b2\"><b>모든 자리가 문 닫히는 방이에요.</b></span></p><p>옆 테이블 웃음소리도, 직원 부르는 소리도 안 들려요.</p><p>목소리 낮춰서 얘기해도 다 들리니까, 오랜만에 얼굴 보고 대화를 했어요.</p><p>양가 부모님 처음 뵙는 상견례 자리로도 이만한 데가 없겠다 싶었어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/09.jpg\" style=\"max-width:100%\"></p><p>주방은 탁 트인 열린 주방이에요. 요리사분들이 바쁘게 움직이는 게 다 보이는데, 정돈이 잘 돼 있어서 오히려 믿음이 가요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">03 메뉴판, 미리 보고 가세요</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/11.jpg\" style=\"max-width:100%\"></p><p>저녁 코스는 한우 양(80g·120g·150g)에 따라 값이 나뉘어요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">저녁 코스</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">1인 가격</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">A코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">99,000원 / 109,000원 / 119,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">B코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">129,000원 / 139,000원 / 149,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">C코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">159,000원 / 169,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">시그니처</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">189,000원</td></tr></table><p><br></p><p>저녁이 부담되면 <span style=\"background-color:#fff8b2\"><b>점심 A코스 39,000원</b></span>으로 먼저 맛보는 것도 방법이에요.</p><p>저희는 저녁 B코스로 골랐어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">04 코스가 시작되면</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/15.jpg\" style=\"max-width:100%\"></p><p>예약할 때 \"기념일이에요\" 한마디 했을 뿐인데, 자리에 앉자마자 샴페인이 나왔어요.</p><p>직원분이 잔에 직접 따라 주시는데, 가는 기포가 끝도 없이 올라오는 걸 보고 둘이 동시에 웃었어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/18.jpg\" style=\"max-width:100%\"></p><p>그다음이 이 집의 첫 번째 쇼예요. 나무 상자를 열어 오늘 쓸 재료를 보여 주세요.</p><p>캐비어 통, 반짝이는 단호박과 토마토, 송이버섯, 계피 막대와 솔방울까지. 크리스마스를 앞두고 새로 꾸몄대요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/19.jpg\" style=\"max-width:100%\"></p><p>아래 칸을 열면 얼음 위에 오늘의 주인공 한우가 누워 있어요.</p><p><span style=\"background-color:#fff8b2\"><b>하얀 마블링이 촘촘히 박힌 붉은 고기.</b></span> 이걸 보고 나면 남은 코스가 다 기다려져요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">① 차완무시</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/21.jpg\" style=\"max-width:100%\"></p><p>뚜껑을 열면 노란 계란찜 위에 까만 캐비어, 주황빛 성게알, 훈연한 참송이가 얌전히 올라가 있어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/22.jpg\" style=\"max-width:100%\"></p><p>숟가락이 아무 힘 없이 쑥 들어가요. 한 입 떠먹으면 따뜻하고 매끈한 계란이 혀 위에서 녹고, 뒤따라 트러플 향이 코로 올라와요.</p><p>캐비어가 톡 터지면서 짭조름한 맛이 간을 딱 맞춰 줘요. 빈속을 살살 깨우는 첫 숟가락이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">② 숲속 정원 같은 한입 요리 네 가지</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/23.jpg\" style=\"max-width:100%\"></p><p>접시를 받는 순간 \"와\" 소리가 나요. 이끼를 깐 접시 위에 솔방울, 나무 가지, 석류알 그릇까지. 작은 숲을 통째로 옮겨 놓은 것 같아요.</p><p>오른쪽 위부터 시계 방향으로 먹으면 된다고 알려 주세요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/25.jpg\" style=\"max-width:100%\"></p><p>트러플 소스를 올린 한우 안심은 한 입에 쏙. 고기가 부드러워서 씹을 새도 없이 사라져요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/26.jpg\" style=\"max-width:100%\"></p><p>김 타르트 안에는 초밥, 관자, 멜론이 숨어 있어요. 바삭한 김 다음에 관자의 단맛, 마지막에 멜론의 시원한 단맛이 차례로 와요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/27.jpg\" style=\"max-width:100%\"></p><p>마지막은 새우와 랍스터를 말아 튀긴 스프링롤. 깨무는 순간 바삭 소리가 방 안에 울려요.</p><p>네 가지가 식감이 다 달라서, 다음 걸 집을 때마다 은근히 설레요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">③ 참치와 절인 알배추</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/28.jpg\" style=\"max-width:100%\"></p><p>맑은 유자간장 위에 빨갛고 노랗고 하얀 조각들이 보석처럼 놓여 있어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/29.jpg\" style=\"max-width:100%\"></p><p>참치 안에 절임무와 미나리가 들어 있어서 한 입에 부드러움과 아삭함이 같이 와요.</p><p>유자간장의 새콤함이 입안을 싹 씻어 줘서, 다음 요리를 맞을 준비가 돼요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">④ 단호박 수프</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/30.jpg\" style=\"max-width:100%\"></p><p>샛노란 단호박 수프 한가운데 구운 버섯이 올라가 있어요. 곶감과 다진 잣, 트러플 오일까지.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/31.jpg\" style=\"max-width:100%\"></p><p>떠먹으면 진한 단호박 단맛이 먼저 오고, 잣이 고소하게, 곶감이 쫀득하게 따라와요.</p><p>찬 바람 부는 날이면 이 한 그릇이 계속 생각날 것 같아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑤ 찐 전복</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/32.jpg\" style=\"max-width:100%\"></p><p>간장 소스에 잠긴 전복 위로 초록 실다시마가 동그랗게 말려 있어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/33.jpg\" style=\"max-width:100%\"></p><p>전복은 부드럽게 쪄져서 질기지 않고 쫄깃해요. 애호박찜, 무조림, 대파조림을 곁들여 소스에 찍어 먹으면 감칠맛이 입안에 오래 남아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑥ 볏짚 훈연 장어 주먹밥</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/34.jpg\" style=\"max-width:100%\"></p><p>청자빛 그릇 가운데, 볏짚에 훈연한 장어가 주먹밥 위에 올라가 있어요. 연근, 김, 방아잎 튀김이 왕관처럼 얹혀 있고요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/35.jpg\" style=\"max-width:100%\"></p><p>여기서 직원분이 주전자를 들고 와 따뜻한 육수를 천천히 부어 주세요. 김이 확 올라오면서 훈연 향이 방 안에 퍼져요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/36.jpg\" style=\"max-width:100%\"></p><p>주먹밥을 숟가락으로 살짝 풀면 육수에 밥알이 풀려요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/37.jpg\" style=\"max-width:100%\"></p><p>노릇하게 그을린 장어 한 점, 육수 머금은 밥 한 숟갈. 구수하고 따뜻해서 속이 편안해지는 맛이에요. 코스 중에 제일 \"밥 먹었다\" 싶은 순간이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑦ 들기름 돌문어 한우국수</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/38.jpg\" style=\"max-width:100%\"></p><p>작은 토기 그릇에 하얀 돌문어, 다진 한우, 참나물이 소복이 올라가 있어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/39.jpg\" style=\"max-width:100%\"></p><p>젓가락으로 휘휘 비벼서 들어 올리면 가는 면이 쭉. 유자·레몬 육수가 상큼하게 치고 들어오고, 끝에 들기름의 고소함이 남아요.</p><p>쫄깃한 문어와 고기가 면 사이사이에 씹혀서, 작은 그릇인데 아쉽게 금방 비워요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑧ 메인, 내 화로에서 굽는 한우와 미역국 반상</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/40.jpg\" style=\"max-width:100%\"></p><p>드디어 메인. 미역국에 흰쌀밥, 갓김치, 고사리나물, 씨앗젓갈까지 한 상이 차려져요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/41.jpg\" style=\"max-width:100%\"></p><p>한우는 육즙이 빠지지 않게 겉만 초벌해서 나와요. 단면의 붉은빛 좀 보세요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/42.jpg\" style=\"max-width:100%\"></p><p><span style=\"background-color:#fff8b2\"><b>그리고 내 앞에 놓인 작은 화로. 여기서 내가 원하는 만큼 구워 먹어요.</b></span></p><p>버섯, 대파, 새송이도 같이 올려요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/43.jpg\" style=\"max-width:100%\"></p><p>치익 소리 나게 겉만 살짝 익혀 한 점, 조금 더 익혀 한 점.</p><p>씹으면 육즙이 배어 나오고, 고소한 기름 맛이 혀에 남을 때 미역국 한 숟갈. 이게 한국 사람 입에 딱 맞는 마무리예요.</p><p>코스라 양이 적을까 걱정했는데, <span style=\"background-color:#fff8b2\"><b>밥과 국을 남길 만큼 배가 불렀어요.</b></span></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/44.jpg\" style=\"max-width:100%\"></p><p>마지막 고기 한 점에 샴페인 한 모금. 건배를 안 할 수가 없어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑨ 디저트, 그리고 접시 위의 글씨</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/45.jpg\" style=\"max-width:100%\"></p><p>식사를 마치니 검은 접시에 \"Happy Anniversary\"가 적힌 디저트가 나왔어요.</p><p>폴라로이드 사진까지 찍어서 그 자리에서 뽑아 주셨고요.</p><p>음식도 음식이지만, 이 집을 다시 찾게 만드는 건 이런 마음 씀씀이예요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">05 이건 알고 가세요</span></b></p><p>· 기념일이면 <span style=\"background-color:#fff8b2\"><b>예약할 때 꼭 미리 말하세요.</b></span> 샴페인, 레터링, 폴라로이드까지 챙겨 주세요.</p><p>· 술은 들고 가세요. 콜키지가 무료라 와인 한 병이면 술값을 크게 아껴요.</p><p>· 큰 차는 주차장 입구가 걸릴 수 있어요. 지하철이 편해요.</p><p>· 코스는 2인부터라 혼자는 어려워요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">06 아쉬운 점</span></b></p><p>가격이 가볍지는 않아요. 둘이 저녁 코스면 25만원이 넘어요.</p><p>매일 갈 집은 아니고, \"오늘은 좀 잘 먹자\" 하는 날에 가는 집이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">07 총평</span></b></p><p>한 줄로 말하면 <span style=\"background-color:#fff8b2\"><b>문 닫힌 방에서 대접받으며 한우 코스를 천천히 먹는 집</b></span>이에요.</p><p>기념일, 상견례, 부모님 생신처럼 자리가 중요한 날에 추천해요.</p><p>재방문 ○. 다음엔 부모님 모시고 점심 코스부터 가 보려고요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">08 오늘 쓴 돈(메뉴판 기준)</span></b></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">메뉴</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">수량</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">금액</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">저녁 B코스(한우 80g 기준)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2인</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">콜키지</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">-</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">0원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">합계(2명)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\"></td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원(1인 129,000원)</td></tr></table><p><br></p><p>한우를 120g·150g으로 늘리면 1인 1만원씩 올라가요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">09 위치</span></b></p><p style=\"background:#F2F2F2;padding:14px;color:#888\">[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층] ← 여기서 네이버 에디터 [장소] 버튼으로 지도 넣기</p><p>여의도역 3번 출구에서 횡단보도 하나만 건너면 돼요. IFC몰·더현대 서울 바로 옆이에요.</p><p>방 개수가 정해져 있으니 주말 저녁은 꼭 예약하고 가세요.</p><p style=\"text-align:center\"><a href=\"https://www.youtube.com/@bluno-economy\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/post-footer.png\" style=\"max-width:100%\"></a></p><p>블루노.</p><p><br></p><p>#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #여의도데이트 #내돈내산 #블루노</p>", FULLPLAIN="\n\n📍 서울 영등포구 국제금융로2길 36 지하1층\n🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 바로\n🍽 저녁 코스 1인 99,000원부터 / 점심 코스 39,000원부터 (코스는 2인부터)\n🍷 콜키지 프리, 병 수 제한 없음\n🅿 주차 가능(입구가 좁아 높이 2m 넘는 차는 어려움)\n⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요\n\n기념일 저녁, 어디서 먹을지 일주일을 고민했어요.\n고깃집은 연기에 옆 테이블 소리에 정신이 없고,\n호텔 레스토랑은 왠지 어깨에 힘이 들어가고.\n\n\"조용히 둘이서, 맛있는 한우를, 천천히.\"\n이 세 가지를 다 들어준 곳이 여의도역 바로 앞 우아라였어요.\n결론부터 말하면, 방문을 닫는 순간부터 디저트 접시에 적힌 글씨를 볼 때까지 두 시간 동안 한 번도 휴대폰을 안 봤어요.\n내 돈 내고 먹은 후기입니다.\n\n01 여의도역에서 3분, 찾기 쉬워요\n\n\n\n여의도역 3번 출구로 나와 횡단보도 하나만 건너면 하얀 건물에 WOOARA 간판이 보여요.\nIFC몰, 더현대 서울이 바로 옆이라 쇼핑하다 넘어오기 딱 좋은 거리예요.\n\n\n\n차를 가져가신다면 이건 꼭 보고 가세요.\n주차장 입구가 좁아서 높이 2m 넘는 차, 차체가 낮은 차는 못 들어갈 수 있어요.\n코스에 술 한잔 곁들일 거라면 지하철이 속 편해요.\n\n\n\n그리고 이 집의 숨은 장점. 콜키지 프리, 그것도 병 수 제한이 없어요.\n집에 아껴 둔 와인, 선물 받은 위스키 한 병 들고 가면 그날 술값이 0원이에요.\n\n02 문 하나 지나면 여의도 소음이 사라져요\n\n\n\n지하 1층으로 내려가면 어두운 벽에 WOOARA 금색 글씨, 그 옆으로 파란 빛이 흐르는 유리 벽이 맞아 줘요.\n\n\n\n예약을 확인하고 들어가는 복도가 동굴처럼 둥글게 감겨 있어요. 여기서부터 벌써 다른 데 온 기분이에요.\n\n\n\n복도 양옆으로 격자무늬 문이 쭉 이어져요. 방이 20개쯤 있대요.\n\n\n\n모든 자리가 문 닫히는 방이에요.\n옆 테이블 웃음소리도, 직원 부르는 소리도 안 들려요.\n목소리 낮춰서 얘기해도 다 들리니까, 오랜만에 얼굴 보고 대화를 했어요.\n양가 부모님 처음 뵙는 상견례 자리로도 이만한 데가 없겠다 싶었어요.\n\n\n\n주방은 탁 트인 열린 주방이에요. 요리사분들이 바쁘게 움직이는 게 다 보이는데, 정돈이 잘 돼 있어서 오히려 믿음이 가요.\n\n03 메뉴판, 미리 보고 가세요\n\n\n\n저녁 코스는 한우 양(80g·120g·150g)에 따라 값이 나뉘어요.\n\n저녁 코스\t1인 가격\nA코스\t99,000원 / 109,000원 / 119,000원\nB코스\t129,000원 / 139,000원 / 149,000원\nC코스\t159,000원 / 169,000원\n시그니처\t189,000원\n\n저녁이 부담되면 점심 A코스 39,000원으로 먼저 맛보는 것도 방법이에요.\n저희는 저녁 B코스로 골랐어요.\n\n04 코스가 시작되면\n\n\n\n예약할 때 \"기념일이에요\" 한마디 했을 뿐인데, 자리에 앉자마자 샴페인이 나왔어요.\n직원분이 잔에 직접 따라 주시는데, 가는 기포가 끝도 없이 올라오는 걸 보고 둘이 동시에 웃었어요.\n\n\n\n그다음이 이 집의 첫 번째 쇼예요. 나무 상자를 열어 오늘 쓸 재료를 보여 주세요.\n캐비어 통, 반짝이는 단호박과 토마토, 송이버섯, 계피 막대와 솔방울까지. 크리스마스를 앞두고 새로 꾸몄대요.\n\n\n\n아래 칸을 열면 얼음 위에 오늘의 주인공 한우가 누워 있어요.\n하얀 마블링이 촘촘히 박힌 붉은 고기. 이걸 보고 나면 남은 코스가 다 기다려져요.\n\n① 차완무시\n\n\n\n뚜껑을 열면 노란 계란찜 위에 까만 캐비어, 주황빛 성게알, 훈연한 참송이가 얌전히 올라가 있어요.\n\n\n\n숟가락이 아무 힘 없이 쑥 들어가요. 한 입 떠먹으면 따뜻하고 매끈한 계란이 혀 위에서 녹고, 뒤따라 트러플 향이 코로 올라와요.\n캐비어가 톡 터지면서 짭조름한 맛이 간을 딱 맞춰 줘요. 빈속을 살살 깨우는 첫 숟가락이에요.\n\n② 숲속 정원 같은 한입 요리 네 가지\n\n\n\n접시를 받는 순간 \"와\" 소리가 나요. 이끼를 깐 접시 위에 솔방울, 나무 가지, 석류알 그릇까지. 작은 숲을 통째로 옮겨 놓은 것 같아요.\n오른쪽 위부터 시계 방향으로 먹으면 된다고 알려 주세요.\n\n\n\n트러플 소스를 올린 한우 안심은 한 입에 쏙. 고기가 부드러워서 씹을 새도 없이 사라져요.\n\n\n\n김 타르트 안에는 초밥, 관자, 멜론이 숨어 있어요. 바삭한 김 다음에 관자의 단맛, 마지막에 멜론의 시원한 단맛이 차례로 와요.\n\n\n\n마지막은 새우와 랍스터를 말아 튀긴 스프링롤. 깨무는 순간 바삭 소리가 방 안에 울려요.\n네 가지가 식감이 다 달라서, 다음 걸 집을 때마다 은근히 설레요.\n\n③ 참치와 절인 알배추\n\n\n\n맑은 유자간장 위에 빨갛고 노랗고 하얀 조각들이 보석처럼 놓여 있어요.\n\n\n\n참치 안에 절임무와 미나리가 들어 있어서 한 입에 부드러움과 아삭함이 같이 와요.\n유자간장의 새콤함이 입안을 싹 씻어 줘서, 다음 요리를 맞을 준비가 돼요.\n\n④ 단호박 수프\n\n\n\n샛노란 단호박 수프 한가운데 구운 버섯이 올라가 있어요. 곶감과 다진 잣, 트러플 오일까지.\n\n\n\n떠먹으면 진한 단호박 단맛이 먼저 오고, 잣이 고소하게, 곶감이 쫀득하게 따라와요.\n찬 바람 부는 날이면 이 한 그릇이 계속 생각날 것 같아요.\n\n⑤ 찐 전복\n\n\n\n간장 소스에 잠긴 전복 위로 초록 실다시마가 동그랗게 말려 있어요.\n\n\n\n전복은 부드럽게 쪄져서 질기지 않고 쫄깃해요. 애호박찜, 무조림, 대파조림을 곁들여 소스에 찍어 먹으면 감칠맛이 입안에 오래 남아요.\n\n⑥ 볏짚 훈연 장어 주먹밥\n\n\n\n청자빛 그릇 가운데, 볏짚에 훈연한 장어가 주먹밥 위에 올라가 있어요. 연근, 김, 방아잎 튀김이 왕관처럼 얹혀 있고요.\n\n\n\n여기서 직원분이 주전자를 들고 와 따뜻한 육수를 천천히 부어 주세요. 김이 확 올라오면서 훈연 향이 방 안에 퍼져요.\n\n\n\n주먹밥을 숟가락으로 살짝 풀면 육수에 밥알이 풀려요.\n\n\n\n노릇하게 그을린 장어 한 점, 육수 머금은 밥 한 숟갈. 구수하고 따뜻해서 속이 편안해지는 맛이에요. 코스 중에 제일 \"밥 먹었다\" 싶은 순간이에요.\n\n⑦ 들기름 돌문어 한우국수\n\n\n\n작은 토기 그릇에 하얀 돌문어, 다진 한우, 참나물이 소복이 올라가 있어요.\n\n\n\n젓가락으로 휘휘 비벼서 들어 올리면 가는 면이 쭉. 유자·레몬 육수가 상큼하게 치고 들어오고, 끝에 들기름의 고소함이 남아요.\n쫄깃한 문어와 고기가 면 사이사이에 씹혀서, 작은 그릇인데 아쉽게 금방 비워요.\n\n⑧ 메인, 내 화로에서 굽는 한우와 미역국 반상\n\n\n\n드디어 메인. 미역국에 흰쌀밥, 갓김치, 고사리나물, 씨앗젓갈까지 한 상이 차려져요.\n\n\n\n한우는 육즙이 빠지지 않게 겉만 초벌해서 나와요. 단면의 붉은빛 좀 보세요.\n\n\n\n그리고 내 앞에 놓인 작은 화로. 여기서 내가 원하는 만큼 구워 먹어요.\n버섯, 대파, 새송이도 같이 올려요.\n\n\n\n치익 소리 나게 겉만 살짝 익혀 한 점, 조금 더 익혀 한 점.\n씹으면 육즙이 배어 나오고, 고소한 기름 맛이 혀에 남을 때 미역국 한 숟갈. 이게 한국 사람 입에 딱 맞는 마무리예요.\n코스라 양이 적을까 걱정했는데, 밥과 국을 남길 만큼 배가 불렀어요.\n\n\n\n마지막 고기 한 점에 샴페인 한 모금. 건배를 안 할 수가 없어요.\n\n⑨ 디저트, 그리고 접시 위의 글씨\n\n\n\n식사를 마치니 검은 접시에 \"Happy Anniversary\"가 적힌 디저트가 나왔어요.\n폴라로이드 사진까지 찍어서 그 자리에서 뽑아 주셨고요.\n음식도 음식이지만, 이 집을 다시 찾게 만드는 건 이런 마음 씀씀이예요.\n\n05 이건 알고 가세요\n· 기념일이면 예약할 때 꼭 미리 말하세요. 샴페인, 레터링, 폴라로이드까지 챙겨 주세요.\n· 술은 들고 가세요. 콜키지가 무료라 와인 한 병이면 술값을 크게 아껴요.\n· 큰 차는 주차장 입구가 걸릴 수 있어요. 지하철이 편해요.\n· 코스는 2인부터라 혼자는 어려워요.\n\n06 아쉬운 점\n가격이 가볍지는 않아요. 둘이 저녁 코스면 25만원이 넘어요.\n매일 갈 집은 아니고, \"오늘은 좀 잘 먹자\" 하는 날에 가는 집이에요.\n\n07 총평\n한 줄로 말하면 문 닫힌 방에서 대접받으며 한우 코스를 천천히 먹는 집이에요.\n기념일, 상견례, 부모님 생신처럼 자리가 중요한 날에 추천해요.\n재방문 ○. 다음엔 부모님 모시고 점심 코스부터 가 보려고요.\n\n08 오늘 쓴 돈(메뉴판 기준)\n메뉴\t수량\t금액\n저녁 B코스(한우 80g 기준)\t2인\t258,000원\n콜키지\t-\t0원\n합계(2명)\t\t258,000원(1인 129,000원)\n\n한우를 120g·150g으로 늘리면 1인 1만원씩 올라가요.\n\n09 위치\n[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층]\n여의도역 3번 출구에서 횡단보도 하나만 건너면 돼요. IFC몰·더현대 서울 바로 옆이에요.\n방 개수가 정해져 있으니 주말 저녁은 꼭 예약하고 가세요.\n\n\n\n블루노.\n\n#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #여의도데이트 #내돈내산 #블루노";
const TITLE="[여의도역 맛집] 우아라 여의도점 - 방문 닫으면 둘만의 식당, 내 화로에 한우 구워 먹는 오마카세", TAGS="#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #여의도데이트 #내돈내산 #블루노";
let i=0;
const list=document.getElementById('list');
P.forEach((p,k)=>{const d=document.createElement('div');d.className='p';d.id='p'+k;
 d.innerHTML='<span class="n">'+(k+1)+'</span><button class="copy">이것만 복사</button>'+(p.kind==='img'?'<img src="'+p.data+'">':p.html);
 d.querySelector('.copy').onclick=()=>copy(k,false);list.appendChild(d);});
async function copy(k,adv=true){const p=P[k];
 try{ if(p.kind==='img'){const b=await (await fetch(p.data)).blob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);}
 else{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([p.html],{type:'text/html'}),'text/plain':new Blob([p.plain],{type:'text/plain'})})]);}
 document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur'));
 const el=document.getElementById('p'+k);el.classList.add('cur','done');el.scrollIntoView({block:'center',behavior:'smooth'});
 if(adv) i=k+1; show((p.kind==='img'?'이미지':'글')+' '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');
