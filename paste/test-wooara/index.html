<script>
const P=[{"kind":"img","name":"head-food.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/head-food.png"},{"kind":"text","html":"<p>📍 서울 영등포구 국제금융로2길 36 지하1층</p><p>🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 바로</p><p>🅿 주차 가능(입구가 좁아 높이 2m 넘는 차, 차체 낮은 차는 어려울 수 있음)</p><p>🍷 콜키지 프리(병 수 제한 없음)</p><p>🍽 코스는 2인부터 주문</p><p>⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요</p><p><br></p><p>기념일이라 오랜만에 조용한 데서 제대로 한 끼 먹고 싶었어요.</p><p>시끄러운 고깃집 말고, 둘이서 얘기 나누면서 천천히 먹을 수 있는 곳.</p><p>그래서 고른 곳이 여의도역 바로 앞 한우 오마카세 집, 우아라예요.</p><p>내 돈 내고 먹은 솔직한 후기입니다.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">01 찾아가는 길</span></b></p>","plain":"📍 서울 영등포구 국제금융로2길 36 지하1층\n🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 바로\n🅿 주차 가능(입구가 좁아 높이 2m 넘는 차, 차체 낮은 차는 어려울 수 있음)\n🍷 콜키지 프리(병 수 제한 없음)\n🍽 코스는 2인부터 주문\n⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요\n\n기념일이라 오랜만에 조용한 데서 제대로 한 끼 먹고 싶었어요.\n시끄러운 고깃집 말고, 둘이서 얘기 나누면서 천천히 먹을 수 있는 곳.\n그래서 고른 곳이 여의도역 바로 앞 한우 오마카세 집, 우아라예요.\n내 돈 내고 먹은 솔직한 후기입니다.\n\n01 찾아가는 길"},{"kind":"img","name":"02.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/02.jpg"},{"kind":"text","html":"<p>여의도역 3번 출구로 나와 횡단보도 하나만 건너면 이 건물이에요.</p><p>IFC몰, 더현대 서울이 코앞이라 쇼핑하고 들르기에도 좋은 자리예요.</p>","plain":"여의도역 3번 출구로 나와 횡단보도 하나만 건너면 이 건물이에요.\nIFC몰, 더현대 서울이 코앞이라 쇼핑하고 들르기에도 좋은 자리예요."},{"kind":"img","name":"03.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/03.jpg"},{"kind":"text","html":"<p>차를 가져가신다면 주차장 입구를 꼭 보세요.</p><p><span style=\"background-color:#fff8b2\"><b>입구가 좁아서 높이 2m 넘는 차나 차체가 낮은 차는 못 들어갈 수 있어요.</b></span></p>","plain":"차를 가져가신다면 주차장 입구를 꼭 보세요.\n입구가 좁아서 높이 2m 넘는 차나 차체가 낮은 차는 못 들어갈 수 있어요."},{"kind":"img","name":"04.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/04.jpg"},{"kind":"text","html":"<p>그리고 하나 더. 여기는 <span style=\"background-color:#fff8b2\"><b>콜키지 프리, 그것도 병 수 제한이 없어요.</b></span></p><p>아껴 둔 와인이나 위스키 한 병 들고 가면 한우랑 짝 맞추기 좋아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">02 입구와 분위기</span></b></p>","plain":"그리고 하나 더. 여기는 콜키지 프리, 그것도 병 수 제한이 없어요.\n아껴 둔 와인이나 위스키 한 병 들고 가면 한우랑 짝 맞추기 좋아요.\n\n02 입구와 분위기"},{"kind":"img","name":"05.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/05.jpg"},{"kind":"text","html":"<p>건물 지하 1층으로 내려가면 바로 간판이 보여요.</p>","plain":"건물 지하 1층으로 내려가면 바로 간판이 보여요."},{"kind":"img","name":"06.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/06.jpg"},{"kind":"text","html":"<p>입구에서 예약을 확인하고 직원분 안내를 따라 들어갔어요.</p>","plain":"입구에서 예약을 확인하고 직원분 안내를 따라 들어갔어요."},{"kind":"img","name":"07.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/07.jpg"},{"kind":"text","html":"<p>복도 양쪽으로 방이 쭉 있어요. 방이 20개 정도래요.</p>","plain":"복도 양쪽으로 방이 쭉 있어요. 방이 20개 정도래요."},{"kind":"img","name":"08.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/08.jpg"},{"kind":"text","html":"<p><span style=\"background-color:#fff8b2\"><b>모든 자리가 따로 떨어진 방이에요.</b></span></p><p>옆 테이블 소리가 안 들리니 목소리 높일 일이 없고, 사진 찍기도 편해요.</p><p>양가 어른 모시는 상견례나 회사 손님 모시는 자리로도 괜찮겠다 싶었어요.</p>","plain":"모든 자리가 따로 떨어진 방이에요.\n옆 테이블 소리가 안 들리니 목소리 높일 일이 없고, 사진 찍기도 편해요.\n양가 어른 모시는 상견례나 회사 손님 모시는 자리로도 괜찮겠다 싶었어요."},{"kind":"img","name":"09.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/09.jpg"},{"kind":"text","html":"<p>주방은 열린 주방이라 음식 만드는 모습이 보여요. 깔끔해서 믿음이 갔어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">03 메뉴와 가격</span></b></p>","plain":"주방은 열린 주방이라 음식 만드는 모습이 보여요. 깔끔해서 믿음이 갔어요.\n\n03 메뉴와 가격"},{"kind":"img","name":"11.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/11.jpg"},{"kind":"text","html":"<p>저녁 코스 메뉴판이에요. 한우 양(80g·120g·150g)에 따라 값이 달라요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">저녁 코스</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">1인 가격</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">A코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">99,000원 / 109,000원 / 119,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">B코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">129,000원 / 139,000원 / 149,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">C코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">159,000원 / 169,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">시그니처</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">189,000원</td></tr></table><p><br></p><p>점심 코스는 39,000원부터 있어서 부담 없이 한 번 맛보기에도 좋아요.</p><p>저희는 저녁 B코스로 했어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">04 코스 하나씩</span></b></p>","plain":"저녁 코스 메뉴판이에요. 한우 양(80g·120g·150g)에 따라 값이 달라요.\n\n저녁 코스\t1인 가격\nA코스\t99,000원 / 109,000원 / 119,000원\nB코스\t129,000원 / 139,000원 / 149,000원\nC코스\t159,000원 / 169,000원\n시그니처\t189,000원\n\n점심 코스는 39,000원부터 있어서 부담 없이 한 번 맛보기에도 좋아요.\n저희는 저녁 B코스로 했어요.\n\n04 코스 하나씩"},{"kind":"img","name":"15.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/15.jpg"},{"kind":"text","html":"<p>예약할 때 기념일이라고 말해 뒀더니 샴페인을 준비해 주셨어요.</p><p>직원분이 자리에서 잔에 직접 따라 주시니 시작부터 기분이 났어요.</p>","plain":"예약할 때 기념일이라고 말해 뒀더니 샴페인을 준비해 주셨어요.\n직원분이 자리에서 잔에 직접 따라 주시니 시작부터 기분이 났어요."},{"kind":"img","name":"18.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/18.jpg"},{"kind":"text","html":"<p>코스 시작 전에 오늘 쓸 재료를 상자째 보여 주세요.</p><p>캐비어, 트러플, 랍스터, 제철 채소까지.</p>","plain":"코스 시작 전에 오늘 쓸 재료를 상자째 보여 주세요.\n캐비어, 트러플, 랍스터, 제철 채소까지."},{"kind":"img","name":"19.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/19.jpg"},{"kind":"text","html":"<p>그리고 오늘의 주인공 한우. 이걸 보고 나니 기대가 확 올라가더라고요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">① 차완무시(일본식 계란찜)</span></b></p>","plain":"그리고 오늘의 주인공 한우. 이걸 보고 나니 기대가 확 올라가더라고요.\n\n① 차완무시(일본식 계란찜)"},{"kind":"img","name":"21.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/21.jpg"},{"kind":"text","html":"<p>훈연한 참송이, 성게알, 캐비어가 올라가 있어요.</p><p>숟가락을 넣으면 푸딩처럼 부드럽게 떠지고, 따뜻한 계란찜 위로 트러플 향이 은은하게 올라와요.</p><p>빈속을 살살 데워 주는 첫 숟가락이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">② 한입 요리 네 가지</span></b></p>","plain":"훈연한 참송이, 성게알, 캐비어가 올라가 있어요.\n숟가락을 넣으면 푸딩처럼 부드럽게 떠지고, 따뜻한 계란찜 위로 트러플 향이 은은하게 올라와요.\n빈속을 살살 데워 주는 첫 숟가락이에요.\n\n② 한입 요리 네 가지"},{"kind":"img","name":"23.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/23.jpg"},{"kind":"text","html":"<p>오른쪽 위부터 시계 방향으로 먹으면 된다고 알려 주셨어요.</p>","plain":"오른쪽 위부터 시계 방향으로 먹으면 된다고 알려 주셨어요."},{"kind":"img","name":"25.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/25.jpg"},{"kind":"text","html":"<p>김 타르트 안에는 초밥, 관자, 멜론이 들었고, 트러플 소스 올린 한우 안심도 한 점.</p>","plain":"김 타르트 안에는 초밥, 관자, 멜론이 들었고, 트러플 소스 올린 한우 안심도 한 점."},{"kind":"img","name":"27.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/27.jpg"},{"kind":"text","html":"<p>마지막은 새우와 랍스터를 넣은 스프링롤. 씹는 순간 바삭 소리가 나요.</p><p>네 가지가 식감이 다 달라서 하나씩 집어 먹는 재미가 있어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">③ 참치와 절인 알배추</span></b></p>","plain":"마지막은 새우와 랍스터를 넣은 스프링롤. 씹는 순간 바삭 소리가 나요.\n네 가지가 식감이 다 달라서 하나씩 집어 먹는 재미가 있어요.\n\n③ 참치와 절인 알배추"},{"kind":"img","name":"28.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/28.jpg"},{"kind":"text","html":"<p>참치 안에 절임무와 미나리가 들었어요.</p><p>유자간장을 찍어 먹으니 새콤하게 입안이 싹 정리돼요. 다음 요리 먹기 전에 딱 좋은 순서예요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">④ 단호박 수프</span></b></p>","plain":"참치 안에 절임무와 미나리가 들었어요.\n유자간장을 찍어 먹으니 새콤하게 입안이 싹 정리돼요. 다음 요리 먹기 전에 딱 좋은 순서예요.\n\n④ 단호박 수프"},{"kind":"img","name":"30.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/30.jpg"},{"kind":"text","html":"<p>구운 버섯, 곶감, 다진 잣에 트러플 오일까지.</p><p>떠먹으면 단호박 단맛이 먼저 오고, 잣이 고소하게 따라와요. 찬 바람 부는 날 생각날 맛이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑤ 찐 전복</span></b></p>","plain":"구운 버섯, 곶감, 다진 잣에 트러플 오일까지.\n떠먹으면 단호박 단맛이 먼저 오고, 잣이 고소하게 따라와요. 찬 바람 부는 날 생각날 맛이에요.\n\n⑤ 찐 전복"},{"kind":"img","name":"32.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/32.jpg"},{"kind":"text","html":"<p>애호박찜, 무조림, 대파조림에 실다시마를 곁들였어요.</p><p>간장 소스에 찍으니 전복이 쫄깃하고 감칠맛이 길게 남아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑥ 장어 주먹밥</span></b></p>","plain":"애호박찜, 무조림, 대파조림에 실다시마를 곁들였어요.\n간장 소스에 찍으니 전복이 쫄깃하고 감칠맛이 길게 남아요.\n\n⑥ 장어 주먹밥"},{"kind":"img","name":"34.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/34.jpg"},{"kind":"text","html":"<p>볏짚에 훈연한 장어를 시오콘부 주먹밥 위에 올렸어요.</p>","plain":"볏짚에 훈연한 장어를 시오콘부 주먹밥 위에 올렸어요."},{"kind":"img","name":"35.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/35.jpg"},{"kind":"text","html":"<p>직원분이 따뜻한 육수를 부어 주세요.</p><p>주먹밥을 살짝 풀어 장어랑 같이 떠먹으면 오차즈케처럼 술술 넘어가요. 훈연 향이 육수에 배어서 구수해요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑦ 들기름 돌문어 한우국수</span></b></p>","plain":"직원분이 따뜻한 육수를 부어 주세요.\n주먹밥을 살짝 풀어 장어랑 같이 떠먹으면 오차즈케처럼 술술 넘어가요. 훈연 향이 육수에 배어서 구수해요.\n\n⑦ 들기름 돌문어 한우국수"},{"kind":"img","name":"38.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/38.jpg"},{"kind":"text","html":"<p>얇은 카펠리니 면 위에 다진 한우, 참나물, 돌문어.</p>","plain":"얇은 카펠리니 면 위에 다진 한우, 참나물, 돌문어."},{"kind":"img","name":"39.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/39.jpg"},{"kind":"text","html":"<p>유자·레몬 육수랑 비벼 먹으니 상큼한데 들기름 덕에 끝맛은 고소해요. 코스 중간에 입맛 다시 살려 주는 한 그릇이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑧ 메인, 한우구이와 미역국 반상</span></b></p>","plain":"유자·레몬 육수랑 비벼 먹으니 상큼한데 들기름 덕에 끝맛은 고소해요. 코스 중간에 입맛 다시 살려 주는 한 그릇이에요.\n\n⑧ 메인, 한우구이와 미역국 반상"},{"kind":"img","name":"40.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/40.jpg"},{"kind":"text","html":"<p>드디어 메인이에요. 갓김치, 고사리나물, 씨앗젓갈까지 한 상이 차려져요.</p>","plain":"드디어 메인이에요. 갓김치, 고사리나물, 씨앗젓갈까지 한 상이 차려져요."},{"kind":"img","name":"41.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/41.jpg"},{"kind":"text","html":"<p>한우는 육즙이 빠지지 않게 초벌해서 나와요.</p>","plain":"한우는 육즙이 빠지지 않게 초벌해서 나와요."},{"kind":"img","name":"42.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/42.jpg"},{"kind":"text","html":"<p><span style=\"background-color:#fff8b2\"><b>내 앞 화로에서 내가 원하는 만큼 구워 먹어요.</b></span></p>","plain":"내 앞 화로에서 내가 원하는 만큼 구워 먹어요."},{"kind":"img","name":"43.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/43.jpg"},{"kind":"text","html":"<p>겉만 살짝 익혀 한 점, 조금 더 익혀 한 점. 서두를 필요 없이 내 속도로 먹을 수 있어서 좋았어요.</p><p>코스라 양이 적을까 걱정했는데, <span style=\"background-color:#fff8b2\"><b>밥과 국을 남길 만큼 배불렀어요.</b></span></p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑨ 디저트</span></b></p>","plain":"겉만 살짝 익혀 한 점, 조금 더 익혀 한 점. 서두를 필요 없이 내 속도로 먹을 수 있어서 좋았어요.\n코스라 양이 적을까 걱정했는데, 밥과 국을 남길 만큼 배불렀어요.\n\n⑨ 디저트"},{"kind":"img","name":"45.jpg","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/45.jpg"},{"kind":"text","html":"<p>기념일이라고 말해 뒀더니 접시에 레터링까지 해 주셨어요.</p><p>폴라로이드 사진도 찍어서 바로 뽑아 주셨고요. 음식만큼 이 마음이 오래 남아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">05 아쉬운 점</span></b></p><p>가격이 가볍지는 않아요. 둘이 저녁 코스면 25만원이 넘어요.</p><p>그리고 차를 가져가면 주차장 입구가 좁은 게 걸려요. 큰 차라면 지하철이 마음 편해요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">06 총평</span></b></p><p>한 줄로 말하면 \"조용한 방에서 한우 코스를 천천히, 대접받으며 먹는 집\"이에요.</p><p>기념일, 상견례, 부모님 모시는 날처럼 자리가 중요한 날에 추천해요.</p><p>재방문 ○. 다음엔 부모님 모시고 다시 오려고요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">07 오늘 쓴 돈(메뉴판 기준)</span></b></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">메뉴</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">수량</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">금액</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">저녁 B코스(한우 80g 기준)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2인</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">콜키지</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">-</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">0원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">합계(2명)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\"></td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원부터(1인 129,000원)</td></tr></table><p><br></p><p>한우 양을 120g·150g으로 고르면 1인 1만원씩 올라가요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">08 위치</span></b></p><p style=\"background:#F2F2F2;padding:14px;color:#888\">[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층] ← 여기서 네이버 에디터 [장소] 버튼으로 지도 넣기</p><p>여의도역 3번 출구에서 횡단보도 하나만 건너면 돼요. IFC몰·더현대 서울 바로 옆이에요.</p><p>코스는 2인부터라 예약하고 가시는 게 좋아요.</p>","plain":"기념일이라고 말해 뒀더니 접시에 레터링까지 해 주셨어요.\n폴라로이드 사진도 찍어서 바로 뽑아 주셨고요. 음식만큼 이 마음이 오래 남아요.\n\n05 아쉬운 점\n가격이 가볍지는 않아요. 둘이 저녁 코스면 25만원이 넘어요.\n그리고 차를 가져가면 주차장 입구가 좁은 게 걸려요. 큰 차라면 지하철이 마음 편해요.\n\n06 총평\n한 줄로 말하면 \"조용한 방에서 한우 코스를 천천히, 대접받으며 먹는 집\"이에요.\n기념일, 상견례, 부모님 모시는 날처럼 자리가 중요한 날에 추천해요.\n재방문 ○. 다음엔 부모님 모시고 다시 오려고요.\n\n07 오늘 쓴 돈(메뉴판 기준)\n메뉴\t수량\t금액\n저녁 B코스(한우 80g 기준)\t2인\t258,000원\n콜키지\t-\t0원\n합계(2명)\t\t258,000원부터(1인 129,000원)\n\n한우 양을 120g·150g으로 고르면 1인 1만원씩 올라가요.\n\n08 위치\n[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층]\n여의도역 3번 출구에서 횡단보도 하나만 건너면 돼요. IFC몰·더현대 서울 바로 옆이에요.\n코스는 2인부터라 예약하고 가시는 게 좋아요."},{"kind":"img","name":"post-footer.png","data":"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/post-footer.png"},{"kind":"text","html":"<p>블루노.</p>","plain":"블루노."}];
const FULL="<p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/head-food.png\" style=\"max-width:100%\"></p><p>📍 서울 영등포구 국제금융로2길 36 지하1층</p><p>🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 바로</p><p>🅿 주차 가능(입구가 좁아 높이 2m 넘는 차, 차체 낮은 차는 어려울 수 있음)</p><p>🍷 콜키지 프리(병 수 제한 없음)</p><p>🍽 코스는 2인부터 주문</p><p>⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요</p><p><br></p><p>기념일이라 오랜만에 조용한 데서 제대로 한 끼 먹고 싶었어요.</p><p>시끄러운 고깃집 말고, 둘이서 얘기 나누면서 천천히 먹을 수 있는 곳.</p><p>그래서 고른 곳이 여의도역 바로 앞 한우 오마카세 집, 우아라예요.</p><p>내 돈 내고 먹은 솔직한 후기입니다.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">01 찾아가는 길</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/02.jpg\" style=\"max-width:100%\"></p><p>여의도역 3번 출구로 나와 횡단보도 하나만 건너면 이 건물이에요.</p><p>IFC몰, 더현대 서울이 코앞이라 쇼핑하고 들르기에도 좋은 자리예요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/03.jpg\" style=\"max-width:100%\"></p><p>차를 가져가신다면 주차장 입구를 꼭 보세요.</p><p><span style=\"background-color:#fff8b2\"><b>입구가 좁아서 높이 2m 넘는 차나 차체가 낮은 차는 못 들어갈 수 있어요.</b></span></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/04.jpg\" style=\"max-width:100%\"></p><p>그리고 하나 더. 여기는 <span style=\"background-color:#fff8b2\"><b>콜키지 프리, 그것도 병 수 제한이 없어요.</b></span></p><p>아껴 둔 와인이나 위스키 한 병 들고 가면 한우랑 짝 맞추기 좋아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">02 입구와 분위기</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/05.jpg\" style=\"max-width:100%\"></p><p>건물 지하 1층으로 내려가면 바로 간판이 보여요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/06.jpg\" style=\"max-width:100%\"></p><p>입구에서 예약을 확인하고 직원분 안내를 따라 들어갔어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/07.jpg\" style=\"max-width:100%\"></p><p>복도 양쪽으로 방이 쭉 있어요. 방이 20개 정도래요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/08.jpg\" style=\"max-width:100%\"></p><p><span style=\"background-color:#fff8b2\"><b>모든 자리가 따로 떨어진 방이에요.</b></span></p><p>옆 테이블 소리가 안 들리니 목소리 높일 일이 없고, 사진 찍기도 편해요.</p><p>양가 어른 모시는 상견례나 회사 손님 모시는 자리로도 괜찮겠다 싶었어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/09.jpg\" style=\"max-width:100%\"></p><p>주방은 열린 주방이라 음식 만드는 모습이 보여요. 깔끔해서 믿음이 갔어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">03 메뉴와 가격</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/11.jpg\" style=\"max-width:100%\"></p><p>저녁 코스 메뉴판이에요. 한우 양(80g·120g·150g)에 따라 값이 달라요.</p><p><br></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">저녁 코스</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">1인 가격</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">A코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">99,000원 / 109,000원 / 119,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">B코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">129,000원 / 139,000원 / 149,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">C코스</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">159,000원 / 169,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">시그니처</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">189,000원</td></tr></table><p><br></p><p>점심 코스는 39,000원부터 있어서 부담 없이 한 번 맛보기에도 좋아요.</p><p>저희는 저녁 B코스로 했어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">04 코스 하나씩</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/15.jpg\" style=\"max-width:100%\"></p><p>예약할 때 기념일이라고 말해 뒀더니 샴페인을 준비해 주셨어요.</p><p>직원분이 자리에서 잔에 직접 따라 주시니 시작부터 기분이 났어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/18.jpg\" style=\"max-width:100%\"></p><p>코스 시작 전에 오늘 쓸 재료를 상자째 보여 주세요.</p><p>캐비어, 트러플, 랍스터, 제철 채소까지.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/19.jpg\" style=\"max-width:100%\"></p><p>그리고 오늘의 주인공 한우. 이걸 보고 나니 기대가 확 올라가더라고요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">① 차완무시(일본식 계란찜)</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/21.jpg\" style=\"max-width:100%\"></p><p>훈연한 참송이, 성게알, 캐비어가 올라가 있어요.</p><p>숟가락을 넣으면 푸딩처럼 부드럽게 떠지고, 따뜻한 계란찜 위로 트러플 향이 은은하게 올라와요.</p><p>빈속을 살살 데워 주는 첫 숟가락이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">② 한입 요리 네 가지</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/23.jpg\" style=\"max-width:100%\"></p><p>오른쪽 위부터 시계 방향으로 먹으면 된다고 알려 주셨어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/25.jpg\" style=\"max-width:100%\"></p><p>김 타르트 안에는 초밥, 관자, 멜론이 들었고, 트러플 소스 올린 한우 안심도 한 점.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/27.jpg\" style=\"max-width:100%\"></p><p>마지막은 새우와 랍스터를 넣은 스프링롤. 씹는 순간 바삭 소리가 나요.</p><p>네 가지가 식감이 다 달라서 하나씩 집어 먹는 재미가 있어요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">③ 참치와 절인 알배추</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/28.jpg\" style=\"max-width:100%\"></p><p>참치 안에 절임무와 미나리가 들었어요.</p><p>유자간장을 찍어 먹으니 새콤하게 입안이 싹 정리돼요. 다음 요리 먹기 전에 딱 좋은 순서예요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">④ 단호박 수프</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/30.jpg\" style=\"max-width:100%\"></p><p>구운 버섯, 곶감, 다진 잣에 트러플 오일까지.</p><p>떠먹으면 단호박 단맛이 먼저 오고, 잣이 고소하게 따라와요. 찬 바람 부는 날 생각날 맛이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑤ 찐 전복</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/32.jpg\" style=\"max-width:100%\"></p><p>애호박찜, 무조림, 대파조림에 실다시마를 곁들였어요.</p><p>간장 소스에 찍으니 전복이 쫄깃하고 감칠맛이 길게 남아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑥ 장어 주먹밥</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/34.jpg\" style=\"max-width:100%\"></p><p>볏짚에 훈연한 장어를 시오콘부 주먹밥 위에 올렸어요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/35.jpg\" style=\"max-width:100%\"></p><p>직원분이 따뜻한 육수를 부어 주세요.</p><p>주먹밥을 살짝 풀어 장어랑 같이 떠먹으면 오차즈케처럼 술술 넘어가요. 훈연 향이 육수에 배어서 구수해요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑦ 들기름 돌문어 한우국수</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/38.jpg\" style=\"max-width:100%\"></p><p>얇은 카펠리니 면 위에 다진 한우, 참나물, 돌문어.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/39.jpg\" style=\"max-width:100%\"></p><p>유자·레몬 육수랑 비벼 먹으니 상큼한데 들기름 덕에 끝맛은 고소해요. 코스 중간에 입맛 다시 살려 주는 한 그릇이에요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑧ 메인, 한우구이와 미역국 반상</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/40.jpg\" style=\"max-width:100%\"></p><p>드디어 메인이에요. 갓김치, 고사리나물, 씨앗젓갈까지 한 상이 차려져요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/41.jpg\" style=\"max-width:100%\"></p><p>한우는 육즙이 빠지지 않게 초벌해서 나와요.</p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/42.jpg\" style=\"max-width:100%\"></p><p><span style=\"background-color:#fff8b2\"><b>내 앞 화로에서 내가 원하는 만큼 구워 먹어요.</b></span></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/43.jpg\" style=\"max-width:100%\"></p><p>겉만 살짝 익혀 한 점, 조금 더 익혀 한 점. 서두를 필요 없이 내 속도로 먹을 수 있어서 좋았어요.</p><p>코스라 양이 적을까 걱정했는데, <span style=\"background-color:#fff8b2\"><b>밥과 국을 남길 만큼 배불렀어요.</b></span></p><p><br></p><p><br></p><p><b><span style=\"font-size:19px\">⑨ 디저트</span></b></p><p style=\"text-align:center\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/45.jpg\" style=\"max-width:100%\"></p><p>기념일이라고 말해 뒀더니 접시에 레터링까지 해 주셨어요.</p><p>폴라로이드 사진도 찍어서 바로 뽑아 주셨고요. 음식만큼 이 마음이 오래 남아요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">05 아쉬운 점</span></b></p><p>가격이 가볍지는 않아요. 둘이 저녁 코스면 25만원이 넘어요.</p><p>그리고 차를 가져가면 주차장 입구가 좁은 게 걸려요. 큰 차라면 지하철이 마음 편해요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">06 총평</span></b></p><p>한 줄로 말하면 \"조용한 방에서 한우 코스를 천천히, 대접받으며 먹는 집\"이에요.</p><p>기념일, 상견례, 부모님 모시는 날처럼 자리가 중요한 날에 추천해요.</p><p>재방문 ○. 다음엔 부모님 모시고 다시 오려고요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">07 오늘 쓴 돈(메뉴판 기준)</span></b></p><table style=\"border-collapse:collapse;width:100%\"><tr><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">메뉴</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">수량</th><th style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center;background:#23262C;color:#fff\">금액</th></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">저녁 B코스(한우 80g 기준)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">2인</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">콜키지</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">-</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">0원</td></tr><tr><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">합계(2명)</td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\"></td><td style=\"border:1px solid #D5D6E3;padding:10px 14px;text-align:center\">258,000원부터(1인 129,000원)</td></tr></table><p><br></p><p>한우 양을 120g·150g으로 고르면 1인 1만원씩 올라가요.</p><p><br></p><p><br></p><p><b><span style=\"font-size:24px;color:#23262C\">08 위치</span></b></p><p style=\"background:#F2F2F2;padding:14px;color:#888\">[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층] ← 여기서 네이버 에디터 [장소] 버튼으로 지도 넣기</p><p>여의도역 3번 출구에서 횡단보도 하나만 건너면 돼요. IFC몰·더현대 서울 바로 옆이에요.</p><p>코스는 2인부터라 예약하고 가시는 게 좋아요.</p><p style=\"text-align:center\"><a href=\"https://www.youtube.com/@bluno-economy\"><img src=\"https://raw.githubusercontent.com/redstar1492-design/bluno-blog-img/main/test-wooara/post-footer.png\" style=\"max-width:100%\"></a></p><p>블루노.</p><p><br></p><p>#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #내돈내산 #블루노</p>", FULLPLAIN="\n\n📍 서울 영등포구 국제금융로2길 36 지하1층\n🚇 5·9호선 여의도역 3번 출구, 횡단보도 하나 건너면 바로\n🅿 주차 가능(입구가 좁아 높이 2m 넘는 차, 차체 낮은 차는 어려울 수 있음)\n🍷 콜키지 프리(병 수 제한 없음)\n🍽 코스는 2인부터 주문\n⏱ 영업시간·전화는 네이버 지도에서 확인해 주세요\n\n기념일이라 오랜만에 조용한 데서 제대로 한 끼 먹고 싶었어요.\n시끄러운 고깃집 말고, 둘이서 얘기 나누면서 천천히 먹을 수 있는 곳.\n그래서 고른 곳이 여의도역 바로 앞 한우 오마카세 집, 우아라예요.\n내 돈 내고 먹은 솔직한 후기입니다.\n\n01 찾아가는 길\n\n\n\n여의도역 3번 출구로 나와 횡단보도 하나만 건너면 이 건물이에요.\nIFC몰, 더현대 서울이 코앞이라 쇼핑하고 들르기에도 좋은 자리예요.\n\n\n\n차를 가져가신다면 주차장 입구를 꼭 보세요.\n입구가 좁아서 높이 2m 넘는 차나 차체가 낮은 차는 못 들어갈 수 있어요.\n\n\n\n그리고 하나 더. 여기는 콜키지 프리, 그것도 병 수 제한이 없어요.\n아껴 둔 와인이나 위스키 한 병 들고 가면 한우랑 짝 맞추기 좋아요.\n\n02 입구와 분위기\n\n\n\n건물 지하 1층으로 내려가면 바로 간판이 보여요.\n\n\n\n입구에서 예약을 확인하고 직원분 안내를 따라 들어갔어요.\n\n\n\n복도 양쪽으로 방이 쭉 있어요. 방이 20개 정도래요.\n\n\n\n모든 자리가 따로 떨어진 방이에요.\n옆 테이블 소리가 안 들리니 목소리 높일 일이 없고, 사진 찍기도 편해요.\n양가 어른 모시는 상견례나 회사 손님 모시는 자리로도 괜찮겠다 싶었어요.\n\n\n\n주방은 열린 주방이라 음식 만드는 모습이 보여요. 깔끔해서 믿음이 갔어요.\n\n03 메뉴와 가격\n\n\n\n저녁 코스 메뉴판이에요. 한우 양(80g·120g·150g)에 따라 값이 달라요.\n\n저녁 코스\t1인 가격\nA코스\t99,000원 / 109,000원 / 119,000원\nB코스\t129,000원 / 139,000원 / 149,000원\nC코스\t159,000원 / 169,000원\n시그니처\t189,000원\n\n점심 코스는 39,000원부터 있어서 부담 없이 한 번 맛보기에도 좋아요.\n저희는 저녁 B코스로 했어요.\n\n04 코스 하나씩\n\n\n\n예약할 때 기념일이라고 말해 뒀더니 샴페인을 준비해 주셨어요.\n직원분이 자리에서 잔에 직접 따라 주시니 시작부터 기분이 났어요.\n\n\n\n코스 시작 전에 오늘 쓸 재료를 상자째 보여 주세요.\n캐비어, 트러플, 랍스터, 제철 채소까지.\n\n\n\n그리고 오늘의 주인공 한우. 이걸 보고 나니 기대가 확 올라가더라고요.\n\n① 차완무시(일본식 계란찜)\n\n\n\n훈연한 참송이, 성게알, 캐비어가 올라가 있어요.\n숟가락을 넣으면 푸딩처럼 부드럽게 떠지고, 따뜻한 계란찜 위로 트러플 향이 은은하게 올라와요.\n빈속을 살살 데워 주는 첫 숟가락이에요.\n\n② 한입 요리 네 가지\n\n\n\n오른쪽 위부터 시계 방향으로 먹으면 된다고 알려 주셨어요.\n\n\n\n김 타르트 안에는 초밥, 관자, 멜론이 들었고, 트러플 소스 올린 한우 안심도 한 점.\n\n\n\n마지막은 새우와 랍스터를 넣은 스프링롤. 씹는 순간 바삭 소리가 나요.\n네 가지가 식감이 다 달라서 하나씩 집어 먹는 재미가 있어요.\n\n③ 참치와 절인 알배추\n\n\n\n참치 안에 절임무와 미나리가 들었어요.\n유자간장을 찍어 먹으니 새콤하게 입안이 싹 정리돼요. 다음 요리 먹기 전에 딱 좋은 순서예요.\n\n④ 단호박 수프\n\n\n\n구운 버섯, 곶감, 다진 잣에 트러플 오일까지.\n떠먹으면 단호박 단맛이 먼저 오고, 잣이 고소하게 따라와요. 찬 바람 부는 날 생각날 맛이에요.\n\n⑤ 찐 전복\n\n\n\n애호박찜, 무조림, 대파조림에 실다시마를 곁들였어요.\n간장 소스에 찍으니 전복이 쫄깃하고 감칠맛이 길게 남아요.\n\n⑥ 장어 주먹밥\n\n\n\n볏짚에 훈연한 장어를 시오콘부 주먹밥 위에 올렸어요.\n\n\n\n직원분이 따뜻한 육수를 부어 주세요.\n주먹밥을 살짝 풀어 장어랑 같이 떠먹으면 오차즈케처럼 술술 넘어가요. 훈연 향이 육수에 배어서 구수해요.\n\n⑦ 들기름 돌문어 한우국수\n\n\n\n얇은 카펠리니 면 위에 다진 한우, 참나물, 돌문어.\n\n\n\n유자·레몬 육수랑 비벼 먹으니 상큼한데 들기름 덕에 끝맛은 고소해요. 코스 중간에 입맛 다시 살려 주는 한 그릇이에요.\n\n⑧ 메인, 한우구이와 미역국 반상\n\n\n\n드디어 메인이에요. 갓김치, 고사리나물, 씨앗젓갈까지 한 상이 차려져요.\n\n\n\n한우는 육즙이 빠지지 않게 초벌해서 나와요.\n\n\n\n내 앞 화로에서 내가 원하는 만큼 구워 먹어요.\n\n\n\n겉만 살짝 익혀 한 점, 조금 더 익혀 한 점. 서두를 필요 없이 내 속도로 먹을 수 있어서 좋았어요.\n코스라 양이 적을까 걱정했는데, 밥과 국을 남길 만큼 배불렀어요.\n\n⑨ 디저트\n\n\n\n기념일이라고 말해 뒀더니 접시에 레터링까지 해 주셨어요.\n폴라로이드 사진도 찍어서 바로 뽑아 주셨고요. 음식만큼 이 마음이 오래 남아요.\n\n05 아쉬운 점\n가격이 가볍지는 않아요. 둘이 저녁 코스면 25만원이 넘어요.\n그리고 차를 가져가면 주차장 입구가 좁은 게 걸려요. 큰 차라면 지하철이 마음 편해요.\n\n06 총평\n한 줄로 말하면 \"조용한 방에서 한우 코스를 천천히, 대접받으며 먹는 집\"이에요.\n기념일, 상견례, 부모님 모시는 날처럼 자리가 중요한 날에 추천해요.\n재방문 ○. 다음엔 부모님 모시고 다시 오려고요.\n\n07 오늘 쓴 돈(메뉴판 기준)\n메뉴\t수량\t금액\n저녁 B코스(한우 80g 기준)\t2인\t258,000원\n콜키지\t-\t0원\n합계(2명)\t\t258,000원부터(1인 129,000원)\n\n한우 양을 120g·150g으로 고르면 1인 1만원씩 올라가요.\n\n08 위치\n[지도: 우아라 여의도점 · 서울 영등포구 국제금융로2길 36 지하1층]\n여의도역 3번 출구에서 횡단보도 하나만 건너면 돼요. IFC몰·더현대 서울 바로 옆이에요.\n코스는 2인부터라 예약하고 가시는 게 좋아요.\n\n\n\n블루노.\n\n#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #내돈내산 #블루노";
const TITLE="[여의도역 맛집] 우아라 여의도점 - 전 좌석 룸에서 먹는 한우 오마카세, 기념일·상견례 자리로 딱", TAGS="#여의도맛집 #여의도역맛집 #우아라 #우아라여의도점 #한우오마카세 #여의도한우 #여의도룸식당 #상견례장소 #기념일데이트 #콜키지프리 #내돈내산 #블루노";
let i=0;
const list=document.getElementById('list');
P.forEach((p,k)=>{const d=document.createElement('div');d.className='p';d.id='p'+k;
 d.innerHTML='<span class="n">'+(k+1)+'</span><button class="copy">이것만 복사</button>'+(p.kind==='img'?'<img src="'+p.data+'">':p.html);
 d.querySelector('.copy').onclick=()=>copy(k,false);list.appendChild(d);});
async function copy(k,adv=true){const p=P[k];
 try{ if(p.kind==='img'){const b=await (await fetch(p.data)).blob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);}
 else{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([p.html],{type:'text/html'}),'text/plain':new Blob([p.plain],{type:'text/plain'})})]);}
 document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur'));
 const el=document.getElementById('p'+k);el.classList.add('cur','done');el.scrollIntoView({block:'center',behavior:'smooth'});
 if(adv) i=k+1; show((p.kind==='img'?'이미지':'글')+' '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');
 }catch(e){ if(p.kind==='text'){const el=document.getElementById('p'+k);const r=document.createRange();r.selectNodeContents(el);r.setStartAfter(el.querySelector('.copy'));const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');s.removeAllRanges();if(ok){el.classList.add('cur','done');if(adv)i=k+1;show('글 '+(k+1)+'/'+P.length+' 복사됨 → 네이버에 Ctrl+V');return;}} show('복사 실패: '+e.message+' (이미지는 그림 위 오른쪽 클릭 → 이미지 복사)');}}
function show(t){document.getElementById('status').textContent=t;}
document.getElementById('next').onclick=()=>{ if(i>=P.length){show('끝! 태그 복사 후 발행하세요');return;} copy(i); };
document.getElementById('all').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([FULL],{type:'text/html'}),'text/plain':new Blob([FULLPLAIN],{type:'text/plain'})})]);show('본문 전체(글+이미지 '+P.filter(p=>p.kind==='img').length+'장) 복사됨 → 네이버 본문에 Ctrl+V 한 번');}catch(e){show('복사 실패: '+e.message);}};
document.getElementById('reset').onclick=()=>{i=0;document.querySelectorAll('.p').forEach(e=>e.classList.remove('cur','done'));show('처음부터');window.scrollTo(0,0);};
document.getElementById('ctitle').onclick=async()=>{await navigator.clipboard.writeText(TITLE);show('제목 복사됨');};
document.getElementById('ctags').onclick=async()=>{await navigator.clipboard.writeText(TAGS);show('태그 복사됨');};
show('조각 '+P.length+'개 (이미지 '+P.filter(p=>p.kind==='img').length+'장)');
</script></body></html>
